# Corre las pruebas en navegador en cada push y pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run validar
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "1"
