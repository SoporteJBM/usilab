C y como levadura a 37 \xB0C.","Epidermophyton floccosum afecta piel y u\xF1as, pero nunca el pelo.","Trichophyton rubrum da una colonia con reverso rojo vinoso.","Aspergillus terreus es resistente a la anfotericina B.","Aspergillus flavus produce aflatoxinas, asociadas a c\xE1ncer hep\xE1tico.","Rhizopus crece incluso a 50 \xB0C; sus puntos negros en la colonia son los esporangios.","Penicillium crece desde 4 \xB0C hasta 45 \xB0C y suele ser un contaminante ambiental."],bacterias:["Proteus mirabilis alcaliniza la orina con su ureasa y forma c\xE1lculos de estruvita.","Proteus es H\u2082S positivo e indol negativo; Morganella, al rev\xE9s.","Klebsiella se ve muy mucoide en MacConkey por su c\xE1psula.","Los BAAR se ven rojos porque sus \xE1cidos mic\xF3licos retienen la fucsina.","En el Per\xFA, la Shigella m\xE1s frecuente es S. flexneri.","Campylobacter necesita microaerofilia y puede tardar hasta 72 horas en crecer.","Una orina verde puede deberse a Pseudomonas aeruginosa."],virus:["El VIH usa el receptor CD4 y un correceptor (CCR5 o CXCR4) para entrar a la c\xE9lula.","Fiebre con ves\xEDculas en boca, palmas y plantas en un lactante sugiere Coxsackie: enfermedad mano-pie-boca.","El aciclovir puede precipitar en los t\xFAbulos renales: por eso se hidrata bien al paciente.","El oseltamivir funciona mejor si se inicia en las primeras 48 horas de la influenza.","Solo anti-HBs positivo indica vacunaci\xF3n contra hepatitis B; con anti-HBc, infecci\xF3n pasada.","El virus influenza A puede cambiar mucho (shift) porque su genoma est\xE1 segmentado.","Cerca del 8 % de tu genoma son restos de virus antiguos: los retrovirus end\xF3genos humanos (HERVs).","La placenta existe gracias a la sincitina, una prote\xEDna de origen viral que hace fusionar las c\xE9lulas.","La prote\xEDna Arc, clave para formar recuerdos de largo plazo, viene de genes de retrovirus.","El VIH-1 vino del SIV de los chimpanc\xE9s y el VIH-2 del de los monos mangabey: el VIH es zoon\xF3tico.","El HTLV-1 fue el primer retrovirus humano descubierto, en 1980; el Per\xFA es zona end\xE9mica.","El SIDA se reconoci\xF3 en 1981 por 5 casos de neumon\xEDa por Pneumocystis en hombres j\xF3venes de Los \xC1ngeles.","La vacuna del VPH est\xE1 hecha con L1 de la c\xE1pside: son part\xEDculas vac\xEDas, sin ADN, que no infectan.","El ant\xEDgeno p24 del VIH aparece antes que los anticuerpos: por eso las pruebas de 4.\xAA generaci\xF3n acortan la ventana."],parasitos:["El coprol\xF3gico se procesa en menos de 30 minutos para no perder la movilidad de los trofozo\xEDtos.","El lugol resalta n\xFAcleos y membranas de los quistes; la soluci\xF3n salina deja ver lo que se mueve.","Un coprol\xF3gico negativo no descarta parasitosis: a veces hacen falta ex\xE1menes seriados.","Si la muestra de heces se retrasa, se conserva en formol al 10 % o en PVA.","Leucocitos y hemat\xEDes en heces sugieren invasi\xF3n intestinal, como amebiasis o shigelosis.","Trichomonas vaginalis puede verse en el sedimento urinario: es una pera con flagelos que se mueve.","El test de Graham se hace con cinta adhesiva en la regi\xF3n perianal al despertar: busca huevos de Enterobius.","En un paciente con corticoides, Strongyloides puede causar hiperinfecci\xF3n por autoinfecci\xF3n.","Comer berros crudos es el antecedente t\xEDpico de la fasciolosis. Se trata con triclabendazol.","Loxosceles laeta, la ara\xF1a del rinc\xF3n, puede causar hem\xF3lisis adem\xE1s de la placa necr\xF3tica.","P. vivax deja hipnozo\xEDtos en el h\xEDgado: por eso se agrega primaquina."],laboratorio:["El in\xF3culo del antibiograma se ajusta a McFarland 0.5, unos 1.5 \xD7 10\u2078 UFC/mL.","Si el in\xF3culo es m\xE1s denso que McFarland 0.5, los halos salen peque\xF1os: falsos resistentes.","Con asa de 0.001 mL, cada colonia del urocultivo vale 1000 UFC/mL.","M\xE1s de 15 c\xE9lulas epiteliales escamosas por campo indican muestra de orina contaminada.","AmpC no se inhibe con clavul\xE1nico y es resistente a cefoxitina; la BLEE s\xED se inhibe.","En pacientes con sonda, la orina se toma del tubo de drenaje, nunca de la bolsa.","El urocultivo se procesa en menos de 2 horas o se refrigera a 4 \xB0C.","En XLD, Salmonella sale roja con centro negro; Shigella, roja sin centro negro."],tratamientos:["En una candidemia por cat\xE9ter, adem\xE1s del antif\xFAngico hay que retirar el cat\xE9ter.","La tricomoniasis se trata con metronidazol a la paciente y a su pareja.","La TB sensible se trata con HRZE 2 meses y HR 4 meses; si es resistente a rifampicina, con BPaLM.","Proteus mirabilis tiene resistencia natural a la nitrofuranto\xEDna.","En cistitis no complicada por BLEE puede usarse fosfomicina en vez de un carbapen\xE9mico.","En bacterias, el tratamiento siempre se ajusta seg\xFAn el antibiograma."],micro:["Aspergillus termina en una ves\xEDcula; Penicillium se ramifica en pincel y no tiene ves\xEDcula.","Fusarium tiene macroconidias en canoa; Microsporum, en huso de pared gruesa y rugosa.","T. mentagrophytes muestra hifas en espiral y microconidios en racimo de uvas.","Paracoccidioides se reconoce por la levadura en 'rueda de tim\xF3n'.","Las hifas de Rhizopus son anchas y sin tabiques; las de Aspergillus son delgadas y septadas.","Sporothrix tiene conidios en margarita en la punta de la hifa."]};var re={"Escherichia coli":{queEs:"Bacilo Gram negativo, enterobacteria que fermenta lactosa. Es parte de la flora intestinal.",reconoce:"En MacConkey da colonias rosadas, planas y secas. Indol positivo y citrato negativo. Reduce nitratos a nitritos, por eso da nitritos positivos en la tira de orina.",produce:"Es la causa m\xE1s frecuente de cistitis y de pielonefritis. Algunas cepas causan diarrea: O157:H7, enteroinvasiva (EIEC), enterotoxig\xE9nica (ETEC) y enteropat\xF3gena (EPEC).",contagio:"Infecci\xF3n urinaria ascendente desde la flora intestinal; las cepas diarreicas, por v\xEDa fecal-oral.",diagnostico:"Urocultivo: 10\u2075 UFC/mL o m\xE1s de un solo germen es infecci\xF3n significativa. Coprocultivo para las cepas diarreicas.",tratamiento:"Cistitis: nitrofuranto\xEDna o fosfomicina seg\xFAn antibiograma. Si es BLEE: carbapen\xE9mico en infecci\xF3n grave; fosfomicina en cistitis no complicada.",datoExamen:"Se fija al urotelio con fimbrias tipo 1. Patr\xF3n BLEE: resistente a cefotaxima, ceftriaxona y aztreonam con sinergia con clavul\xE1nico. Patr\xF3n AmpC: sin sinergia y resistente a cefoxitina."},"Klebsiella pneumoniae":{queEs:"Bacilo Gram negativo encapsulado e inm\xF3vil, enterobacteria que fermenta lactosa.",reconoce:"Colonias rosadas muy mucoides en MacConkey, por su c\xE1psula. Indol negativo, citrato positivo, ureasa positiva.",produce:"Neumon\xEDa del l\xF3bulo superior derecho en alcoh\xF3licos, con esputo 'en jalea de grosella'. Tambi\xE9n infecci\xF3n urinaria e infecciones hospitalarias.",tratamiento:"Neumon\xEDa: ceftriaxona; si es BLEE, meropenem. Si es productora de carbapenemasa (KPC): ceftazidima-avibactam o colistina, con infectolog\xEDa.",datoExamen:"Sin halo alrededor de ning\xFAn disco, ni siquiera imipenem ni meropenem: carbapenemasa (KPC)."},"Proteus mirabilis":{queEs:"Bacilo Gram negativo muy m\xF3vil que no fermenta lactosa.",reconoce:"Colonias incoloras en MacConkey y swarming (crecimiento en ondas) en agar sangre. TSI K/A con H\u2082S positivo, indol negativo y ureasa muy intensa (+++).",produce:"Infecci\xF3n urinaria complicada, sobre todo en pacientes con sonda. Su ureasa alcaliniza la orina y forma c\xE1lculos de estruvita.",diagnostico:"Orina con pH alcalino (8.5), olor amoniacal y cristales de estruvita 'en tapa de ata\xFAd'.",tratamiento:"Ceftriaxona o ciprofloxacino seg\xFAn antibiograma y cambiar la sonda. No usar nitrofuranto\xEDna: tiene resistencia natural.",datoExamen:"Proteus es H\u2082S positivo e indol negativo; Morganella es al rev\xE9s."},"Morganella morganii":{queEs:"Bacilo Gram negativo, pariente cercano de Proteus.",reconoce:"H\u2082S negativo, indol positivo y ureasa positiva.",datoExamen:"Es el diagn\xF3stico diferencial de Proteus en las pruebas bioqu\xEDmicas: lo contrario en H\u2082S e indol."},"Pseudomonas aeruginosa":{queEs:"Bacilo Gram negativo no fermentador, oxidasa positivo.",reconoce:"Pigmento verde-azulado y olor a uvas.",produce:"Infecciones hospitalarias: neumon\xEDa asociada a ventilador, infecci\xF3n urinaria en pacientes con sonda. Puede te\xF1ir la orina de verde.",tratamiento:"Siempre seg\xFAn antibiograma.",datoExamen:"Si es resistente a carbapen\xE9micos, el mecanismo puede ser la p\xE9rdida de una porina o una carbapenemasa; una BLEE sola no lo explica."},Salmonella:{queEs:"Bacilo Gram negativo que no fermenta lactosa y produce H\u2082S.",reconoce:"Incolora en MacConkey. En XLD, roja con centro negro; en SS, incolora con centro negro. Se enriquece en caldo selenito.",produce:"Fiebre tifoidea y paratifoidea (S. Typhi, S. Paratyphi) y gastroenteritis (S. Enteritidis).",contagio:"Fecal-oral, por agua o alimentos contaminados.",diagnostico:"Coprocultivo; si la muestra demora m\xE1s de 2 horas, transportarla en Cary-Blair.",datoExamen:"S. Typhi deja portadores cr\xF3nicos, que se siguen con coprocultivos. Es una de las bacterias m\xE1s frecuentes del coprocultivo en Per\xFA."},Shigella:{queEs:"Bacilo Gram negativo inm\xF3vil que no fermenta lactosa ni produce H\u2082S.",reconoce:"En XLD, roja sin centro negro; en SS, incolora.",produce:"Disenter\xEDa: diarrea con sangre, moco y fiebre. El coprol\xF3gico muestra leucocitos y hemat\xEDes (patr\xF3n inflamatorio).",contagio:"Fecal-oral. Su \xFAnico reservorio es el ser humano; moscas y alimentos solo la transportan.",diagnostico:"Coprocultivo.",datoExamen:"En Per\xFA la especie m\xE1s frecuente es S. flexneri. La toxina Shiga inactiva la subunidad 60S del ribosoma y se asocia al s\xEDndrome ur\xE9mico hemol\xEDtico."},"Campylobacter jejuni":{queEs:"Bacilo Gram negativo curvo, pat\xF3geno intestinal.",reconoce:"Se siembra en agar Campylobacter, en microaerofilia, con lectura hasta 72 horas (el resto del coprocultivo se lee a las 24\u201348 h).",produce:"Gastroenteritis aguda.",diagnostico:"Coprocultivo con su medio especial.",datoExamen:"Si no se usa su medio en microaerofilia, no crece y el coprocultivo sale falsamente negativo."},"Vibrio cholerae (c\xF3lera)":{queEs:"Bacilo Gram negativo curvo, oxidasa positivo.",produce:"C\xF3lera: diarrea acuosa profusa, sin sangre, 'en agua de arroz', con deshidrataci\xF3n r\xE1pida.",datoExamen:"La toxina col\xE9rica activa la adenilato ciclasa (ADP-ribosila Gs): sube el AMPc y se secretan cloro y agua. Por eso la diarrea no tiene sangre ni leucocitos.",tratamiento:"Lo principal es la rehidrataci\xF3n."},"Staphylococcus aureus y MRSA":{queEs:"Coco Gram positivo en racimos, catalasa positivo y coagulasa positivo.",reconoce:"Hem\xF3lisis beta en agar sangre. La catalasa lo separa de Streptococcus y la coagulasa, de los dem\xE1s estafilococos.",produce:"Infecciones de piel y heridas, bacteriemia, neumon\xEDa.",tratamiento:"Sensible: oxacilina. MRSA: vancomicina (alternativas: linezolid o daptomicina; la daptomicina no sirve en neumon\xEDa porque la inactiva el surfactante).",datoExamen:"MRSA: sin halo alrededor de oxacilina (o cefoxitina). El gen mecA codifica PBP2a y lo hace resistente a todos los \u03B2-lact\xE1micos. Prueba D positiva: resistencia inducible a clindamicina."},"Streptococcus pneumoniae":{queEs:"Diplococo Gram positivo lanceolado.",reconoce:"Hem\xF3lisis alfa (halo verdoso) en agar sangre y sensible a optoquina.",produce:"Neumon\xEDa.",datoExamen:"Los estreptococos del grupo viridans tambi\xE9n dan hem\xF3lisis alfa, pero son resistentes a la optoquina."},Enterococcus:{queEs:"Coco Gram positivo.",reconoce:"No produce hem\xF3lisis en agar sangre (hem\xF3lisis gamma).",tratamiento:"Si es resistente a vancomicina: linezolid o daptomicina.",datoExamen:"Tiene resistencia natural a las cefalosporinas. Se vuelve resistente a vancomicina cambiando D-Ala-D-Ala por D-Ala-D-Lac."},"Mycobacterium tuberculosis":{queEs:"Bacilo \xE1cido-alcohol resistente (BAAR). Su pared rica en \xE1cidos mic\xF3licos no se ti\xF1e bien con Gram.",reconoce:"Ziehl-Neelsen: bacilos rojos o fucsia, a veces en cordones, sobre fondo azul (retienen la fucsina y resisten el alcohol-\xE1cido). En L\xF6wenstein-Jensen u Ogawa: colonias rugosas, secas, crema, 'en coliflor', a las 3\u20138 semanas, porque se replica cada 18\u201324 horas.",produce:"Tuberculosis pulmonar: tos de m\xE1s de 2 semanas, baja de peso, sudoraci\xF3n nocturna, hemoptisis.",contagio:"V\xEDa a\xE9rea.",diagnostico:"Baciloscop\xEDa (1\u201310 BAAR por campo en 50 campos = ++), cultivo y GeneXpert, que detecta el bacilo y la resistencia a rifampicina.",tratamiento:"Sensible: HRZE 2 meses y HR 4 meses, supervisado. Resistente a rifampicina: BPaLM (bedaquilina, pretomanid, linezolid y moxifloxacino).",datoExamen:"Efectos adversos: pirazinamida sube el \xE1cido \xFArico (evitar en gota); isoniazida da neuropat\xEDa (prevenir con piridoxina); etambutol, neuritis \xF3ptica; rifampicina ti\xF1e la orina de anaranjado y tiene muchas interacciones; estreptomicina es otot\xF3xica; H, R y Z son hepatot\xF3xicos."},"Mycoplasma pneumoniae":{queEs:"Bacteria sin pared celular.",datoExamen:"Por no tener pared, no responde a los \u03B2-lact\xE1micos; se trata con macr\xF3lidos o tetraciclinas."},"Bartonella (fiebre de la Oroya)":{queEs:"Bartonella bacilliformis, bacilo que invade los hemat\xEDes.",produce:"Enfermedad de Carri\xF3n: fase aguda (fiebre de la Oroya) con fiebre, palidez intensa, ictericia y hem\xF3lisis; fase eruptiva (verruga peruana).",contagio:"Picadura de la titira (Lutzomyia), en valles interandinos.",diagnostico:"Frotis de sangre con bacilos dentro de los hemat\xEDes."},MRSA:{queEs:"Staphylococcus aureus resistente a meticilina.",reconoce:"Sin halo alrededor de oxacilina o de cefoxitina en el antibiograma.",tratamiento:"Vancomicina; alternativas: linezolid o daptomicina (no en neumon\xEDa).",datoExamen:"El gen mecA codifica PBP2a: es resistente a todos los \u03B2-lact\xE1micos."},BLEE:{queEs:"Betalactamasa de espectro extendido, t\xEDpica de E. coli y Klebsiella.",reconoce:"Resistencia a cefotaxima, ceftriaxona y aztreonam, con sinergia (el halo se agranda) hacia el disco de amoxicilina-clavul\xE1nico; sensible a carbapen\xE9micos.",tratamiento:"Infecci\xF3n grave: carbapen\xE9mico (meropenem). Cistitis no complicada: fosfomicina.",datoExamen:"El clavul\xE1nico la inhibe y es sensible a cefoxitina: as\xED se distingue de AmpC."},AmpC:{queEs:"Betalactamasa que no se inhibe con clavul\xE1nico.",reconoce:"Resistente a cefoxitina y sin sinergia con clavul\xE1nico; suele seguir sensible a cefepime y carbapen\xE9micos.",datoExamen:"Diferencia con BLEE: la BLEE se inhibe con clavul\xE1nico y es sensible a cefoxitina."},"Carbapenemasa (KPC)":{queEs:"Enzima que destruye incluso los carbapen\xE9micos, t\xEDpica de Klebsiella pneumoniae.",reconoce:"Sin halo alrededor de ning\xFAn disco, ni siquiera imipenem ni meropenem. Si el halo es reducido pero 'sensible', se confirma con pruebas como Carba NP o mCIM.",tratamiento:"Ceftazidima-avibactam o colistina, con infectolog\xEDa."},"Candida albicans":{queEs:"Levadura. La m\xE1s importante de las Candida.",reconoce:"Pseudohifas con blastoconidias en racimos y clamidoconidias redondas de pared gruesa en la punta (agar harina de ma\xEDz). Tubo germinal positivo a las 2\u20133 horas a 37 \xB0C.",produce:"Muguet (placas blancas que se desprenden y dejan la base roja), vulvovaginitis, intertrigo, candidemia por cat\xE9ter y candiduria en diab\xE9ticos con sonda.",tratamiento:"Muguet: nistatina oral en suspensi\xF3n. Vulvovaginitis: fluconazol. Candidemia: equinocandina y retirar el cat\xE9ter. Candiduria: retirar o cambiar la sonda; fluconazol si hay s\xEDntomas.",datoExamen:"Entre las Candida comunes, solo C. albicans forma clamidoconidias. C. glabrata tolera mal los azoles y C. krusei es naturalmente resistente a fluconazol: en ellas, equinocandina.",fichaMicroscopio:"Candida albicans"},Rhodotorula:{queEs:"Levadura oportunista. Las especies de importancia m\xE9dica son R. mucilaginosa (rubra), R. glutinis y R. minuta.",reconoce:"Al Gram, levadura Gram positiva ovoide, con o sin yema. Colonias cremosas y rosadas por su pigmento carotenoide. Tubo germinal negativo.",produce:"Fungemia en inmunocomprometidos o con cat\xE9ter; rara en personas sanas.",tratamiento:"Retirar el cat\xE9ter y anfotericina B.",datoExamen:"Es naturalmente resistente a fluconazol y a las equinocandinas: a diferencia de Candida, esos f\xE1rmacos no sirven."},Cryptococcus:{queEs:"Levadura capsulada.",produce:"Meningitis (criptococosis men\xEDngea), sobre todo en pacientes inmunosuprimidos.",tratamiento:"Inducci\xF3n: anfotericina B m\xE1s flucitosina.",datoExamen:"Las equinocandinas no tienen actividad \xFAtil contra Cryptococcus."},"Aspergillus fumigatus":{queEs:"Moho hialino, el Aspergillus m\xE1s frecuente e importante.",reconoce:"Hifas hialinas septadas; conidi\xF3foro largo con ves\xEDcula y fi\xE1lides uniseriadas en 180\xB0. Colonia blanca que se vuelve verde azulada a gris, aterciopelada; crece de 25 \xB0C hasta 50 \xB0C.",produce:"Aspergilosis invasiva en neutrop\xE9nicos (TAC con signo del halo; galactomanano positivo), aspergiloma (bola f\xFAngica en una caverna, con media luna de aire) y aspergilosis broncopulmonar al\xE9rgica (asma, eosinofilia, IgE alta, bronquiectasias centrales).",tratamiento:"Invasiva: voriconazol. Aspergiloma: cirug\xEDa; embolizaci\xF3n si la hemoptisis es masiva. ABPA: corticoides sist\xE9micos e itraconazol.",datoExamen:"Su resistencia a azoles se debe a mutaciones en cyp51A. El halo normal orienta a Aspergillus; el halo invertido, a mucormicosis.",fichaMicroscopio:"Aspergillus"},"Aspergillus niger":{queEs:"Moho hialino con conidios negros.",reconoce:"Hifas hialinas estrechamente septadas y cabeza aspergilar biseriada. Colonias cubiertas por conidios negros, reverso incoloro o marfil.",produce:"Otitis externa (otomicosis), con secreci\xF3n negra, t\xEDpica en nadadores, y aspergiloma.",tratamiento:"Otomicosis: limpieza del conducto y clotrimazol t\xF3pico.",fichaMicroscopio:"Aspergillus"},"Aspergillus flavus":{queEs:"Aspergillus de ambientes c\xE1lidos.",produce:"Aspergilosis invasiva y sinusitis.",datoExamen:"Produce aflatoxinas, asociadas a c\xE1ncer hep\xE1tico."},"Aspergillus terreus":{queEs:"Aspergillus que causa aspergilosis invasiva en inmunodeprimidos.",tratamiento:"Voriconazol.",datoExamen:"Es resistente a la anfotericina B."},Penicillium:{queEs:"Moho hialino ambiental.",reconoce:"Hifas delgadas hialinas tabicadas; conidi\xF3foros ramificados 'en pincel', sin ves\xEDcula, con conidios en cadena. Colonia azul verdosa con borde blanco, aterciopelada o pulverulenta; reverso blanco. Crece de 4 \xB0C a 45 \xB0C.",produce:"Sobre todo es un contaminante ambiental.",tratamiento:"Generalmente no requiere tratamiento: se correlaciona con la cl\xEDnica.",datoExamen:"El pincel sin ves\xEDcula lo separa de Aspergillus.",fichaMicroscopio:"Penicillium"},Fusarium:{queEs:"Moho hialino septado.",reconoce:"Macroconidias en canoa o media luna, hialinas y multiseptadas; microconidias peque\xF1as. Colonias de crecimiento r\xE1pido, algodonosas, blancas, crema, rosadas o p\xFArpura.",produce:"Queratitis por trauma vegetal o lentes de contacto (\xFAlcera de bordes plumosos, hipopi\xF3n) y fusariosis diseminada en neutrop\xE9nicos.",tratamiento:"Queratitis: natamicina t\xF3pica (alternativa: voriconazol). Diseminada: voriconazol con o sin anfotericina B.",datoExamen:"Su canoa es de pared delgada y lisa; el huso de Microsporum es de pared gruesa y rugosa.",fichaMicroscopio:"Fusarium"},"Rhizopus (mucormicosis)":{queEs:"Hongo mucoral (cenoc\xEDtico).",reconoce:"Hifas anchas, no septadas o escasamente septadas, en cinta, ramificadas en \xE1ngulo recto; esporangios redondos y rizoides. Colonia algodonosa blanca con puntos negros (los esporangios); crece hasta 50 \xB0C.",produce:"Mucormicosis rinocerebral, la m\xE1s frecuente: diab\xE9tico con cetoacidosis, dolor facial, congesti\xF3n, escara negra en el paladar o los cornetes; invade \xF3rbita y cerebro. Forma pulmonar: TAC con halo invertido.",tratamiento:"Anfotericina B liposomal, desbridamiento quir\xFArgico urgente y corregir la cetoacidosis.",datoExamen:"El voriconazol no cubre mucorales. La acidosis libera hierro, que el hongo aprovecha; la deferoxamina tambi\xE9n le entrega hierro.",fichaMicroscopio:"Rhizopus"},Cladosporium:{queEs:"Hongo demati\xE1ceo (marr\xF3n).",reconoce:"Conidios peque\xF1os y ovalados en cadenas ramificadas, con c\xE9lulas escudo.",produce:"Contaminante y al\xE9rgeno (asma, rinitis); rara vez feohifomicosis.",tratamiento:"Itraconazol (referencia).",fichaMicroscopio:"Cladosporium"},Alternaria:{queEs:"Hongo demati\xE1ceo (marr\xF3n).",reconoce:"Conidios grandes, marrones y muriformes (tabiques transversales y longitudinales), en forma de maza con pico, en cadena.",produce:"Al\xE9rgeno (sinusitis f\xFAngica al\xE9rgica, asma); feohifomicosis y queratitis en inmunodeprimidos.",tratamiento:"Itraconazol o voriconazol, con o sin cirug\xEDa.",fichaMicroscopio:"Alternaria"},"Trichophyton rubrum":{queEs:"Dermatofito.",reconoce:"Hifas septadas delgadas con pocos conidios; si aparecen, microconidios en l\xE1grima pegados a la hifa. Colonia blanca con reverso rojo vinoso.",produce:"Tinea pedis cr\xF3nica, onicomicosis, tinea cruris y corporis.",tratamiento:"Onicomicosis: terbinafina oral por 12 semanas, m\xE1s t\xF3pico en la piel.",fichaMicroscopio:"Trichophyton rubrum"},"Trichophyton mentagrophytes":{queEs:"Dermatofito.",reconoce:"Microconidios redondos en racimos, como uvas, e hifas en espiral.",produce:"Tinea pedis inflamatoria, tinea corporis, tinea barbae y querion.",tratamiento:"Terbinafina t\xF3pica u oral.",fichaMicroscopio:"Trichophyton mentagrophytes"},"Microsporum canis":{queEs:"Dermatofito zoof\xEDlico.",reconoce:"Macroconidios en huso, de pared gruesa y rugosa, con muchos tabiques.",produce:"Tinea capitis en ni\xF1os con gatos o perros (placas de alopecia con descamaci\xF3n; l\xE1mpara de Wood positiva) y tinea corporis.",tratamiento:"Griseofulvina oral; revisar a la mascota. Ante un querion, no tratar solo con t\xF3pico ni drenarlo como absceso.",fichaMicroscopio:"Microsporum canis"},"Epidermophyton floccosum":{queEs:"Dermatofito.",reconoce:"Macroconidios en mazo, de pared lisa y 2 a 4 c\xE9lulas, en grupos. Sin microconidios.",produce:"Tinea pedis, cruris, corporis y onicomicosis.",tratamiento:"Terbinafina o azoles t\xF3picos.",datoExamen:"Nunca afecta el pelo.",fichaMicroscopio:"Epidermophyton floccosum"},"Histoplasma capsulatum":{queEs:"Hongo dim\xF3rfico.",reconoce:"Fase moho: macroconidias tuberculadas (redondas, con espinas). En tejido: levaduras peque\xF1as dentro de los macr\xF3fagos.",produce:"Histoplasmosis: se adquiere en cuevas con murci\xE9lagos (Tingo Mar\xEDa). En VIH se disemina: fiebre, baja de peso, hepatoesplenomegalia y pancitopenia.",tratamiento:"Itraconazol; en casos graves o diseminados, anfotericina B liposomal y luego itraconazol.",fichaMicroscopio:"Histoplasma capsulatum"},"Paracoccidioides brasiliensis":{queEs:"Hongo dim\xF3rfico.",reconoce:"Levadura madre grande con m\xFAltiples gemaciones alrededor: 'rueda de tim\xF3n'.",produce:"Paracoccidioidomicosis: agricultor de la selva con tos cr\xF3nica y BK negativa, \xFAlceras orales moriformes y adenopat\xEDas.",tratamiento:"Itraconazol (6 a 12 meses); en casos graves, anfotericina B.",fichaMicroscopio:"Paracoccidioides brasiliensis"},"Sporothrix schenckii":{queEs:"Hongo dim\xF3rfico de inoculaci\xF3n.",reconoce:"Fase moho (25 \xB0C): hifas delgadas septadas con conidios en margarita o roseta en la punta. En tejido: levaduras en forma de puro.",produce:"Esporotricosis linfocut\xE1nea: pinchazo con rosal o madera, n\xF3dulo que se ulcera y n\xF3dulos en cadena que suben por los linf\xE1ticos.",tratamiento:"Itraconazol por 3 a 6 meses (alternativa: yoduro de potasio).",fichaMicroscopio:"Sporothrix schenckii"},VIH:{queEs:"Retrovirus del g\xE9nero Lentivirus. Esf\xE9rico, envuelto, con 2 copias de ARN de sentido positivo (Baltimore VI). Tipos VIH-1 (pandemia; grupo M > 90 %, subtipo B en Per\xFA) y VIH-2 (\xC1frica occidental, menos transmisible). Origen zoon\xF3tico: SIV de chimpanc\xE9s (VIH-1) y de monos mangabey (VIH-2).",reconoce:"gp120 se une a CD4; correceptor CCR5 al inicio y CXCR4 en fase avanzada; gp41 hace la fusi\xF3n. p24 es la c\xE1pside y p17 la matriz. Enzimas: transcriptasa inversa, integrasa y proteasa.",produce:"S\xEDndrome retroviral agudo (2\u20134 semanas) \u2192 latencia cl\xEDnica (8\u201310 a\xF1os) \u2192 fase sintom\xE1tica (CD4 200\u2013500) \u2192 SIDA (CD4 < 200): neumon\xEDa por Pneumocystis jirovecii, toxoplasmosis cerebral, TB extrapulmonar, candidiasis esof\xE1gica, CMV, Cryptococcus, sarcoma de Kaposi (HHV-8) y linfoma no Hodgkin (EBV).",tratamiento:"TARV de por vida. Primera l\xEDnea MINSA: TDF + 3TC + DTG (TLD), tambi\xE9n en gestantes y en coinfecci\xF3n con VHB. Con TB: TDF + 3TC + EFV. Falla renal: ABC + 3TC + DTG. Segunda l\xEDnea: AZT + 3TC + LPV/r. Rescate: DRV/r + RAL + ETR.",datoExamen:"Su transcriptasa inversa no corrige errores, se replica millones de veces al d\xEDa y recombina sus dos copias de ARN: por eso var\xEDa tanto y genera resistencias. No se erradica porque queda como provirus en reservorios.",contagio:"Sexual (la principal; m\xE1s riesgo en sexo anal receptivo), sangre (agujas, accidentes: \u2248 0,3 % por pinchazo) y vertical (m\xE1s en el parto). Transmiten sangre, semen, secreciones vaginales y leche; no saliva, sudor, l\xE1grimas ni orina.",diagnostico:"Tamizaje: ELISA 4.\xAA generaci\xF3n o prueba r\xE1pida. Si es reactiva, segunda prueba de otra metodolog\xEDa; discordantes: LIA o RT-qPCR. Western blot positivo = 2 bandas de envoltura (gp120/160 + gp41). Neonato: PCR a las 2 semanas, 1 mes y 4\u20136 meses. Seguimiento con CD4 y carga viral."},"Hepatitis B":{queEs:"Virus de la hepatitis B.",diagnostico:"HBsAg positivo: infecci\xF3n actual. HBsAg negativo con anti-HBc IgG y anti-HBs positivos: infecci\xF3n pasada resuelta, con inmunidad. Solo anti-HBs positivo: vacunado.",datoExamen:"La vacuna solo contiene HBsAg, por eso no genera anti-HBc."},Influenza:{queEs:"Virus de ARN con genoma segmentado.",produce:"Gripe; puede causar pandemias.",tratamiento:"Oseltamivir: inhibe la neuraminidasa y frena la liberaci\xF3n de nuevos viriones; funciona mejor en las primeras 48 horas.",datoExamen:"El genoma segmentado permite el cambio antig\xE9nico mayor (shift) cuando dos virus intercambian segmentos; el drift son mutaciones peque\xF1as."},"Virus sincitial respiratorio":{queEs:"Virus respiratorio.",produce:"Es el agente m\xE1s frecuente de bronquiolitis en lactantes."},Adenovirus:{queEs:"Virus respiratorio.",produce:"La bronquiolitis obliterante es t\xEDpica del adenovirus."},Coxsackie:{queEs:"Enterovirus.",produce:"Enfermedad mano-pie-boca: lactante con fiebre y ves\xEDculas en lengua, paladar, palmas y plantas."},"Virus del papiloma humano":{queEs:"Familia Papillomaviridae (antes agrupado como papovavirus). ADN doble cadena (Baltimore I), no envuelto, de unos 55 nm.",produce:"Bajo riesgo (6 y 11): verrugas genitales (condiloma acuminado) y papilomatosis lar\xEDngea. Alto riesgo (16 y 18, entre otros): NIC 1\u20133 y c\xE1ncer de c\xE9rvix, ano, vagina, vulva, pene y orofaringe. Tipos cut\xE1neos (1, 2, 4, 7): verrugas comunes y plantares.",contagio:"Contacto directo piel a piel o mucosa a mucosa, sobre todo sexual, incluso sin lesiones visibles. Vertical en el parto vaginal. No por sangre ni por placenta: no hay viremia.",reconoce:"Genes tempranos: E1 (helicasa), E2 (regula la transcripci\xF3n), E4, E5, E6 (degrada p53) y E7 (inactiva Rb). Genes tard\xEDos: L1 (c\xE1pside principal) y L2. En la citolog\xEDa: coilocitos (halo perinuclear claro).",diagnostico:"Gold standard de tamizaje: co-test (Papanicolaou + PCR de VPH) de 30 a 65 a\xF1os. PCR de las regiones L1 o E6/E7; genotipificaci\xF3n por hibridaci\xF3n (RLB/INNO-LiPA).",tratamiento:"No hay antiviral curativo: se tratan las lesiones. Verrugas: imiquimod, podofilotoxina, \xE1cido tricloroac\xE9tico, crioterapia. NIC 2\u20133: LEEP o conizaci\xF3n. Prevenci\xF3n: vacuna tetravalente del MINSA (6, 11, 16, 18) a los 9\u201313 a\xF1os, 2 dosis.",datoExamen:"E6 \u2192 p53 y E7 \u2192 Rb. La persistencia permite la integraci\xF3n del ADN y la p\xE9rdida de E2, que deja a E6 y E7 sin control."},Citomegalovirus:{queEs:"Herpesvirus.",produce:"Infecci\xF3n cong\xE9nita: sordera neurosensorial, coriorretinitis y calcificaciones periventriculares.",tratamiento:"Ganciclovir.",datoExamen:"El CMV no tiene timidina quinasa: el aciclovir no se activa, en cambio el ganciclovir se activa con la quinasa viral UL97."},Herpes:{queEs:"Virus herpes simple.",produce:"Encefalitis herp\xE9tica.",tratamiento:"Aciclovir: an\xE1logo de nucle\xF3sido que se activa con la timidina quinasa viral, por eso act\xFAa solo en c\xE9lulas infectadas.",datoExamen:"El aciclovir puede precipitar en los t\xFAbulos renales: hay que vigilar la funci\xF3n renal e hidratar bien."},Dengue:{queEs:"Flavivirus.",contagio:"Picadura de mosquito.",datoExamen:"Una segunda infecci\xF3n con otro serotipo suele ser m\xE1s grave: los anticuerpos no neutralizantes facilitan la entrada del virus a los monocitos (potenciaci\xF3n dependiente de anticuerpos)."},"Rub\xE9ola y TORCH":{queEs:"La rub\xE9ola forma parte del grupo TORCH de infecciones cong\xE9nitas.",datoExamen:"TORCH: Toxoplasma, Otros (como s\xEDfilis), Rub\xE9ola, Citomegalovirus y Herpes.",tratamiento:"La rub\xE9ola se previene con la vacuna triple viral (sarampi\xF3n, paperas y rub\xE9ola)."},"Giardia lamblia":{queEs:"Protozoo flagelado intestinal.",reconoce:"Quiste (forma resistente e infectante) y trofozo\xEDto binucleado. Los trofozo\xEDtos pierden movilidad si la muestra tarda.",produce:"Diarrea prolongada, f\xE9tida, voluminosa y grasosa que flota; dolor c\xF3lico y distensi\xF3n.",contagio:"Fecal-oral: quistes en agua o alimentos contaminados.",diagnostico:"Coprol\xF3gico directo: procesar en menos de 30 minutos; si es negativo, ex\xE1menes seriados. Si aparece en orina, es contaminaci\xF3n fecal de la muestra.",tratamiento:"Metronidazol (alternativa: tinidazol)."},"Entamoeba histolytica":{queEs:"Protozoo intestinal.",reconoce:"Trofozo\xEDtos m\xF3viles y quistes en el coprol\xF3gico.",produce:"Amebiasis, con invasi\xF3n intestinal.",diagnostico:"Coprol\xF3gico: procesar en menos de 30 minutos para conservar la movilidad de los trofozo\xEDtos; leucocitos y hemat\xEDes sugieren invasi\xF3n. Si hay retraso, conservar en formol al 10 % o PVA.",datoExamen:"Soluci\xF3n salina para ver trofozo\xEDtos m\xF3viles; lugol para ver n\xFAcleos de quistes."},Cyclospora:{queEs:"Protozoo intestinal.",reconoce:"Su ooquiste se ve en el coprol\xF3gico directo (Pr\xE1ctica 4)."},"Trichomonas vaginalis":{queEs:"Protozoo flagelado urogenital.",reconoce:"En el sedimento urinario: forma de pera, con flagelos, que se mueve.",produce:"Tricomoniasis: flujo vaginal amarillo-verdoso espumoso y prurito.",contagio:"Transmisi\xF3n sexual.",tratamiento:"Metronidazol a la paciente y a su pareja; si no se trata a la pareja, se reinfecta."},"Plasmodium (malaria)":{queEs:"Protozoo de la sangre que causa la malaria (paludismo).",reconoce:"Trofozo\xEDtos en forma de anillo dentro de los hemat\xEDes, en la gota gruesa.",produce:"Fiebre c\xEDclica o parox\xEDstica, escalofr\xEDos, esplenomegalia, anemia e ictericia. P. falciparum puede causar malaria cerebral.",contagio:"Picadura de la hembra de Anopheles: entra el esporozo\xEDto, que va al h\xEDgado; de ah\xED salen merozo\xEDtos que invaden hemat\xEDes.",tratamiento:"P. falciparum: combinaci\xF3n con artemisinina (hay mucha resistencia a cloroquina). P. vivax: se agrega primaquina, descartando antes el d\xE9ficit de G6PD.",datoExamen:"P. vivax deja hipnozo\xEDtos en el h\xEDgado que causan reca\xEDdas. P. falciparum hace malaria cerebral por citoadherencia de los hemat\xEDes al endotelio."},"Toxoplasma gondii":{queEs:"Protozoo de tejidos; forma parte del TORCH.",produce:"En VIH avanzado: lesiones cerebrales con realce en anillo y convulsiones. Infecci\xF3n cong\xE9nita si la madre se infecta en el embarazo.",tratamiento:"Gestante con infecci\xF3n aguda: espiramicina, que reduce el paso por la placenta; si se confirma infecci\xF3n fetal, pirimetamina, sulfadiazina y \xE1cido fol\xEDnico."},Leishmania:{queEs:"Protozoo que vive dentro de los macr\xF3fagos.",produce:"Leishmaniasis cut\xE1nea: lesi\xF3n cr\xF3nica tras viajar a la selva (m\xE1cula, p\xE1pula, n\xF3dulo y \xFAlcera con costra).",contagio:"Picadura del fleb\xF3tomo (titira o manta blanca).",diagnostico:"Frotis o cultivo de la lesi\xF3n: par\xE1sitos dentro de macr\xF3fagos.",datoExamen:"L. braziliensis puede diseminarse a\xF1os despu\xE9s a la mucosa nasal y destruir el tabique (espundia): por eso se trata aunque la \xFAlcera cierre."},"Trypanosoma cruzi (Chagas)":{queEs:"Protozoo que causa la enfermedad de Chagas.",produce:"Chagas cr\xF3nico: coraz\xF3n (miocardiopat\xEDa) y tubo digestivo (megaes\xF3fago y megacolon).",contagio:"Chinche besucona (triatomino)."},"Enterobius vermicularis":{queEs:"Helminto intestinal (oxiuro).",produce:"Prurito anal nocturno.",diagnostico:"Test de Graham: cinta adhesiva en la regi\xF3n perianal al despertar, para buscar huevos."},"Strongyloides stercoralis":{queEs:"Helminto intestinal.",reconoce:"Larvas rabditiformes en heces (no huevos).",produce:"Dolor abdominal, diarrea y baja de peso. En pacientes con corticoides: hiperinfecci\xF3n.",datoExamen:"La hiperinfecci\xF3n se debe a la autoinfecci\xF3n: las larvas pasan a filariformes dentro del intestino y reinvaden. Arrastran bacterias: sepsis o meningitis por bacilos Gram negativos ent\xE9ricos."},"Ascaris lumbricoides":{queEs:"Helminto intestinal.",reconoce:"Huevos mamelonados en heces.",produce:"Primero tos, sibilancias y eosinofilia (las larvas pasan por el pulm\xF3n: s\xEDndrome de L\xF6ffler); despu\xE9s, dolor abdominal."},"Fasciola hepatica":{queEs:"Helminto de las v\xEDas biliares.",reconoce:"Huevos grandes, ovalados, operculados, amarillentos.",produce:"Dolor en hipocondrio derecho, fiebre intermitente, hepatomegalia y eosinofilia marcada.",contagio:"Comer berros crudos de riachuelos.",tratamiento:"Triclabendazol (el praziquantel no es eficaz contra Fasciola)."},"Taenia solium (cisticercosis)":{queEs:"Cestodo.",contagio:"Cisticercosis: ingiriendo huevos de T. solium por v\xEDa fecal-oral. Comer carne de cerdo con cisticercos da teniasis (el gusano adulto), no cisticercosis.",tratamiento:"Neurocisticercosis con quistes viables: albendazol con corticoides."},"Echinococcus (hidatidosis)":{queEs:"Cestodo que forma quistes hidat\xEDdicos, sobre todo en h\xEDgado y pulm\xF3n.",tratamiento:"Albendazol antes de la cirug\xEDa.",datoExamen:"Nunca punzar un quiste hidat\xEDdico sin protecci\xF3n: la fuga del l\xEDquido puede causar anafilaxia y sembrar nuevos quistes."},"Loxosceles laeta":{queEs:"Ara\xF1a del rinc\xF3n.",produce:"Loxoscelismo: placa viol\xE1cea con centro necr\xF3tico. La forma cut\xE1neo-visceral produce hem\xF3lisis: orina oscura y anemia."},"Latrodectus mactans":{queEs:"Viuda negra.",produce:"Latrodectismo: neurotoxina que causa agitaci\xF3n, espasmos musculares y rigidez abdominal."},"HTLV-1":{queEs:"Virus linfotr\xF3pico T humano tipo 1. Retrovirus del g\xE9nero Deltaretrovirus (ARN +, Baltimore VI). Fue el primer retrovirus humano descubierto (Gallo, 1980).",reconoce:"Infecta linfocitos T CD4+ (el HTLV-2 prefiere CD8+). No destruye la c\xE9lula: la transforma y la hace proliferar con Tax y HBZ. Receptores GLUT-1, NRP-1 y HSPG.",produce:"Leucemia/linfoma T del adulto (ATLL): menos del 5 % de los infectados, tras 20\u201340 a\xF1os; c\xE9lulas en flor e hipercalcemia. Paraparesia esp\xE1stica tropical (HAM/TSP): menos del 1 %, desmielinizaci\xF3n medular por la respuesta inmune.",contagio:"Por c\xE9lulas infectadas, no tanto por virus libre: lactancia materna (la v\xEDa m\xE1s importante en zonas end\xE9micas), sexual (m\xE1s de hombre a mujer) y parenteral (transfusiones, agujas, trasplantes). Per\xFA es end\xE9mico.",diagnostico:"ELISA de anticuerpos anti-HTLV (tamizaje) y Western blot, que distingue HTLV-1 de HTLV-2. PCR del ADN proviral (genes pol, tax o gag) y carga proviral.",tratamiento:"ATLL: quimioterapia (CHOP), zidovudina + interfer\xF3n \u03B1, trasplante de m\xE9dula en casos seleccionados. HAM/TSP: no hay cura; corticoides, interfer\xF3n y rehabilitaci\xF3n.",datoExamen:"HTLV-1 transforma (leucemia); el VIH destruye (inmunodeficiencia). Las c\xE9lulas en flor tienen n\xFAcleo multilobulado."},Sarampi\u00F3n:{queEs:"Paramyxovirus, ARN de sentido negativo (Baltimore V). Virus dermatotr\xF3pico.",reconoce:"Pr\xF3dromo con fiebre alta, tos, coriza y conjuntivitis. Manchas de Koplik en la mucosa oral. En biopsia: c\xE9lulas gigantes multinucleadas.",produce:"Exantema m\xE1culo-papular que empieza en la cara y desciende. Complicaciones: neumon\xEDa, encefalitis y panencefalitis esclerosante subaguda (SSPE).",contagio:"Respiratorio, muy contagioso (gotas).",tratamiento:"Sintom\xE1tico. Se previene con vacuna.",datoExamen:"Koplik = sarampi\xF3n. A diferencia de la varicela, el exantema avanza de la cara hacia abajo y no pica tanto."},"Varicela-z\xF3ster":{queEs:"Herpesviridae, ADN doble cadena (Baltimore I).",reconoce:"Ves\xEDculas muy pruriginosas (\xABgota de roc\xEDo\xBB) en distintos estadios a la vez; el exantema empieza en el tronco.",produce:"Varicela. Complicaciones: sobreinfecci\xF3n y neumon\xEDa. Puede reactivarse a\xF1os despu\xE9s como herpes z\xF3ster.",contagio:"Respiratorio y por contacto con las lesiones.",tratamiento:"Aciclovir o valaciclovir. Se previene con vacuna.",datoExamen:"Lesiones en distintos estadios = varicela. En el sarampi\xF3n todo est\xE1 en el mismo estadio."},Rotavirus:{queEs:"Reoviridae, ARN doble cadena (Baltimore III), sin envoltura: muy resistente en el ambiente.",produce:"Diarrea acuosa infantil con v\xF3mitos y fiebre. El riesgo es la deshidrataci\xF3n, sobre todo en lactantes.",contagio:"Fecal-oral: agua, alimentos, superficies y contacto persona a persona.",diagnostico:"Cl\xEDnico; prueba r\xE1pida de ant\xEDgeno o PCR en heces.",tratamiento:"Rehidrataci\xF3n oral o intravenosa. Se previene con la vacuna contra el rotavirus.",datoExamen:"Es el ejemplo del grupo III de Baltimore (ARN de doble cadena)."},"Virus de Epstein-Barr":{queEs:"Herpesviridae, ADN doble cadena (Baltimore I). Virus oncog\xE9nico.",produce:"Mononucleosis infecciosa (adenopat\xEDas, linfocitos at\xEDpicos). Oncog\xE9nico: linfoma de Burkitt y Hodgkin. En VIH: linfoma no Hodgkin de c\xE9lulas B.",contagio:"Saliva.",datoExamen:"En VIH, la menor inmunovigilancia deja proliferar linfocitos B infectados por EBV: linfoma difuso de c\xE9lulas B grandes, Burkitt o primario del SNC."},"Herpesvirus humano 8":{queEs:"Herpesviridae, ADN doble cadena (Baltimore I). Tambi\xE9n llamado virus del herpes del sarcoma de Kaposi (KSHV).",produce:"Sarcoma de Kaposi: n\xF3dulos y placas rojo-viol\xE1ceas; c\xE9lulas fusiformes con hemat\xEDes en peque\xF1os vasos.",contagio:"Sexual y saliva.",datoExamen:"Infecta c\xE9lulas endoteliales e induce angiog\xE9nesis (IL-6, VEGF). En VIH prolifera sin control y la prote\xEDna Tat del VIH lo potencia."}};var ca=[{titulo:"Hongos",grupos:[{grupo:"Levaduras",items:[{nombre:"Candida albicans",busqueda:"Candida|candidemia|candidiasis|muguet"},{nombre:"Rhodotorula",busqueda:"Rhodotorula"},{nombre:"Cryptococcus",busqueda:"cripto"}]},{grupo:"Mohos hialinos (ambientales)",items:[{nombre:"Aspergillus fumigatus",busqueda:"fumigatus|aspergilosis|aspergiloma"},{nombre:"Aspergillus niger",busqueda:"niger"},{nombre:"Aspergillus flavus",busqueda:"flavus"},{nombre:"Aspergillus terreus",busqueda:"terreus"},{nombre:"Penicillium",busqueda:"Penicillium"},{nombre:"
