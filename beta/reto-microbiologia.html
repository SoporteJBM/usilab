La 4.ª ya combina anticuerpos y p24. La 5.ª también detecta anti-VIH-2 y separa el resultado: antígeno o anticuerpos."}, {"nivel": "d", "pregunta": "Paciente con VIH y tuberculosis que recibe rifampicina. Esquema según MINSA:", "correcta": "TDF + 3TC + EFV", "distractores": ["TDF + 3TC + DTG", "AZT + 3TC + LPV/r", "ABC + 3TC + DTG"], "pista": "Busca menos interacción con la rifampicina.", "explicacion": "En coinfección VIH–TB se usa efavirenz por su menor interacción con la rifampicina."}, {"nivel": "d", "pregunta": "Paciente con VIH y filtrado glomerular menor de 50 ml/min. Esquema de primera línea:", "correcta": "ABC + 3TC + DTG", "distractores": ["TDF + 3TC + DTG", "TDF + 3TC + EFV", "DRV/r + RAL + ETR"], "pista": "Hay que evitar el tenofovir.", "explicacion": "El tenofovir está contraindicado con falla renal o alergia: se cambia por abacavir."}, {"nivel": "d", "pregunta": "¿Por qué el HTLV es menos infeccioso que el VIH?", "correcta": "Se transmite sobre todo dentro de células infectadas, no como virus libre", "distractores": ["No tiene envoltura", "No integra su genoma", "Solo se transmite por mosquitos"], "pista": "Necesita contacto «celular»: leche, sangre, semen.", "explicacion": "El HTLV pasa en linfocitos infectados. Por eso necesita leche, sangre o semen con células, y es menos infeccioso que el VIH."}, {"nivel": "d", "pregunta": "Hallazgo característico en sangre periférica en la leucemia/linfoma T del adulto (ATLL):", "correcta": "Células en flor (núcleo multilobulado)", "distractores": ["Coilocitos", "Células gigantes multinucleadas", "Clue cells"], "pista": "El núcleo parece una flor.", "explicacion": "Las células en flor son linfocitos T CD4+ transformados por HTLV-1. Los coilocitos son del VPH; las células gigantes multinucleadas, del sarampión."}, {"nivel": "d", "pregunta": "¿Qué alteración de laboratorio es típica de la ATLL aguda?", "correcta": "Hipercalcemia", "distractores": ["Hipocalcemia", "Hiperkalemia", "Hiponatremia"], "pista": "Por osteólisis.", "explicacion": "La hipercalcemia se debe a osteólisis, con liberación de IL-1 y una sustancia parecida a la PTH."}, {"nivel": "d", "pregunta": "En la paraparesia espástica tropical (HAM/TSP), el daño medular se debe a:", "correcta": "La respuesta inmune citotóxica contra linfocitos infectados que infiltran la médula", "distractores": ["Que el HTLV-1 infecta y destruye las neuronas", "Una toxina que libera el virus", "La compresión por un linfoma"], "pista": "El virus no infecta neuronas.", "explicacion": "Los CD4+ infectados entran al SNC y la respuesta citotóxica desmieliniza los cordones laterales y anteriores: daño crónico e irreversible."}, {"nivel": "d", "pregunta": "¿Por qué el VPH de bajo riesgo no produce cáncer?", "correcta": "Su E6 y E7 casi no inactivan p53 ni Rb, y su ADN queda como episoma sin integrarse", "distractores": ["Porque no infecta la capa basal del epitelio", "Porque no tiene genes E6 ni E7", "Porque produce viremia y el sistema inmune lo elimina"], "pista": "Episoma = no se integra.", "explicacion": "Sin inactivar los frenos y sin integrarse, no hay transformación ni inestabilidad genómica: solo proliferación leve (verrugas)."}, {"nivel": "d", "pregunta": "¿Qué es un coilocito?", "correcta": "Una célula escamosa con halo perinuclear claro y núcleo agrandado, típica del VPH", "distractores": ["Un linfocito con núcleo multilobulado", "Una célula epitelial cubierta de bacilos", "Una célula multinucleada con moldes nucleares"], "pista": "Lo ves en el Papanicolaou.", "explicacion": "La coilocitosis es el efecto citopático del VPH. Las clue cells son de vaginosis; la multinucleación con moldes nucleares, del herpes."}, {"nivel": "d", "pregunta": "Co-test: citología normal y VPH 16/18 positivo. ¿Qué se hace?", "correcta": "Colposcopia inmediata", "distractores": ["Repetir el co-test en 5 años", "Repetir en 12 meses", "Dar tratamiento antiviral"], "pista": "Alto riesgo de NIC 2/3.", "explicacion": "VPH 16/18 positivo implica alto riesgo aunque la citología sea normal: colposcopia inmediata. Si el VPH positivo no es 16/18: repetir en 12 meses o genotipificar."}, {"nivel": "d", "pregunta": "¿Por qué el co-test no se recomienda en mujeres menores de 30 años?", "correcta": "Porque las infecciones por VPH son muy frecuentes y transitorias a esa edad", "distractores": ["Porque la vacuna ya las protege a todas", "Porque la citología no funciona antes de los 30", "Porque el VPH no infecta antes de los 30"], "pista": "Muchas se eliminan solas.", "explicacion": "Solo cerca del 10 % de las infecciones de alto riesgo persiste más de 12–24 meses. Por eso el co-test se usa de 30 a 65 años."}, {"nivel": "d", "pregunta": "Al integrarse el ADN del VPH de alto riesgo, ¿qué gen se pierde y deja sin control a E6 y E7?", "correcta": "E2", "distractores": ["L1", "E4", "L2"], "pista": "Es el regulador de la transcripción.", "explicacion": "E2 normalmente frena a E6 y E7. Si la integración lo rompe, E6 y E7 se expresan sin control y la célula acumula daño genético."}, {"nivel": "d", "pregunta": "Células gigantes multinucleadas en una biopsia orientan a:", "correcta": "Sarampión", "distractores": ["VPH", "HTLV-1", "Rotavirus"], "pista": "Es un paramyxovirus.", "explicacion": "Las células gigantes multinucleadas son del sarampión; los cuerpos de Cowdry, del herpes."}, {"nivel": "d", "pregunta": "¿Qué hepatitis viral se vuelve grave en gestantes?", "correcta": "Hepatitis E", "distractores": ["Hepatitis A", "Hepatitis C", "Hepatitis D"], "pista": "Es fecal-oral, como la A.", "explicacion": "La hepatitis E (Hepeviridae) se transmite por vía fecal-oral y es grave en gestantes."}, {"nivel": "x", "caso": "Varón de 25 años, 3 semanas después de una relación sin preservativo: fiebre, adenopatías, dolor de garganta, rash maculopapular y úlceras orales. La prueba de 5.ª generación es reactiva por antígeno p24, con anticuerpos negativos.", "pregunta": "¿Qué está pasando?", "correcta": "Síndrome retroviral agudo en periodo de ventana: carga viral alta y muy contagioso", "distractores": ["Mononucleosis por Epstein-Barr sin relación con el VIH", "Fase de latencia clínica", "SIDA por caída de CD4"], "explicacion": "A las 2–4 semanas hay síntomas de virosis inespecífica, p24 detectable y anticuerpos aún en formación (ventana serológica). La carga viral es muy alta."}, {"nivel": "x", "pregunta": "Una persona se hace un ELISA de 3.ª generación 15 días después de una exposición de riesgo y sale negativo. ¿Por qué no descarta VIH?", "correcta": "Solo detecta anticuerpos, que aparecen entre los días 15 y 45", "distractores": ["Porque no detecta VIH-1", "Porque necesita confirmación con Western blot aunque sea negativo", "Porque el ELISA solo sirve en neonatos"], "explicacion": "La 3.ª generación tiene una ventana de 3 a 6 semanas. La 4.ª, que detecta p24, la acorta a 14–18 días."}, {"nivel": "x", "caso": "Paciente con VIH sin tratamiento, CD4 de 150 células/mm³. Presenta nódulos rojo-violáceos en las piernas; la biopsia muestra células fusiformes con hematíes en espacios vasculares.", "pregunta": "¿Qué virus causa la lesión?", "correcta": "Herpesvirus humano 8 (HHV-8)", "distractores": ["Virus de Epstein-Barr", "Virus del papiloma humano 16", "El VIH directamente"], "explicacion": "Es sarcoma de Kaposi. Con menos inmunidad, el HHV-8 infecta células endoteliales y estimula la angiogénesis (IL-6, VEGF); la proteína Tat del VIH lo potencia."}, {"nivel": "x", "pregunta": "El linfoma no Hodgkin en personas con VIH se asocia sobre todo a:", "correcta": "Virus de Epstein-Barr no controlado, que hace proliferar linfocitos B", "distractores": ["Herpesvirus humano 8 en células endoteliales", "HTLV-1 en linfocitos T CD4+", "El VIH, que es directamente oncogénico"], "explicacion": "El VIH no es oncogénico directo: baja la inmunovigilancia y el EBV prolifera en linfocitos B (linfoma difuso de células B grandes, Burkitt, primario del SNC)."}, {"nivel": "x", "pregunta": "¿Por qué el tratamiento antirretroviral no erradica el VIH?", "correcta": "Queda como provirus latente en reservorios (CD4 de memoria, macrófagos, SNC) donde llegan pocos fármacos", "distractores": ["Porque los antirretrovirales no actúan sobre la transcriptasa inversa", "Porque el VIH no integra su genoma", "Porque el VIH destruye todos los linfocitos antes del tratamiento"], "explicacion": "En los reservorios el virus está integrado e inactivo. Además, transportadores ABC expulsan los fármacos y bajan su concentración dentro de la célula."}, {"nivel": "x", "pregunta": "Una célula infectada por dos variantes de VIH produce un virus con mutaciones de ambas. ¿Qué mecanismo lo explica?", "correcta": "Recombinación: la transcriptasa inversa salta entre las dos copias de ARN", "distractores": ["Reorganización de segmentos como en la influenza", "Corrección de errores de la integrasa", "Integración de dos provirus en el mismo cromosoma"], "explicacion": "El VIH lleva dos copias de ARN. Si son de variantes distintas, la transcriptasa inversa puede saltar de una a otra y crear un genoma recombinante."}, {"nivel": "x", "pregunta": "¿Por qué el HTLV-1 causa leucemia y el VIH causa inmunodeficiencia, si ambos infectan CD4?", "correcta": "El HTLV-1 transforma al linfocito y lo hace proliferar (Tax y HBZ); el VIH es citopático y lo destruye", "distractores": ["El HTLV-1 infecta CD8 y el VIH CD4", "El VIH no integra su genoma y el HTLV-1 sí", "El HTLV-1 tiene genoma de ADN"], "explicacion": "Tax y HBZ estimulan la proliferación y evitan la apoptosis; con mutaciones acumuladas aparece la ATLL tras 20–40 años en menos del 5 % de los infectados."}, {"nivel": "x", "pregunta": "¿Qué diferencia genética explica que el HTLV-1 sea oncogénico y el HTLV-2 casi no?", "correcta": "El HTLV-1 tiene Tax más activo y el gen HBZ", "distractores": ["El HTLV-2 no tiene transcriptasa inversa", "El HTLV-1 no tiene envoltura", "El HTLV-2 tiene E6 y E7"], "explicacion": "HTLV-1: Tax muy activo y HBZ, que inducen proliferación (ATLL, HAM/TSP). HTLV-2: menor capacidad transcripcional, sin HBZ, manifestaciones raras."}, {"nivel": "x", "pregunta": "Citología ASC-US. ¿Cómo cambia el manejo según la prueba de VPH?", "correcta": "VPH negativo: repetir en 3 años; VPH positivo: colposcopia", "distractores": ["Siempre colposcopia, sin importar el VPH", "VPH negativo: colposcopia; VPH positivo: repetir en 3 años", "Siempre repetir la citología en 5 años"], "explicacion": "ASC-US sin VPH activo es una lesión leve. Con VPH positivo el riesgo es intermedio y se hace colposcopia."}, {"nivel": "x", "pregunta": "Una mujer de 22 años con vida sexual activa pregunta si le sirve vacunarse contra el VPH. ¿Qué es correcto?", "correcta": "Sí: la protege contra los genotipos que aún no adquirió, aunque no trata infecciones ya presentes", "distractores": ["No: después del inicio sexual la vacuna no sirve", "Sí: elimina las infecciones que ya tiene", "No: solo se aplica a varones"], "explicacion": "La vacuna es preventiva, no terapéutica. Pierde protección «total», pero mantiene la protección contra genotipos no adquiridos."}, {"nivel": "x", "pregunta": "¿Cómo se diagnostica el VIH en un recién nacido de madre con VIH, según el MINSA?", "correcta": "PCR a las 2 semanas, al mes y a los 4–6 meses", "distractores": ["ELISA de 4.ª generación al nacer", "Western blot a las 2 semanas", "Prueba rápida al mes"], "explicacion": "En neonatos se busca el virus con PCR, no anticuerpos: los anticuerpos que tenga el bebé pueden ser de la madre."}, {"nivel": "x", "pregunta": "El VIH y el VHB usan transcriptasa inversa, pero están en grupos de Baltimore distintos. ¿Por qué?", "correcta": "El VIH tiene genoma de ARN (grupo VI) y el VHB de ADN doble cadena (grupo VII)", "distractores": ["El VHB no tiene transcriptasa inversa", "El VIH es de ADN y el VHB de ARN", "Porque el VIH tiene envoltura y el VHB no"], "explicacion": "Baltimore clasifica por el genoma que entra a la célula y cómo llega al ARNm. VI: ARN → ADN. VII: ADN ds que se replica a través de un ARN intermedio."}, {"nivel": "x", "pregunta": "Gestante con VIH recién diagnosticado. ¿Qué esquema indica el MINSA?", "correcta": "TDF + 3TC + DTG (TLD), igual que la primera línea", "distractores": ["AZT + 3TC + LPV/r", "TDF + 3TC + EFV", "Esperar al parto para iniciar"], "explicacion": "El TLD es seguro y preferido en embarazo y lactancia. Con TARV materno el riesgo de transmisión vertical baja a menos de 1–2 %."}, {"nivel": "x", "pregunta": "¿Qué antirretroviral bloquea el correceptor CCR5?", "correcta": "Maraviroc", "distractores": ["Dolutegravir", "Efavirenz", "Lopinavir/ritonavir"], "explicacion": "Maraviroc es un inhibidor de la entrada. Dolutegravir inhibe la integrasa; efavirenz es un inhibidor no análogo de la transcriptasa inversa; lopinavir/ritonavir inhibe la proteasa."}], "perfiles": {"VIH": {"queEs": "Retrovirus del género Lentivirus. Esférico, envuelto, con 2 copias de ARN de sentido positivo (Baltimore VI). Tipos VIH-1 (pandemia; grupo M > 90 %, subtipo B en Perú) y VIH-2 (África occidental, menos transmisible). Origen zoonótico: SIV de chimpancés (VIH-1) y de monos mangabey (VIH-2).", "reconoce": "gp120 se une a CD4; correceptor CCR5 al inicio y CXCR4 en fase avanzada; gp41 hace la fusión. p24 es la cápside y p17 la matriz. Enzimas: transcriptasa inversa, integrasa y proteasa.", "produce": "Síndrome retroviral agudo (2–4 semanas) → latencia clínica (8–10 años) → fase sintomática (CD4 200–500) → SIDA (CD4 < 200): neumonía por Pneumocystis jirovecii, toxoplasmosis cerebral, TB extrapulmonar, candidiasis esofágica, CMV, Cryptococcus, sarcoma de Kaposi (HHV-8) y linfoma no Hodgkin (EBV).", "contagio": "Sexual (la principal; más riesgo en sexo anal receptivo), sangre (agujas, accidentes: ≈ 0,3 % por pinchazo) y vertical (más en el parto). Transmiten sangre, semen, secreciones vaginales y leche; no saliva, sudor, lágrimas ni orina.", "diagnostico": "Tamizaje: ELISA 4.ª generación o prueba rápida. Si es reactiva, segunda prueba de otra metodología; discordantes: LIA o RT-qPCR. Western blot positivo = 2 bandas de envoltura (gp120/160 + gp41). Neonato: PCR a las 2 semanas, 1 mes y 4–6 meses. Seguimiento con CD4 y carga viral.", "tratamiento": "TARV de por vida. Primera línea MINSA: TDF + 3TC + DTG (TLD), también en gestantes y en coinfección con VHB. Con TB: TDF + 3TC + EFV. Falla renal: ABC + 3TC + DTG. Segunda línea: AZT + 3TC + LPV/r. Rescate: DRV/r + RAL + ETR.", "datoExamen": "Su transcriptasa inversa no corrige errores, se replica millones de veces al día y recombina sus dos copias de ARN: por eso varía tanto y genera resistencias. No se erradica porque queda como provirus en reservorios."}, "HTLV-1": {"queEs": "Virus linfotrópico T humano tipo 1. Retrovirus del género Deltaretrovirus (ARN +, Baltimore VI). Fue el primer retrovirus humano descubierto (Gallo, 1980).", "reconoce": "Infecta linfocitos T CD4+ (el HTLV-2 prefiere CD8+). No destruye la célula: la transforma y la hace proliferar con Tax y HBZ. Receptores GLUT-1, NRP-1 y HSPG.", "produce": "Leucemia/linfoma T del adulto (ATLL): menos del 5 % de los infectados, tras 20–40 años; células en flor e hipercalcemia. Paraparesia espástica tropical (HAM/TSP): menos del 1 %, desmielinización medular por la respuesta inmune.", "contagio": "Por células infectadas, no tanto por virus libre: lactancia materna (la vía más importante en zonas endémicas), sexual (más de hombre a mujer) y parenteral (transfusiones, agujas, trasplantes). Perú es endémico.", "diagnostico": "ELISA de anticuerpos anti-HTLV (tamizaje) y Western blot, que distingue HTLV-1 de HTLV-2. PCR del ADN proviral (genes pol, tax o gag) y carga proviral.", "tratamiento": "ATLL: quimioterapia (CHOP), zidovudina + interferón α, trasplante de médula en casos seleccionados. HAM/TSP: no hay cura; corticoides, interferón y rehabilitación.", "datoExamen": "HTLV-1 transforma (leucemia); el VIH destruye (inmunodeficiencia). Las células en flor tienen núcleo multilobulado."}, "Virus del papiloma humano": {"queEs": "Familia Papillomaviridae (antes agrupado como papovavirus). ADN doble cadena (Baltimore I), no envuelto, de unos 55 nm.", "reconoce": "Genes tempranos: E1 (helicasa), E2 (regula la transcripción), E4, E5, E6 (degrada p53) y E7 (inactiva Rb). Genes tardíos: L1 (cápside principal) y L2. En la citología: coilocitos (halo perinuclear claro).", "produce": "Bajo riesgo (6 y 11): verrugas genitales (condiloma acuminado) y papilomatosis laríngea. Alto riesgo (16 y 18, entre otros): NIC 1–3 y cáncer de cérvix, ano, vagina, vulva, pene y orofaringe. Tipos cutáneos (1, 2, 4, 7): verrugas comunes y plantares.", "contagio": "Contacto directo piel a piel o mucosa a mucosa, sobre todo sexual, incluso sin lesiones visibles. Vertical en el parto vaginal. No por sangre ni por placenta: no hay viremia.", "diagnostico": "Gold standard de tamizaje: co-test (Papanicolaou + PCR de VPH) de 30 a 65 años. PCR de las regiones L1 o E6/E7; genotipificación por hibridación (RLB/INNO-LiPA).", "tratamiento": "No hay antiviral curativo: se tratan las lesiones. Verrugas: imiquimod, podofilotoxina, ácido tricloroacético, crioterapia. NIC 2–3: LEEP o conización. Prevención: vacuna tetravalente del MINSA (6, 11, 16, 18) a los 9–13 años, 2 dosis.", "datoExamen": "E6 → p53 y E7 → Rb. La persistencia permite la integración del ADN y la pérdida de E2, que deja a E6 y E7 sin control."}, "Sarampión": {"queEs": "Paramyxovirus, ARN de sentido negativo (Baltimore V). Virus dermatotrópico.", "reconoce": "Pródromo con fiebre alta, tos, coriza y conjuntivitis. Manchas de Koplik en la mucosa oral. En biopsia: células gigantes multinucleadas.", "produce": "Exantema máculo-papular que empieza en la cara y desciende. Complicaciones: neumonía, encefalitis y panencefalitis esclerosante subaguda (SSPE).", "contagio": "Respiratorio, muy contagioso (gotas).", "tratamiento": "Sintomático. Se previene con vacuna.", "datoExamen": "Koplik = sarampión. A diferencia de la varicela, el exantema avanza de la cara hacia abajo y no (function agregarTeoriaVirus() {
  const T = VIRUS_TEORIA;
  const st = STATIONS.find((s) => s.id === "virus");
  if (!st) return;
  const ya = new Set(st.bank.map((q) => (q.c || "") + "|" + q.q));
  T.preguntas.forEach((p) => {
    const item = { n: p.nivel, q: p.pregunta, ok: p.correcta, no: p.distractores.slice() };
    if (p.caso) item.c = p.caso;
    if (p.pista) item.h = p.pista;
    if (p.explicacion) item.y = p.explicacion;
    if (!ya.has((item.c || "") + "|" + item.q)) st.bank.push(item);
  });
  st.study = (st.study || "") + T.resumenExtra;
  const LETRA = { queEs: "q", reconoce: "r", produce: "p", contagio: "c", diagnostico: "d", tratamiento: "t", datoExamen: "x", fichaMicroscopio: "f" };
  Object.entries(T.perfiles).forEach(([nombre, pf]) => {
    const o = Object.assign({}, PERFILES[nombre] || {});
    Object.entries(pf).forEach(([k, v]) => { if (LETRA[k]) o[LETRA[k]] = v; });
    PERFILES[nombre] = o;
  });
  const sec = INDICE.find((s) => s.t === "Virus");
  if (sec) sec.grupos = T.indiceVirus.map((g) => [g.grupo, g.items.map((x) => x.slice())]);
  T.tablas.forEach((tb) => { if (!TABLAS.some((x) => x.id === tb.id)) TABLAS.push({ id: tb.id, t: tb.titulo, cols: tb.columnas, rows: tb.filas }); });
  const trat = TABLAS.find((x) => x.id === "tratamientos");
  if (trat) T.tratamientosExtra.forEach((r) => { if (!trat.rows.some((x) => x[0] === r[0])) trat.rows.push(r); });
  Object.entries(T.ahorcado).forEach(([nivel, lista]) => {
    const dest = AHORCADO.niveles[nivel];
    if (dest) lista.forEach((w) => { if (!dest.some((x) => x.w === w.palabra)) dest.push({ w: w.palabra, c: w.pista }); });
  });
  FACTS.virus = [...(FACTS.virus || []), ...T.datosCuriosos];
})();

l": "m", "caso": "Varón de 30 años mordido por un perro callejero hace 2 meses. Ahora tiene fiebre, agitación y espasmos al intentar tomar agua.", "pregunta": "¿Qué virus es?", "correcta": "Virus de la rabia", "distractores": ["Herpes simple", "Poliovirus", "Virus del Nilo Occidental"], "pista": "Hidrofobia.", "explicacion": "Rabia (Rhabdoviridae, ARN −): se transmite por mordedura y llega al SNC por los nervios periféricos. Con síntomas es fatal; se previene con vacuna."}, {"nivel": "m", "caso": "Adulto con 2 días de fiebre, mialgias, tos seca y dolor de garganta sin pus. El hemograma muestra leucopenia con linfocitosis relativa. No mejoró con amoxicilina.", "pregunta": "¿Qué sugiere este cuadro?", "correcta": "Infección viral", "distractores": ["Faringitis bacteriana por estreptococo", "Infección por hongos", "Parasitosis intestinal"], "pista": "Sin pus y con linfocitosis.", "explicacion": "Fiebre + mialgias + síntomas respiratorios + leucopenia con linfocitosis, sin exudado y sin respuesta a antibióticos: pensar primero en virus."}, {"nivel": "m", "caso": "Paciente con VIH que también tiene hepatitis B crónica. Va a iniciar tratamiento.", "pregunta": "¿Qué esquema indica el MINSA?", "correcta": "TDF + 3TC + DTG", "distractores": ["AZT + 3TC + LPV/r", "ABC + 3TC + DTG", "DRV/r + RAL + ETR"], "pista": "El tenofovir también actúa contra el VHB.", "explicacion": "TLD es activo frente a VIH y VHB: es el ideal en coinfectados."}, {"nivel": "m", "pregunta": "¿Cuál es el riesgo aproximado de infectarse con VIH tras un pinchazo con una aguja contaminada?", "correcta": "0,3 %", "distractores": ["15–45 %", "10 %", "Prácticamente 100 %"], "pista": "Es menos de 1 %.", "explicacion": "El riesgo ocupacional por pinchazo es ≈ 0,3 %. 15–45 % es el riesgo de transmisión vertical sin tratamiento."}, {"nivel": "m", "pregunta": "¿Qué subtipo de VIH-1 es el más frecuente en América y en el Perú?", "correcta": "Subtipo B", "distractores": ["Subtipo C", "Subtipo E", "Grupo O"], "pista": "El C predomina en África.", "explicacion": "El grupo M causa más del 90 % de infecciones. Subtipo B: América y Europa (incluye Perú). Subtipo C: la mitad de los casos del mundo, sobre todo en África."}, {"nivel": "m", "pregunta": "Comparados con los virus ARN, los virus ADN:", "correcta": "Replican en el núcleo, mutan menos y pueden hacer latencia", "distractores": ["Replican en el citoplasma y mutan más", "Siempre traen su propia ARN polimerasa", "Nunca integran su genoma"], "pista": "Dependen más de la célula.", "explicacion": "Los virus ADN replican en el núcleo usando la maquinaria de la célula: menor tasa de mutación y capacidad de latencia."}, {"nivel": "m", "pregunta": "En la curva de crecimiento viral, el «burst size» es:", "correcta": "El número promedio de viriones liberados por cada célula infectada", "distractores": ["El tiempo que dura la fase de eclipse", "La dosis mínima para iniciar la infección", "El tamaño del virión en nanómetros"], "pista": "«Burst» = estallido.", "explicacion": "Burst size: cuántos viriones libera en promedio cada célula infectada."}, {"nivel": "m", "pregunta": "¿Qué cuadro causa el virus parainfluenza?", "correcta": "Crup", "distractores": ["Bronquiolitis", "Resfrío común", "Conjuntivitis"], "pista": "Tos «de perro» en niños.", "explicacion": "Parainfluenza (Paramyxoviridae, ARN −): crup. VSR: bronquiolitis. Rinovirus: resfrío. Adenovirus: faringitis y conjuntivitis."}, {"nivel": "m", "caso": "Mujer de 34 años en control: Papanicolaou normal y PCR de VPH negativa.", "pregunta": "¿Cuándo repite el tamizaje?", "correcta": "Co-test en 5 años", "distractores": ["En 12 meses", "Colposcopia inmediata", "En 3 años con biopsia"], "pista": "Es el resultado de menor riesgo.", "explicacion": "Citología normal + VPH negativo = muy bajo riesgo: repetir el co-test en 5 años."}, {"nivel": "m", "pregunta": "¿Por qué el VPH no pasa por la placenta ni por la leche materna?", "correcta": "Porque no produce viremia: se queda en el epitelio", "distractores": ["Porque tiene envoltura lipídica frágil", "Porque solo infecta varones", "Porque la vacuna lo impide en todas las madres"], "pista": "No circula por la sangre.", "explicacion": "El VPH se transmite por contacto piel-piel o mucosa-mucosa. La vía vertical solo ocurre en el parto vaginal."}, {"nivel": "m", "pregunta": "En el Papanicolaou, las clue cells (células epiteliales cubiertas de bacilos) indican:", "correcta": "Vaginosis bacteriana por Gardnerella", "distractores": ["Infección por VPH", "Herpes simple", "Candidiasis"], "pista": "No es un virus.", "explicacion": "Hallazgos no neoplásicos del PAP: clue cells → Gardnerella; hifas y esporas → Candida; multinucleación con moldes nucleares → herpes; coilocitos → VPH."}, {"nivel": "m", "pregunta": "¿Qué antiviral se usa contra la hepatitis C?", "correcta": "Sofosbuvir", "distractores": ["Oseltamivir", "Aciclovir", "Maraviroc"], "pista": "Es un antiviral de acción directa (AAD).", "explicacion": "Hepatitis C: sofosbuvir, ledipasvir, daclatasvir, glecaprevir/pibrentasvir. Hepatitis B: tenofovir, entecavir, lamivudina, IFN-α."}, {"nivel": "m", "pregunta": "¿Qué ventaja tiene el LIA frente al Western blot para confirmar VIH?", "correcta": "Es más estandarizado y automatizable", "distractores": ["Detecta el virus antes que la PCR", "No necesita suero del paciente", "Se lee con microscopio de fluorescencia"], "pista": "Usa proteínas recombinantes en líneas.", "explicacion": "El LIA usa proteínas recombinantes fijas en líneas, es rápido y reproducible: es la confirmatoria recomendada. El WB está obsoleto en varios países."}, {"nivel": "d", "caso": "Paciente de 40 años con fiebre, cefalea, confusión y convulsiones. El LCR tiene linfocitos y la resonancia muestra compromiso del lóbulo temporal.", "pregunta": "¿Qué virus sospechas y qué examen lo confirma?", "correcta": "Herpes simple; PCR en LCR", "distractores": ["Rabia; cultivo de LCR", "Poliovirus; hemocultivo", "VIH; Western blot"], "explicacion": "Encefalitis temporal = herpes simple. LCR con linfocitos orienta a virus y la PCR en LCR es el gold standard. Se trata con aciclovir."}, {"nivel": "d", "caso": "Varón de 50 años de la costa norte del Perú con HTLV-1: linfocitosis con células de núcleo multilobulado, adenopatías generalizadas, hepatoesplenomegalia, lesiones en la piel e hipercalcemia.", "pregunta": "¿Qué forma de ATLL es?", "correcta": "Aguda", "distractores": ["Indolente", "Crónica", "Linfomatosa"], "explicacion": "Forma aguda: leucocitosis con células en flor, compromiso sistémico e hipercalcemia; pronóstico muy malo. La crónica no tiene hipercalcemia; la indolente solo afecta piel o pulmón; la linfomatosa tiene adenopatías sin células tumorales en sangre."}, {"nivel": "d", "caso": "Paciente con VIH en TARV con buena adherencia. La carga viral, que estaba indetectable, sube y se mantiene alta en dos controles.", "pregunta": "Según el MINSA, ¿qué esquema sigue?", "correcta": "AZT + 3TC + LPV/r", "distractores": ["Seguir con TDF + 3TC + DTG", "DRV/r + RAL + ETR directo", "Suspender el tratamiento"], "explicacion": "Fallo virológico documentado con buena adherencia: segunda línea con zidovudina + lamivudina + lopinavir/ritonavir. DRV/r + RAL + ETR es tercera línea, tras genotipificación."}, {"nivel": "d", "caso": "Paciente con VIH, CD4 de 80 células/mm³, con fiebre, cefalea y déficit focal. La tomografía muestra lesiones cerebrales y se diagnostica toxoplasmosis cerebral.", "pregunta": "¿En qué fase de la infección está?", "correcta": "SIDA", "distractores": ["Síndrome retroviral agudo", "Latencia clínica", "Fase sintomática inicial con inmunidad conservada"], "explicacion": "CD4 < 200 o una infección definitoria (toxoplasmosis cerebral, Pneumocystis, TB extrapulmonar, candidiasis esofágica, CMV, Cryptococcus) = SIDA. Con CD4 < 50 el riesgo es muy alto."}, {"nivel": "d", "pregunta": "¿Qué diferencia hay entre neuroinvasión y neurovirulencia?", "correcta": "Neuroinvasión es llegar al SNC; neurovirulencia es causar enfermedad en él", "distractores": ["Son sinónimos", "Neuroinvasión es infectar neuronas periféricas; neurovirulencia, las centrales", "Neurovirulencia es la velocidad de replicación en el LCR"], "explicacion": "Un virus puede llegar al SNC (neuroinvasión) por vía hematógena o por nervios, y causar o no daño ahí (neurovirulencia)."}, {"nivel": "d", "pregunta": "¿Por qué vía llega la rabia al sistema nervioso central?", "correcta": "Diseminación neuronal retrógrada por nervios periféricos", "distractores": ["Diseminación hematógena atravesando la barrera hematoencefálica", "Por el líquido cefalorraquídeo desde la nariz", "Por linfocitos infectados"], "explicacion": "La rabia sube por los nervios periféricos desde la mordedura. Otros virus llegan por la sangre y atraviesan la barrera hematoencefálica."}, {"nivel": "d", "pregunta": "¿En qué enfermedades el daño lo produce sobre todo la respuesta inmune y no el virus directamente?", "correcta": "Hepatitis viral y dengue grave", "distractores": ["Poliomielitis y resfrío común", "Verrugas comunes y molusco contagioso", "Rotavirus y norovirus"], "explicacion": "Daño indirecto o inmunopatología: hepatitis viral y dengue grave. El poliovirus, en cambio, destruye las células directamente."}, {"nivel": "d", "pregunta": "¿Por qué la coinfección VIH–VHB empeora el pronóstico?", "correcta": "Acelera la enfermedad hepática", "distractores": ["Hace que el VHB se vuelva oncogénico por primera vez", "Impide usar tenofovir", "Hace que el VIH se transmita por saliva"], "explicacion": "Las coinfecciones son un determinante del huésped: la coinfección VIH–VHB acelera el daño hepático."}, {"nivel": "d", "pregunta": "¿Qué hallazgo histológico es típico del herpes?", "correcta": "Cuerpos de inclusión de Cowdry", "distractores": ["Células gigantes multinucleadas del sarampión", "Coilocitos", "Células en flor"], "explicacion": "Cowdry: inclusiones intranucleares del herpes. Células gigantes multinucleadas: sarampión. Coilocitos: VPH. Células en flor: ATLL."}, {"nivel": "d", "pregunta": "¿Cómo actúa la amantadina?", "correcta": "Inhibe el desnudamiento: impide que se libere el genoma viral dentro de la célula", "distractores": ["Inhibe la neuraminidasa", "Bloquea la integrasa", "Es un análogo de nucleósido"], "explicacion": "Amantadina y rimantadina inhiben el desnudamiento. Oseltamivir y zanamivir inhiben la neuraminidasa."}, {"nivel": "d", "pregunta": "¿Qué es el palivizumab?", "correcta": "Un anticuerpo monoclonal contra el virus sincitial respiratorio", "distractores": ["Un inhibidor de la proteasa del VIH", "Una vacuna contra el VPH", "Un análogo de nucleósido contra el CMV"], "explicacion": "Palivizumab es un anticuerpo monoclonal que bloquea la entrada del VSR. Para VSR también se usa ribavirina."}, {"nivel": "d", "pregunta": "¿Con qué virus simio está más emparentado el VIH-2?", "correcta": "SIV de los monos mangabey (SIVsmm)", "distractores": ["SIV de los chimpancés (SIVcpz)", "HTLV-2", "Virus linfotrópico bovino"], "explicacion": "VIH-1 viene del SIV de chimpancés; VIH-2, del SIV de los monos mangabey, que viven donde el VIH-2 es más prevalente (África occidental)."}, {"nivel": "d", "pregunta": "Según la norma del MINSA, ¿qué meta de carga viral se busca con el TARV?", "correcta": "Indetectable (menos de 200 copias/mL) con CD4 en aumento", "distractores": ["Menos de 10 000 copias/mL", "Que la carga viral baje a la mitad", "CD4 menor de 200"], "explicacion": "Meta: carga viral indetectable (< 200 copias/mL) y CD4 en aumento progresivo (> 500 células/µL). La carga viral se controla a los 6 meses y luego cada 6 meses."}, {"nivel": "d", "caso": "Mujer de 45 años: citología HSIL y VPH de alto riesgo positivo.", "pregunta": "¿Qué se hace?", "correcta": "Colposcopia y/o biopsia", "distractores": ["Repetir co-test en 3 años", "Repetir en 12 meses", "Vacunar y controlar en 5 años"], "explicacion": "HSIL con VPH positivo es una lesión de alto grado con virus oncogénico: colposcopia y biopsia. Si se confirma NIC 2–3, escisión (LEEP o conización)."}, {"nivel": "d", "pregunta": "¿Qué genotipos agrega la vacuna nonavalente frente a la tetravalente?", "correcta": "31, 33, 45, 52 y 58", "distractores": ["6 y 11", "1, 2 y 4", "16 y 18"], "explicacion": "Gardasil 9 cubre 6, 11, 16, 18, 31, 33, 45, 52 y 58. La tetravalente del MINSA cubre 6, 11, 16 y 18; la bivalente, 16 y 18."}, {"nivel": "x", "caso": "Mujer de 38 años de la Amazonía peruana, con debilidad progresiva de ambas piernas desde hace 2 años, hiperreflexia, Babinski positivo, dolor lumbar y urgencia urinaria. Serología anti-HTLV-1 positiva.", "pregunta": "¿Cuál es el diagnóstico y cómo se produce el daño?", "correcta": "Paraparesia espástica tropical (HAM/TSP): la respuesta inmune contra linfocitos infectados desmieliniza la médula", "distractores": ["ATLL con infiltración medular por células en flor", "Esclerosis por infección directa de neuronas por HTLV-1", "Neurosífilis por coinfección"], "explicacion": "HAM/TSP afecta a menos del 1 % de los infectados: el virus infecta CD4 que entran al SNC, y la respuesta citotóxica daña los cordones laterales y anteriores. No hay cura: corticoides, interferón y rehabilitación."}, {"nivel": "x", "caso": "Gestante de 28 semanas en una zona con agua no potable: ictericia, malestar y deterioro rápido de la función hepática.", "pregunta": "¿Qué virus hepatotropo sospechas primero?", "correcta": "Hepatitis E", "distractores": ["Hepatitis A", "Hepatitis C", "Hepatitis B"], "explicacion": "La E (Hepeviridae, ARN +) y la A se transmiten por vía fecal-oral, pero la E es la que se vuelve grave en gestantes. B y C son por sangre y tienden a la cronicidad."}, {"nivel": "x", "caso": "Gestante con HTLV-1 detectado en el control prenatal pregunta cómo evitar contagiar a su bebé.", "pregunta": "¿Qué medida reduce más el riesgo?", "correcta": "Evitar o acortar la lactancia materna", "distractores": ["Cesárea programada", "Vacunar al recién nacido", "Dar zidovudina al bebé por 6 semanas"], "explicacion": "El HTLV-1 pasa en los linfocitos de la leche y el riesgo aumenta con la lactancia prolongada (10–25 % en hijos de madres positivas). Por eso Japón hace control prenatal obligatorio."}, {"nivel": "x", "pregunta": "¿Qué antiviral contra la influenza inhibe la polimerasa, en lugar de la neuraminidasa?", "correcta": "Baloxavir marboxil", "distractores": ["Oseltamivir", "Zanamivir", "Peramivir"], "explicacion": "Antiinfluenza: inhibidores de neuraminidasa (oseltamivir, zanamivir, peramivir) e inhibidor de polimerasa (baloxavir marboxil)."}, {"nivel": "x", "pregunta": "¿En qué células se cultiva el virus influenza?", "correcta": "Células MDCK", "distractores": ["Células HeLa", "Células H9", "Agar sangre"], "explicacion": "El cultivo viral usa líneas celulares específicas: influenza en MDCK, enterovirus en HeLa. Es lento, costoso y requiere BSL-2 o más. Las células H9 se usan en la IFI del VIH."}, {"nivel": "x", "pregunta": "¿Qué antiviral sirve contra los poxvirus (viruela del mono)?", "correcta": "Tecovirimat", "distractores": ["Oseltamivir", "Sofosbuvir", "Raltegravir"], "explicacion": "Poxvirus: tecovirimat, cidofovir y brincidofovir. El cidofovir también se usa en adenovirus graves de inmunodeprimidos."}, {"nivel": "x", "pregunta": "¿Dónde se encuentra sobre todo el HTLV-2 en el Perú?", "correcta": "En pueblos indígenas amazónicos (Shipibo-Conibo, Matsés) y usuarios de drogas inyectables", "distractores": ["En donantes de sangre de Lima", "En gestantes de la costa sur", "Solo en casos importados de Japón"], "explicacion": "El HTLV-1 es endémico en todo el Perú (donantes 0,4–1 %, gestantes 0,6–1,2 %). El HTLV-2 se concentra en pueblos amazónicos y usuarios de drogas IV."}, {"nivel": "x", "pregunta": "En el cáncer anal, ¿qué genotipo de VPH predomina?", "correcta": "VPH 16, en más del 85 % de los casos", "distractores": ["VPH 6", "VPH 18, en más del 85 %", "VPH 1 y 2"], "explicacion": "VPH 16 domina en ano (> 85 %), pene (> 70 %) y orofaringe (70–90 %). En vulva: 16 y 33. En vagina: 16 y 18."}, {"nivel": "x", "caso": "Mujer de 26 años sin síntomas pide un co-test (citología + PCR de VPH) porque una amiga se lo hizo.", "pregunta": "¿Qué le explicas?", "correcta": "A su edad no se recomienda: muchas infecciones por VPH son transitorias y llevarían a procedimientos innecesarios", "distractores": ["Debe hacérselo cada año desde ahora", "Solo sirve si ya tiene verrugas", "Es obligatorio antes de vacunarse"], "explicacion": "El co-test se recomienda de 30 a 65 años. Antes de los 30, las infecciones transitorias son muy frecuentes; solo cerca del 10 % persiste más de 12–24 meses."}];
