<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>UsiLab · Reto de Microbiología</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Plan: tablero de estaciones. Cada tema es una estación con progreso; los casos clínicos se desbloquean al final. */
:root {
  --bg: #F3EFE6;
  --surface: #FFFDF8;
  --fg: #1C2A2E;
  --muted: #5C6B6F;
  --accent: #2F7D6B;
  --hint: #B07A12;
  --bad: #A8433A;
  --line: #D9D2C3;
  --xhard: #6B3FA0;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "Newsreader", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191B; --surface: #1A2326; --fg: #E6EEEB; --muted: #94A5A3;
    --accent: #5FC2A8; --hint: #E7B25A; --bad: #E07A6E; --line: #2C3A3D; --xhard: #B99BE6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191B; --surface: #1A2326; --fg: #E6EEEB; --muted: #94A5A3;
  --accent: #5FC2A8; --hint: #E7B25A; --bad: #E07A6E; --line: #2C3A3D; --xhard: #B99BE6; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.1; margin: 0; text-wrap: balance; }
.stats { font-family: var(--display); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats strong { color: var(--accent); }
.grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 520px) { .grid { grid-template-columns: 1fr 1fr; } }
.station {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.station h2 { font-family: var(--display); font-size: 19px; margin: 0; }
.station p { margin: 0; color: var(--muted); font-size: 15px; }
.tag { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--hint); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
button {
  font: inherit; font-family: var(--display); font-size: 15px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 8px 14px; border-radius: 999px; min-height: 40px;
}
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: default; }
.locked { border-style: dashed; opacity: .75; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-family: var(--display); margin: 0; font-size: 22px; }
.study { white-space: pre-wrap; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts button { text-align: left; border-radius: 6px; font-family: var(--body); font-size: 16px; }
.opts button.right { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.opts button.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.case { margin: 0; padding: 12px 14px; border-left: 3px solid var(--hint); background: color-mix(in srgb, var(--hint) 8%, var(--surface)); }
.hint { color: var(--hint); font-style: italic; margin: 0; }
.feedback { margin: 0; min-height: 1.5em; font-weight: 600; }
.feedback.ok { color: var(--accent); }
.feedback.no { color: var(--bad); }
.why { margin: 0; font-weight: 400; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
#loader {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20;
}
#loader[hidden] { display: none !important; }
.fact { max-width: 480px; text-align: center; }
.fact small { font-family: var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--hint); font-size: 12px; }
.fact p { font-size: 21px; margin: 8px 0 0; text-wrap: balance; line-height: 1.35; }
.fact .skip { display: block; margin-top: 18px; font-family: var(--display); font-size: 12px; color: var(--muted); }
#loader { cursor: pointer; }
.word { font-family: var(--display); font-size: 28px; letter-spacing: .12em; margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
.kb { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.kb button { padding: 6px 0; min-height: 40px; border-radius: 6px; }
.kb button.hit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.kb button.miss { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.photo { background: #000; border-radius: 6px; overflow: hidden; aspect-ratio: 3 / 4; max-height: 60vh; max-width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ficha { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; padding: 12px 14px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border-radius: 6px; font-size: 15px; }
.ficha dt { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.ficha dd { margin: 0; min-width: 0; }
.levels { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 560px) { .levels { grid-template-columns: repeat(2, 1fr); } }
.level { text-align: left; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--line); min-width: 0; }
.level strong { font-size: 18px; }
.level span { font-family: var(--body); font-size: 15px; color: var(--muted); line-height: 1.35; }
.level small { font-family: var(--body); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.level.f strong { color: var(--accent); } .level.m strong { color: var(--hint); } .level.d strong { color: var(--bad); }
.level.on.f { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.level.on.m { border-color: var(--hint); background: color-mix(in srgb, var(--hint) 12%, var(--surface)); }
.level.on.d { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.level.x strong { color: var(--xhard); }
.level.on.x { border-color: var(--xhard); background: color-mix(in srgb, var(--xhard) 12%, var(--surface)); }
.login { max-width: 460px; width: 100%; margin: 0 auto; }
.acct { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.acct img { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.acct div { display: flex; flex-direction: column; min-width: 0; }
.acct strong { font-family: var(--display); font-size: 17px; }
.acct small { color: var(--muted); font-size: 13px; }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--display); font-size: 14px; margin-top: 4px; }
.who img { width: 28px; height: 28px; border-radius: 50%; }
.who .sync { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; }
.who button { min-height: 34px; padding: 4px 12px; font-size: 13px; }
ol.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
ol.rank li { display: grid; grid-template-columns: 26px 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
ol.rank li.empty { display: block; color: var(--muted); }
ol.rank li.me { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
ol.rank .pos { font-family: var(--display); font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
ol.rank img { width: 32px; height: 32px; border-radius: 50%; }
ol.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ol.rank .pts { font-family: var(--display); text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .pts small { display: block; color: var(--muted); font-size: 12px; font-family: var(--body); }
.msg { margin: 0; min-height: 1.3em; font-size: 15px; }
.msg.ok { color: var(--accent); } .msg.no { color: var(--bad); }
.idx-sec { display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 80px; }
.idx-sec h3 { font-family: var(--display); font-size: 22px; margin: 14px 0 0; display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.idx-sec h3 small { font-size: 13px; color: var(--muted); font-weight: 400; }
.idx-sec h4, h4.grp-title { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--hint); margin: 10px 0 4px; }
.idx-items { display: grid; grid-template-columns: 1fr; gap: 6px; }
@media (min-width: 560px) { .idx-items { grid-template-columns: repeat(2, 1fr); } }
.idx-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; border-radius: 8px; min-height: 44px; padding: 8px 12px; font-family: var(--body); font-size: 16px; min-width: 0; }
.idx-item span { min-width: 0; }
.idx-item b { font-family: var(--display); font-size: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums; flex: none; }
.tool.flujo-eval { border-color: color-mix(in srgb, var(--xhard) 45%, var(--line)); }
.tool.flujo-eval small { color: var(--xhard); }
/* Preguntas tipo flujograma en el juego */
.fj-revela { margin: 0; font-family: var(--display); font-weight: 600; color: var(--accent); }
button.fj-modo { text-align: left; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--xhard); background: color-mix(in srgb, var(--xhard) 8%, var(--surface)); }
button.fj-modo strong { font-size: 18px; color: var(--xhard); }
button.fj-modo span { font-family: var(--body); font-size: 14px; color: var(--muted); line-height: 1.35; }
.fj-cuerpo, .fj-extra, .fj-huecos { display: flex; flex-direction: column; gap: 10px; }
.fj-hueco { display: flex; flex-direction: column; gap: 6px; }
.fj-hueco strong { font-family: var(--display); font-size: 14px; }
.opts button.sel { border-color: var(--fg); background: color-mix(in srgb, var(--fg) 10%, var(--surface)); font-weight: 600; }
.fg-nodo.fg-hueco { border-style: dashed; background: var(--surface); }
.fg-nodo.fg-hueco span { font-family: var(--display); font-weight: 600; color: var(--muted); }
.fg-nodo.fg-ok { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.fg-nodo.fg-mal { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 55%, transparent); }
ol.flujo-armado { margin: 0; padding-left: 26px; display: flex; flex-direction: column; gap: 6px; }
ol.flujo-armado li.vacio { list-style: none; margin-left: -26px; color: var(--muted); font-size: 15px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; }
.flujo-elegido, .flujo-ficha { width: 100%; text-align: left; border-radius: 8px; font-family: var(--body); font-size: 15px; line-height: 1.35; }
ol.flujo-armado li.bien .flujo-elegido { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
ol.flujo-armado li.mal .flujo-elegido { border-color: var(--hint); background: color-mix(in srgb, var(--hint) 12%, var(--surface)); }
ol.flujo-armado li.intruso .flujo-elegido { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); text-decoration: line-through; }
.flujo-banco { display: flex; flex-direction: column; gap: 6px; }
.flujo-ficha { border-style: dashed; }
h3.flujo-sub { margin: 4px 0 0; font-family: var(--display); font-size: 16px; }
/* Flujograma gráfico */
figure.fg { margin: 0; display: flex; flex-direction: column; align-items: stretch; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.fg-leyenda { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.fg-ley { font-family: var(--display); font-size: 11px; padding: 2px 8px; border-radius: 999px; border-left: 6px solid var(--c); background: var(--surface); }
.fg-patogenia { --c: #B4532A; } .fg-zona { --c: #3A6EA5; } .fg-sintomas { --c: #A8433A; } .fg-enfermedad { --c: #B07A12; }
.fg-diagnostico { --c: #2F7D6B; } .fg-tratamiento { --c: #6B3FA0; } .fg-prevencion { --c: #4D6B2E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fg-patogenia { --c: #E08A5F; } :root:not([data-theme="light"]) .fg-zona { --c: #7FA9D8; } :root:not([data-theme="light"]) .fg-sintomas { --c: #E07A6E; } :root:not([data-theme="light"]) .fg-enfermedad { --c: #E7B25A; } :root:not([data-theme="light"]) .fg-diagnostico { --c: #5FC2A8; } :root:not([data-theme="light"]) .fg-tratamiento { --c: #B99BE6; } :root:not([data-theme="light"]) .fg-prevencion { --c: #9CC46B; } }
.fg-fila { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fg-nodo { width: 100%; max-width: 420px; text-align: center; padding: 10px 14px; background: color-mix(in srgb, var(--c, var(--accent)) 10%, var(--surface)); border: 2px solid var(--c, var(--accent)); display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.35; }
.fg-nodo small { font-family: var(--display); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--c, var(--accent)); }
.fg-pro { border-radius: 6px; }
.fg-ini, .fg-fin { border-radius: 999px; padding-inline: 22px; }
.fg-fin { border-width: 3px; }
.fg-dec { border: 0; padding: 16px 34px; background: var(--c, var(--hint)); clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 22px 100%, 0 50%); color: #fff; font-family: var(--display); font-weight: 600; }
.fg-dec small { color: rgba(255,255,255,.85); }
.fg-flecha { position: relative; height: 26px; display: flex; justify-content: center; }
.fg-flecha::before { content: ""; width: 2px; background: var(--muted); height: 18px; }
.fg-flecha::after { content: ""; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top: 7px solid var(--muted); border-bottom: 0; }
.fg-flecha b { position: absolute; left: calc(50% + 10px); top: 3px; font-family: var(--display); font-size: 12px; color: var(--accent); }
.fg-rama { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 420px; padding-left: 18px; }
.fg-rama b { font-family: var(--display); font-size: 12px; color: var(--bad); flex: none; }
.fg-rama b::after { content: " ↳"; color: var(--muted); }
.fg-rama-caja { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.35; padding: 8px 10px; border: 1.5px dashed var(--bad); border-radius: 6px; background: var(--surface); }
.fg-muestra { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.fg-muestra .fg-nodo { width: auto; padding: 6px 14px; font-size: 13px; --c: var(--muted); }
.fg-muestra .fg-dec { padding: 8px 24px; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); }
details.fe-modelo > summary, details.fs-exp > summary { font-family: var(--display); }
details.fe-modelo[open] figure.fg { margin-bottom: 4px; }
ol.fs-flujo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 24px; }
ol.fs-flujo li { position: relative; border: 1.5px solid var(--accent); border-radius: 12px; padding: 12px 14px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
ol.fs-flujo li:not(:last-child)::after { content: "↓"; position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); line-height: 24px; color: var(--muted); font-family: var(--display); }
ol.fs-flujo li strong { display: block; font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
ol.fs-flujo li p { margin: 0; font-size: 15px; line-height: 1.45; }
ol.fs-flujo li.fs-enfermedad { border-color: var(--hint); background: color-mix(in srgb, var(--hint) 10%, var(--surface)); }
ol.fs-flujo li.fs-enfermedad strong { color: var(--hint); }
ol.fs-flujo li.fs-tratamiento { border-color: var(--xhard); background: color-mix(in srgb, var(--xhard) 7%, var(--surface)); }
ol.fs-flujo li.fs-tratamiento strong { color: var(--xhard); }
.fe-station { border-color: color-mix(in srgb, var(--xhard) 45%, var(--line)); }
.fe-criterios { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fe-chip { font-family: var(--display); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
button.fe-caso { text-align: left; cursor: pointer; font: inherit; color: inherit; background: var(--surface); }
button.fe-caso:hover { border-color: var(--accent); }
ol.fe-pasos { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.fe-subir { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.fe-preview { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 100%; background: #000; }
.fe-preview img { display: block; max-width: 100%; max-height: 60vh; object-fit: contain; }
.fe-resultado { display: flex; flex-direction: column; gap: 10px; }
.fe-resumen { margin: 0; font-size: 17px; }
details.fe-crit { border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 0 12px; }
details.fe-crit[open] { padding-bottom: 12px; }
details.fe-crit.ok { border-left-color: var(--accent); }
details.fe-crit.medio { border-left-color: var(--hint); }
details.fe-crit.mal { border-left-color: var(--bad); }
details.fe-crit.ileg { border-left-color: var(--bad); border-left-style: dashed; }
details.fe-crit.ileg > summary b { color: var(--bad); }
.fe-ilegible { border: 1.5px dashed var(--bad); border-radius: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
.fe-ilegible h3 { margin: 0 0 4px; font-family: var(--display); font-size: 15px; color: var(--bad); }
.fe-ilegible p { margin: 0 0 6px; font-size: 14px; }
.fe-ilegible ul { margin: 0; padding-left: 20px; font-size: 14px; }
details.fe-crit > summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; font-family: var(--display); font-weight: 600; list-style: none; }
details.fe-crit > summary::-webkit-details-marker { display: none; }
details.fe-crit > summary b { font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.exam-nota { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px; border-radius: 14px; text-align: center; }
.exam-nota strong { font-family: var(--display); font-size: 48px; font-weight: 800; line-height: 1.05; }
.exam-nota small { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--muted); }
.exam-nota span { color: var(--muted); font-size: 15px; }
.exam-nota.aprob { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.exam-nota.aprob strong { color: var(--accent); }
.exam-nota.desaprob { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.exam-nota.desaprob strong { color: var(--bad); }
details.fe-crit.ok > summary b { color: var(--accent); } details.fe-crit.medio > summary b { color: var(--hint); } details.fe-crit.mal > summary b { color: var(--bad); }
.fe-estado { font-family: var(--display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fe-crit p { margin: 6px 0 0; font-size: 15px; line-height: 1.45; }

  { g: "Hongos", a: "Trichophyton rubrum", c: "Hifas septadas delgadas con pocos conidios; cuando aparecen, son microconidios en lágrima pegados a la hifa. Colonia con reverso rojo vinoso.", e: "Tinea pedis crónica, onicomicosis, tinea cruris y corporis.", t: "Terbinafina oral (onicomicosis: 12 semanas).", k: "Hifas finas casi sin conidios; lágrimas pegadas a la hifa." },
  { g: "Hongos", a: "Epidermophyton floccosum", c: "Macroconidios en mazo, de pared lisa y 2 a 4 células, en grupos. Sin microconidios.", e: "Tinea pedis, cruris, corporis y onicomicosis. Nunca afecta el pelo.", t: "Terbinafina o azoles tópicos.", k: "Macroconidios en mazo, lisos, en grupos." },
  { g: "Hongos", a: "Cladosporium", c: "Hongo dematiáceo (marrón): conidios pequeños y ovalados en cadenas ramificadas, con células escudo.", e: "Contaminante y alérgeno (asma, rinitis); rara vez feohifomicosis.", t: "Itraconazol (referencia).", k: "Conidios pequeños en cadenas ramificadas." },
  { g: "Hongos", a: "Alternaria", c: "Hongo dematiáceo: conidios grandes, marrones y muriformes (tabiques transversales y longitudinales), en forma de maza con pico, en cadena.", e: "Alérgeno (sinusitis fúngica alérgica, asma); feohifomicosis y queratitis en inmunodeprimidos.", t: "Itraconazol o voriconazol, con o sin cirugía (referencia).", k: "Conidios grandes con tabiques en dos direcciones." },
  { g: "Hongos", a: "Paracoccidioides brasiliensis", c: "Levadura madre grande con múltiples gemaciones alrededor: rueda de timón.", e: "Paracoccidioidomicosis: agricultor con tos crónica, BK negativa, úlceras orales moriformes y adenopatías.", t: "Itraconazol; en casos graves, anfotericina B.", k: "Rueda de timón." },
  { g: "Hongos", a: "Sporothrix schenckii", c: "Hifas delgadas septadas con conidios en margarita o roseta en la punta (fase moho, 25 °C). En tejido: levaduras en forma de puro.", e: "Esporotricosis linfocutánea: pinchazo con rosal o madera y nódulos en cadena que suben por los linfáticos.", t: "Itraconazol (alternativa: yoduro de potasio).", k: "Conidios en margarita en la punta." },
  { g: "Hongos", a: "Rhizopus", c: "Hifas anchas, no septadas, con esporangios redondos y rizoides.", e: "Mucormicosis rinocerebral (diabético en cetoacidosis, escara negra en el paladar) o pulmonar (halo invertido).", t: "Anfotericina B liposomal, desbridamiento quirúrgico y control de la glucosa.", k: "Hifas anchas sin tabiques y esporangios." },
  { g: "Hongos", a: "Histoplasma capsulatum", c: "Fase moho: macroconidias tuberculadas, redondas con espinas. En tejido: levaduras pequeñas dentro de macrófagos.", e: "Histoplasmosis: cuevas y murciélagos (Tingo María); diseminada en VIH.", t: "Itraconazol; en casos graves, anfotericina B.", k: "Macroconidias redondas con espinas." },
  { g: "Hongos", a: "Microsporum canis", c: "Macroconidios en huso, de pared gruesa y rugosa, con muchos tabiques.", e: "Tinea capitis en niños con gatos o perros; tinea corporis.", t: "Griseofulvina oral.", k: "Huso de pared gruesa y rugosa." },
  { g: "Hongos", a: "Penicillium", c: "Hifas septadas con conidióforos ramificados en pincel, sin vesícula, y cadenas de conidios.", e: "Sobre todo contaminante ambiental.", t: "Generalmente no requiere tratamiento.", k: "Pincel sin vesícula." },
  { g: "Bacterias", a: "Mycobacterium tuberculosis", c: "Ziehl-Neelsen: bacilos rojos o fucsia, delgados, rectos o curvos, a veces en cordones, sobre fondo azul.", e: "Tuberculosis pulmonar.", t: "HRZE 2 meses y HR 4 meses. Si hay resistencia: BPaLM.", k: "Bacilos rojos sobre fondo azul." },
  { g: "Sedimento urinario", a: "Leucocitos", c: "Células granulosas con núcleo lobulado, más grandes que los hematíes. Normal: 0 a 5 por campo.", e: "Más de 5 por campo es piuria: infección urinaria (si es intensa, pielonefritis).", t: "Según urocultivo y antibiograma.", k: "Núcleo lobulado y granulaciones." },
  { g: "Sedimento urinario", a: "Células epiteliales escamosas", c: "Células grandes, planas y poligonales, con un núcleo pequeño central, como huevo frito.", e: "Más de 15 por campo indica muestra contaminada.", t: "Repetir la muestra (chorro medio con higiene previa).", k: "Huevo frito." },
  { g: "Sedimento urinario", a: "Trichomonas vaginalis", c: "Protozoo en forma de pera, con flagelos y movimiento.", e: "Tricomoniasis (ITS): flujo amarillo-verdoso espumoso.", t: "Metronidazol a la paciente y a su pareja.", k: "Pera con flagelos que se mueve." },
  { g: "Sedimento urinario", a: "Cilindros urinarios", c: "Molde alargado de bordes paralelos, formado en los túbulos renales.", e: "Hialino: normal o deshidratación. Leucocitario: pielonefritis. Hemático: glomerulonefritis. Granuloso: daño tubular.", t: "Según la causa.", k: "Molde alargado de bordes paralelos." },
  { g: "Sedimento urinario", a: "Levaduras en orina", c: "Células ovaladas con gemación, a veces con pseudohifas.", e: "Candiduria: diabético, paciente con sonda, uso de antibióticos.", t: "Retirar o cambiar la sonda; fluconazol si hay síntomas.", k: "Ovaladas con brotes." },
  { g: "Sedimento urinario", a: "Hematíes", c: "Discos pequeños y lisos, sin núcleo, con el centro más claro. Normal: 0 a 2 por campo.", e: "Hematuria: ITU, litiasis, tumor; con cilindros hemáticos, glomerulonefritis.", t: "Según la causa.", k: "Discos sin núcleo." }
];

// o como invitado. El avance de cada cuenta se guarda en su espacio privado y su puntaje en el ranking.
const SAVE_KEY = "reto-micro-v3";
const BLANK = () => ({ score: 0, streak: 0, mastered: {}, rounds: {}, hangSeen: {}, lastLevel: {}, errores: {} });
const state = BLANK();
const session = { user: null, db: null, id: null, name: "", avatar: "", mode: null, ready: false };
let localKey = SAVE_KEY;

function readLocal(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function resetState(obj) {
  Object.keys(state).forEach((k) => { delete state[k]; });
  Object.assign(state, BLANK(), obj || {});
}

let syncTimer = null, syncing = false, syncAgain = false;
function saveState() {
  try { localStorage.setItem(localKey, JSON.stringify(state)); } catch (e) {}
  if (session.mode === "cuenta" && session.db) { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500); }
}
function setSync(t) { const el = document.getElementById("sync"); if (el) el.textContent = t; }
async function syncNow() {
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSync("Guardando…");
  try {
    await session.db.doc("data/users/" + session.id + "/progreso").set(JSON.parse(JSON.stringify(state)));
    const dominadas = Object.values(state.mastered).reduce((n, m) => n + Object.keys(m).length, 0);
    await session.db.doc("ranking/" + session.id).set({ score: state.score, dominadas: dominadas, t: Date.now() });
    setSync("Guardado en tu cuenta");
  } catch (e) {
    setSync(e && e.code === "invalid_argument" ? "Tu acceso no permite guardar en línea: se guarda en este dispositivo" : "Sin conexión: se guarda en este dispositivo");
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; syncNow(); }
}

async function boot() {
  const NAV = { inicio: () => showInicio(), jugar: () => showHome(), estudio: () => showStudyHub(), comentarios: () => showComments() };
  document.querySelectorAll("#topnav button").forEach((b) => { b.onclick = NAV[b.dataset.k]; });
  showLogin();
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [user, db] = await Promise.all([use("user"), use("db")]);
  session.user = user; session.db = db;
  if (user) {
    const me = await user.me();
    session.id = me.id; session.name = me.name; session.avatar = me.avatarUrl;
  }
  session.ready = true;
  if (!session.mode) showLogin();
}

function showLogin() {
  $("#home").hidden = true; $("#panel").hidden = true; $("#menu").hidden = true;
  setCrumb(null); stopComments();
  const box = $("#login"); box.hidden = false; box.innerHTML = "";

    const acct = mk("div", "acct");

async function enter(mode) {
  session.mode = mode;
  localKey = mode === "cuenta" ? SAVE_KEY + ":" + session.id : SAVE_KEY;
  let data = readLocal(localKey);
  if (mode === "cuenta" && session.db) {
    try {
      const s = await session.db.doc("data/users/" + session.id + "/progreso").get();
      if (s.exists) { const remote = s.data(); if (!data || (remote.score || 0) >= (data.score || 0)) data = remote; }
    } catch (e) {}
    if (!data) data = readLocal(SAVE_KEY); // primera vez con cuenta: trae lo jugado como invitado
  }
  resetState(JSON.parse(JSON.stringify(data || {})));
  renderWho();
  showInicio();
  updateBadge();
  if (mode === "cuenta") saveState();
}

function renderWho() {
  const w = $("#who"); w.innerHTML = ""; w.hidden = false;
  if (session.mode === "cuenta") { const img = mk("img"); img.src = session.avatar; img.alt = ""; w.append(img); }
  w.append(mk("strong", null, session.mode === "cuenta" ? (session.name || "Tu cuenta") : "Invitado"));
  const s = mk("span", "sync", session.mode === "cuenta" ? "" : "Avance solo en este dispositivo"); s.id = "sync"; w.append(s);
  if (session.mode === "cuenta" && session.db) { const r = mk("button", "ghost", "Ranking"); r.onclick = showRanking; w.append(r); }

const $ = (s) => document.querySelector(s);
const ALL = () => [...STATIONS, MICRO, AHORCADO, CASOS];
const getStation = (id) => ALL().find((s) => s.id === id);
const ROUND = { casos: 4 };
const roundSize = (st, k) => Math.min(ROUND[st.id] || 5, k ? st.bank.filter((q) => q.n === k).length : st.bank.length);

function doneCount(st) { return Object.keys(state.mastered[st.id] || {}).length; }
function isUnlocked(st) {
  return true; // Casos clínicos siempre abierto.
  return STATIONS.filter((s) => s.bank.length > 0).every((s) => (state.rounds[s.id] || 0) > 0);
}

// Ronda al azar: primero las que todavía no dominas, luego las demás.
function pickRound(st, k) {
  const m = state.mastered[st.id] || {};
  const idx = st.bank.map((_, i) => i).filter((i) => !k || st.bank[i].n === k);
  const nuevas = shuffle(idx.filter((i) => !m[i]));
  const vistas = shuffle(idx.filter((i) => m[i]));
  return shuffle([...nuevas, ...vistas].slice(0, roundSize(st, k)));
}

function toItem(q, key) {
  const options = shuffle([q.ok, ...shuffle(q.no).slice(0, 3)]); // siempre 4 opciones
  return { key, caso: q.c, q: q.q || "¿Cuál es el diagnóstico más probable?", options, answer: options.indexOf(q.ok), hint: q.h, why: q.y };
}

function pickLevel(id) {
  const st = getStation(id);
  const m = state.mastered[id] || {};
  showLevelPicker(st.name, (k) => {
    const ids = st.bank.map((q, i) => (q.n === k ? i : -1)).filter((i) => i >= 0);
    return ids.length + " preguntas · " + ids.filter((i) => m[i]).length + " dominadas · rondas de " + roundSize(st, k);
  }, (k) => go(() => startRound(id, k), id), showHome, id);
  if (id === "virus" && typeof elegirModoFlujo === "function") {
    const p = $("#panel");
    const nota = mk("p", "note", "Cada ronda de Virus incluye un flujograma en papel (con foto) que se corrige según el nivel. Para practicar solo flujogramas:");
    const b = mk("button", "fj-modo", ""); b.type = "button";
    b.append(mk("strong", null, "Modo flujogramas"), mk("span", null, "Siempre en papel con foto; Claude corrige. Fácil: 4 criterios · Medio: 6 · Difícil: 8 · Muy difícil: 8 con nivel de examen final"));
    b.onclick = () => elegirModoFlujo();
    const fila = p.querySelector(".row");
    p.insertBefore(nota, fila); p.insertBefore(b, fila);
  }
}

function startRound(id, k) {
  const st = getStation(id);
  const items = pickRound(st, k).map((i) => toItem(st.bank[i], i));
  // Virus: una de las preguntas de cada ronda es de flujograma, evaluada según el nivel.
  if (id === "virus" && items.length >= 2 && typeof itemFlujo === "function") items.splice(Math.floor(Math.random() * items.length), 1, itemFlujo(k));
  runQuiz(st.name + " · " + NOMBRE_NIVEL[k], items, PTS[k] * (id === "casos" ? 2 : 1), {
    station: id,
    hint: HINT[k],
    onExit: showHome,
    onAgain: () => pickLevel(id),
    onEnd: () => { state.rounds[id] = (state.rounds[id] || 0) + 1; saveState(); }
  });
}

// Pantalla para elegir el modo: se toca uno y luego se confirma.
function showLevelPicker(title, info, onConfirm, onBack, memKey) {
  const p = openPanel();
  p.append(mk("h2", null, title));
  p.append(mk("p", "note", "Elige el modo y confirma."));
  const box = mk("div", "levels");
  box.setAttribute("role", "radiogroup");
  let sel = (state.lastLevel || {})[memKey] || null;
  const confirm = mk("button", "primary", "Confirmar");
  const paint = () => {
    box.querySelectorAll(".level").forEach((b) => { const on = b.dataset.k === sel; b.classList.toggle("on", on); b.setAttribute("aria-checked", on); });
    confirm.disabled = !sel;
    confirm.textContent = sel ? "Confirmar: " + NOMBRE_NIVEL[sel] : "Confirmar";
  };
  NIVELES.forEach((lv) => {
    const b = mk("button", "level " + lv.k); b.dataset.k = lv.k; b.setAttribute("role", "radio");
    b.append(mk("strong", null, lv.name), mk("span", null, lv.desc));
    const extra = info ? info(lv.k) : "";
    if (extra) b.append(mk("small", null, extra));
    b.onclick = () => { sel = lv.k; paint(); };
    box.append(b);
  });
  confirm.onclick = () => {
    if (!sel) return;
    state.lastLevel = state.lastLevel || {}; state.lastLevel[memKey] = sel; saveState();
    onConfirm(sel);
  };
  const back = mk("button", "ghost", "Volver"); back.onclick = onBack;
  const row = mk("div", "row"); row.append(confirm, back);
  p.append(box, row);
  paint();
}

function showHangman(level = "medio") {
  const lista = AHORCADO.niveles[level];
  let vistas = state.hangSeen[level] || [];
  if (vistas.length >= lista.length) vistas = [];
  const libres = lista.filter((x) => !vistas.includes(x.w));
  const item = libres[Math.floor(Math.random() * libres.length)];
  state.hangSeen[level] = [...vistas, item.w]; saveState();
  const pts = AHORCADO.puntos[level];
  const guessed = new Set();
  const revelar = { facil: 3, medio: 1, dificil: 0, muydificil: 0 }[level];
  const maxErr = level === "muydificil" ? 5 : 6;
  [...new Set(item.w.split(""))].sort(() => Math.random() - 0.5).slice(0, revelar).forEach((l) => guessed.add(l));
  let errors = 0;
  let over = false;
  const p = $("#panel");
  p.hidden = false; $("#home").hidden = true; p.innerHTML = "";

  const h = document.createElement("h2"); h.textContent = "Ahorcado";
  const clue = document.createElement("p"); clue.className = "case"; clue.textContent = "Pista: " + item.c;
  const status = document.createElement("p"); status.className = "note";
  const word = document.createElement("p"); word.className = "word";
  const kb = document.createElement("div"); kb.className = "kb";
  const msg = document.createElement("p"); msg.className = "feedback";
  const row = document.createElement("div"); row.className = "row";
  const again = document.createElement("button"); again.className = "primary"; again.textContent = "Otra palabra"; again.hidden = true;
  again.onclick = () => go(() => showHangman(level), "ahorcado");
  const exit = document.createElement("button"); exit.className = "ghost"; exit.textContent = "Volver al tablero";
  exit.onclick = showHome;
  row.append(again, exit);

  function refresh() {
    status.textContent = "Errores: " + errors + " de " + maxErr;
    word.textContent = item.w.split("").map((ch) => (guessed.has(ch) ? ch : "_")).join(" ");
  }
  function finish(won) {
    over = true;
    kb.querySelectorAll("button").forEach((b) => b.disabled = true);
    if (won) {
      state.score += pts; state.streak += 1;
      msg.className = "feedback ok";
      msg.textContent = "¡Lo adivinaste! +" + pts + " puntos";
    } else {
      state.streak = 0;
      msg.className = "feedback no";
      msg.textContent = "Era " + item.w + ".";
    }
    again.hidden = false;
    saveState();
    renderStats();
  }

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach((l) => {
    const b = document.createElement("button");
    b.textContent = l;
    if (guessed.has(l)) { b.disabled = true; b.classList.add("hit"); }
    b.onclick = () => {
      if (over) return;
      b.disabled = true;
      if (item.w.includes(l)) {
        guessed.add(l);
        b.classList.add("hit");
      } else {
        errors += 1;
        b.classList.add("miss");
      }
      refresh();
      if (item.w.split("").every((ch) => guessed.has(ch))) finish(true);
      else if (errors >= maxErr) finish(false);
    };
    kb.append(b);
  });

  refresh();
  p.append(h, clue, status, word, kb, msg, row);
}

const MICRO_DESC = { f: "3 opciones · pista gratis", m: "4 opciones · pista a mitad de puntos", d: "4 opciones · sin pistas", x: "4 opciones, siempre con el hongo que más se le parece · sin pistas" };
function microPick(name, gen) {
  showLevelPicker(name, (k) => MICRO_DESC[k], (k) => go(() => runQuiz(name + " · " + NOMBRE_NIVEL[k], gen(k), PTS[k], { hint: HINT[k] }), "micro"), showMicroMenu, "micro-" + name);
}

function opciones(correct, pool, n) {
  const pares = PARES.filter((x) => x[0] === correct || x[1] === correct).map((x) => (x[0] === correct ? x[1] : x[0]));
  const resto = shuffle(pool.filter((x) => x !== correct && !pares.includes(x)));
  const opts = [correct, ...pares, ...resto].slice(0, n);
  return shuffle(opts);
}

function fotoItems(k = "m") {
  const hongos = AGENTES.filter((x) => x.g === "Hongos").map((x) => x.a);
  // Ronda equilibrada: una foto de cada agente y el resto sin repetir foto.
  const porAgente = {};
  shuffle(FOTOS).forEach((f) => { (porAgente[f.a] = porAgente[f.a] || []).push(f); });
  const ronda = Object.values(porAgente).map((l) => l.shift());
  const resto = shuffle(Object.values(porAgente).flat());
  while (ronda.length < 10 && resto.length) ronda.push(resto.shift());
  return shuffle(ronda).map((f) => {
    const opts = opciones(f.a, hongos, NOPC[k]);
    return { img: f.img, q: "¿Qué es? (foto " + f.n + ")", options: opts, answer: opts.indexOf(f.a), hint: agente(f.a).k, ficha: agente(f.a) };
  });
}

function criterioItems(k = "m") {
  return shuffle(AGENTES).slice(0, 10).map((ag) => {
    const pool = AGENTES.filter((x) => x.g === ag.g || (ag.g === "Bacterias" && x.g === "Hongos")).map((x) => x.a);
    const opts = opciones(ag.a, pool, NOPC[k]);
    return { caso: ag.c, q: "¿Qué es?", options: opts, answer: opts.indexOf(ag.a), hint: "Producción: " + ag.e, ficha: ag };
  });
}

function paresItems() {
  return shuffle(PARES).map(([a, b, dif]) => {
    const target = Math.random() < 0.5 ? a : b;
    const opts = [a, b];
    return { caso: agente(target).c, q: "¿Cuál de los dos es?", options: opts, answer: opts.indexOf(target), hint: "Fíjate en: " + agente(target).k, why: dif, ficha: agente(target) };
  });
}

function runQuiz(title, items, base, opt = {}) {
  const onExit = opt.onExit || showMicroMenu;
  const onAgain = opt.onAgain || showMicroMenu;
  let idx = 0, aciertos = 0;
  const next = () => {
    const p = openPanel();
    if (idx >= items.length) {
      if (opt.onEnd) opt.onEnd();
      p.append(mk("h2", null, title + ": " + aciertos + " de " + items.length));
      p.append(mk("p", "note", aciertos === items.length ? "Ronda perfecta." : "Otra ronda trae preguntas distintas, empezando por las que aún no dominas."));
      const row = mk("div", "row");
      const again = mk("button", "primary", "Otra ronda");
      again.onclick = onAgain;
      const home = mk("button", "ghost", "Volver al tablero"); home.onclick = showHome;
      row.append(again, home); p.append(row);
      return;
    }
    const it = items[idx];
    if (it.flujo) {
      jugarItemFlujo(p, title, idx, items.length, it, base, (ok) => { if (ok) aciertos += 1; }, () => { idx += 1; next(); }, onExit);
      return;
    }
    let hintUsed = false;
    p.append(mk("h2", null, title));
    p.append(mk("p", "note", (idx + 1) + " de " + items.length));
    if (it.img) {
      const ph = mk("div", "photo"); const im = mk("img"); im.src = it.img; im.alt = "Foto de microscopio"; ph.append(im); p.append(ph);
    }
    if (it.caso) p.append(mk("p", "case", it.caso));
    p.append(mk("p", null, it.q));
    const hint = mk("p", "hint", it.hint); hint.hidden = true;
    const opts = mk("div", "opts");
    const fb = mk("p", "feedback");
    const extra = mk("div");
    const row = mk("div", "row");
    const hintMode = opt.hint || "half";
    const hb = mk("button", "ghost", hintMode === "free" ? "Ver pista" : "Pista (la mitad de puntos)");
    hb.hidden = hintMode === "none" || !it.hint;
    hb.onclick = () => { if (hintMode !== "free") hintUsed = true; hint.hidden = false; hb.disabled = true; };
    const nb = mk("button", "primary", "Siguiente"); nb.hidden = true;
    nb.onclick = () => { idx += 1; next(); };
    const ex = mk("button", "ghost", "Salir"); ex.onclick = onExit;
    row.append(hb, nb, ex);
    it.options.forEach((text, i) => {
      const b = mk("button", null, text);
      b.onclick = () => {
        opts.querySelectorAll("button").forEach((x) => x.disabled = true);
        hb.disabled = true;
        if (i === it.answer) {
          b.classList.add("right");
          const pts = hintUsed ? base / 2 : base;
          state.score += pts; state.streak += 1; aciertos += 1;
          const sid = it.st || opt.station;
          if (sid && it.key != null) {
            (state.mastered[sid] = state.mastered[sid] || {})[it.key] = true;
            if (state.errores && state.errores[sid]) delete state.errores[sid][it.key];
          }
          fb.className = "feedback ok"; fb.textContent = "Correcto. +" + pts + " puntos";
        } else {
          b.classList.add("wrong");
          opts.children[it.answer].classList.add("right");
          state.streak = 0;
          const sidE = it.st || opt.station;
          if (sidE && it.key != null) { state.errores = state.errores || {}; const e = (state.errores[sidE] = state.errores[sidE] || {}); e[it.key] = (e[it.key] || 0) + 1; }
          fb.className = "feedback no"; fb.textContent = "Era " + it.options[it.answer] + ".";
        }
        if (it.why) extra.append(mk("p", "why", it.why));
        const f = it.ficha;
        if (f) {
          const dl = mk("dl", "ficha");
          [["Qué es", f.a], ["Criterio", f.c], ["Produce", f.e], ["Tratamiento", f.t]].forEach(([k, v]) => { dl.append(mk("dt", null, k), mk("dd", null, v)); });
          extra.append(dl);
        }
        saveState();
        nb.hidden = false;
        renderStats();
      };
      opts.append(b);
    });
    p.append(hint, opts, fb, extra, row);
  };
  next();
}

function miNombre() { return session.name || "Tu cuenta"; }
const COMMENTS = {
  canPost: () => session.mode === "cuenta" && !!session.db && !!session.id,
  whyNot: () => session.mode === "cuenta" ? "Los comentarios no están disponibles en este momento." : "Entra con tu cuenta para comentar. Como invitado puedes leer.",
  async count() {
    if (!session.db) return null;
    const s = await session.db.collection("comentarios").get();
    return s.docs.reduce((n, d) => n + (((d.data() || {}).msgs) || []).length, 0);
  },
  subscribe(cb) {
    if (!session.db) { cb([]); return () => {}; }
    let owner = false;
    if (session.user) session.user.isOwner().then((v) => { owner = v; });
    return session.db.collection("comentarios").onSnapshot(async (snap) => {
      const items = [];
      snap.docs.forEach((d) => (((d.data() || {}).msgs) || []).forEach((m) => items.push({ id: d.id + ":" + m.id, uid: d.id, mid: m.id, texto: String(m.txt || ""), t: m.t || 0 })));
      const ids = [...new Set(items.map((i) => i.uid))];
      const ps = ids.length && session.user ? await session.user.profiles(ids) : {};
      items.forEach((i) => { i.autor = (ps[i.uid] || {}).name || "Alumno"; i.mine = i.uid === session.id; i.canDelete = i.mine || owner; });
      items.sort((a, b) => b.t - a.t);
      cb(items);
    }, () => cb(null));
  },
  async post(texto) {
    const ref = session.db.doc("comentarios/" + session.id);
    const s = await ref.get();
    const msgs = (s.exists && ((s.data() || {}).msgs)) || [];
    const nuevo = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: Date.now(), txt: texto };
    await ref.set({ msgs: [...msgs, nuevo].slice(-50) });
  },
  async remove(item) {
    const ref = session.db.doc("comentarios/" + item.uid);
    const s = await ref.get();
    if (!s.exists) return;
    await ref.set({ msgs: (((s.data() || {}).msgs) || []).filter((m) => m.id !== item.mid) });
  }
};

function indiceBusqueda() {
  const idx = [];
  [...STATIONS, CASOS].forEach((st) => idx.push({ tipo: "Resumen", titulo: st.name, texto: st.study }));
  AGENTES.forEach((a) => idx.push({ tipo: "Ficha de microscopio", titulo: a.a, texto: "Criterio: " + a.c + "\nProduce: " + a.e + "\nTratamiento: " + a.t }));
  TABLAS.forEach((tb) => tb.rows.forEach((r) => idx.push({ tipo: tb.t, titulo: r[0], texto: r.slice(1).join(" · ") })));
  PARES.forEach(([a, b, d]) => idx.push({ tipo: "No confundir", titulo: a + " vs " + b, texto: d }));
  todasLasPreguntas().forEach(({ st, q }) => idx.push({ tipo: "Pregunta · " + st.name, titulo: (q.c ? q.c + " " : "") + (q.q || "¿Diagnóstico?"), texto: "Respuesta: " + q.ok + (q.y ? "\n" + q.y : "") }));
  return idx;
}
const sinTildes = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function runFlash(lista, titulo) {
  let cola = shuffle(lista).slice(0, 30);
  const total = cola.length;
  let sabidas = 0, repaso = 0;
  const next = () => {
    const p = openPanel(); setCrumb("Estudiar");
    const back = mk("button", "ghost back", "← Tarjetas"); back.onclick = showFlashSetup;
    p.append(back);
    if (!cola.length) {
      p.append(mk("h2", null, "¡Terminaste!"), mk("p", "note", "Sabías " + sabidas + " de " + total + " a la primera. Marcaste " + repaso + " para repasar."));
      const again = mk("button", "primary", "Otra tanda"); again.onclick = () => runFlash(lista, titulo);
      p.append(again);
      return;
    }
    const it = cola[0];
    p.append(mk("p", "note", titulo + " · quedan " + cola.length));
    const card = mk("div", "flash");
    card.append(mk("small", null, it.st.name + " · " + (NOMBRE_NIVEL[it.q.n] || "")));
    if (it.q.c) card.append(mk("p", "case", it.q.c));
    card.append(mk("p", "fq", it.q.q || "¿Cuál es el diagnóstico más probable?"));
    const backSide = mk("div", "fback"); backSide.hidden = true;
    backSide.append(mk("p", "fa", it.q.ok));
    if (it.q.y) backSide.append(mk("p", "why", it.q.y));
    card.append(backSide);
    const row = mk("div", "row");
    const ver = mk("button", "primary", "Ver respuesta");
    const no = mk("button", "ghost", "Repasar"); no.hidden = true;
    const si = mk("button", "primary", "Lo sabía"); si.hidden = true;
    ver.onclick = () => { backSide.hidden = false; ver.hidden = true; no.hidden = false; si.hidden = false; si.focus(); };
    card.onclick = (e) => { if (e.target === card || e.target.closest(".fq, .case")) ver.click(); };
    si.onclick = () => { cola.shift(); if (!it._r) sabidas++; next(); };
    no.onclick = () => { cola.shift(); if (!it._r) repaso++; it._r = true; cola.splice(Math.min(3, cola.length), 0, it); next(); };
    row.append(ver, no, si);
    p.append(card, row);
  };
  next();
}

function cuantos(q, idx) {
  // Cada término es una frase; "A|B" cuenta lo que mencione A o B.
  const alts = q.split("|").map(sinTildes);
  return idx.filter((it) => { const h = sinTildes(it.titulo + " " + it.texto); return alts.some((a) => h.includes(a)); }).length;
}

   ["Estudio", "Buscador, tarjetas de repaso, tus errores, tablas clave y una ficha de cada agente.", showStudyHub],
   ["Comentarios", "Dudas, avisos y sugerencias entre compañeros.", showComments]].forEach(([t, d, fn]) => {
    const b = mk("button", "intro-item"); b.type = "button";
    b.append(mk("strong", null, t), mk("span", null, d));
    b.onclick = fn;
    items.append(b);
  });
  intro.append(items);
  p.append(intro);
  p.append(mk("p", "note", "El curso se divide en cuatro grandes grupos. Elige uno para ver qué agentes se estudian y practicarlos."));
  const idx = indiceBusqueda();
  const grid = mk("div", "reinos");
  REINOS.forEach((r) => {
    const st = STATIONS.find((s) => s.name === r.n);
    const grupos = agentesDe(r.n, idx);
    const agentes = grupos.flatMap((g) => g[1]);
    const total = st ? st.bank.length : 0, dom = st ? doneCount(st) : 0;
    const card = mk("article", "reino " + r.k);
    const h = mk("h3", null, r.n);
    card.append(h, mk("p", "rdesc", r.d));
    const chips = mk("div", "rchips");
    agentes.slice(0, 7).forEach(([n]) => { const c = mk("button", "rchip", n); c.onclick = () => abrirAgente(n, showInicio); chips.append(c); });
    if (agentes.length > 7) { const m = mk("button", "rchip more", "+" + (agentes.length - 7) + " más"); m.onclick = () => showReino(r.n); chips.append(m); }
    card.append(chips);
    const bar = mk("div", "bar"); const fill = mk("span"); fill.style.width = total ? (100 * dom / total) + "%" : "0%"; bar.append(fill);
    card.append(bar, mk("small", "rstat", agentes.length + " agentes · " + total + " preguntas · " + dom + " dominadas"));
    const row = mk("div", "row");
    const ver = mk("button", "ghost", "Ver todo"); ver.onclick = () => showReino(r.n);
    const jug = mk("button", "primary", "Practicar"); jug.onclick = () => pickLevel(st.id);
    row.append(ver, jug);
    card.append(row);
    grid.append(card);
  });
  p.append(grid);
}
function showReino(nombre) {
  const p = openPanel(); setCrumb("Inicio");
  const back = mk("button", "ghost back", "← Inicio"); back.onclick = showInicio;
  const r = REINOS.find((x) => x.n === nombre) || {};
  const st = STATIONS.find((s) => s.name === nombre);
  p.append(back, mk("h2", null, nombre), mk("p", "note", r.d || ""));
  const row = mk("div", "row");
  const jug = mk("button", "primary", "Practicar " + nombre.toLowerCase()); jug.onclick = () => pickLevel(st.id);
  const tar = mk("button", "ghost", "Tarjetas de repaso"); tar.onclick = () => runFlash(st.bank.map((q, i) => ({ st, q, i })), nombre);
  row.append(jug, tar);
  if (nombre === "Virus") { const fe = mk("button", "ghost", "Flujograma evaluado"); fe.onclick = () => elegirModoFlujo(null, () => showReino(nombre)); const fs = mk("button", "ghost", "Flujogramas resueltos"); fs.onclick = () => showFlujoSoluciones(() => showReino(nombre)); row.append(fe, fs); }
  p.append(row);
  const res = mk("details", "topic"); res.append(mk("summary", null, "Resumen del tema"), mk("p", "study", st.study));
  p.append(res);
  p.append(mk("p", "note", "Toca un agente para ver su ficha completa: qué es, cómo se reconoce, qué produce, tratamiento y preguntas."));
  agentesDe(nombre, indiceBusqueda()).forEach(([g, items]) => {
    p.append(mk("h4", "grp-title", g));
    const ul = mk("div", "idx-items");
    items.forEach(([n, q, c]) => {
      const b = mk("button", "idx-item");
      b.append(mk("span", null, n), mk("b", null, String(c)));
      b.onclick = () => abrirAgente(n, () => showReino(nombre));
      ul.append(b);
    });
    p.append(ul);
  });
}

const SECCIONES_PERFIL = [["q", "Qué es"], ["r", "Cómo se reconoce"], ["p", "Qué produce"], ["c", "Cómo se contagia"], ["d", "Diagnóstico"], ["t", "Tratamiento"], ["x", "Dato de examen"]];
function consultaDe(nombre) {
  for (const sec of INDICE) for (const [, items] of sec.grupos) for (const [n, q] of items) if (n === nombre) return q;
  return nombre;
}
function abrirAgente(nombre, volver) { if (PERFILES[nombre]) showAgente(nombre, volver); else showSearch(consultaDe(nombre).split("|")[0]); }
function preguntasDe(nombre) {
  const alts = consultaDe(nombre).split("|").map(sinTildes);
  return todasLasPreguntas().filter(({ q }) => { const h = sinTildes((q.c || "") + " " + (q.q || "") + " " + q.ok + " " + (q.y || "")); return alts.some((a) => h.includes(a)); });
}
function showAgente(nombre, volver) {
  const p = openPanel(); setCrumb("Estudiar");
  const pf = PERFILES[nombre];
  const back = mk("button", "ghost back", "← Volver"); back.onclick = volver || showStudyHub;
  let reino = "";
  INDICE.forEach((sec) => sec.grupos.forEach(([g, items]) => { if (items.some(([n]) => n === nombre)) reino = sec.t + " · " + g; }));
  p.append(back, mk("small", "ag-kicker", reino), mk("h2", "ag-name", nombre));
  const ficha = pf.f ? agente(pf.f) : null;
  const fotos = pf.f ? fotosDe(pf.f) : [];
  if (fotos.length) {
    const strip = mk("div", "strip");
    fotos.forEach((f) => { const b = mk("button", "thumb"); b.setAttribute("aria-label", "Ver foto"); const im = mk("img"); im.src = f.img; im.alt = ""; im.loading = "lazy"; b.append(im); b.onclick = () => verFoto(f.img, nombre); strip.append(b); });
    p.append(strip, mk("p", "note", "Fotos del laboratorio de Mafer."));
  }
  const body = mk("div", "ag-body");
  SECCIONES_PERFIL.forEach(([k, t]) => {
    let v = pf[k];
    if (k === "r" && ficha && !v) v = ficha.c;
    if (!v) return;
    const s = mk("section", "ag-sec " + k);
    s.append(mk("h3", null, t), mk("p", null, v));
    body.append(s);
  });
  p.append(body);
  const pares = pf.f ? PARES.filter((x) => x[0] === pf.f || x[1] === pf.f) : [];
  if (pares.length) {
    const s = mk("section", "ag-sec conf");
    s.append(mk("h3", null, "No confundir"));
    pares.forEach(([a, b, d]) => { const otro = a === pf.f ? b : a; s.append(mk("p", null, "Con " + otro + ": " + d)); });
    p.append(s);
  }
  const preg = preguntasDe(nombre);
  const row = mk("div", "row");
  if (preg.length) {
    const prac = mk("button", "primary", "Practicar solo " + nombre + " (" + Math.min(preg.length, 10) + ")");
    prac.onclick = () => go(() => runQuiz(nombre, shuffle(preg).slice(0, 10).map(({ st, q, i }) => Object.assign(toItem(q, i), { st: st.id })), 10, { onExit: () => showAgente(nombre, volver), onAgain: () => showAgente(nombre, volver) }), "casos");
    const ver = mk("button", "ghost", "Ver sus " + preg.length + " preguntas con respuesta");
    ver.onclick = () => showSearch(consultaDe(nombre).split("|")[0]);
    row.append(prac, ver);
  }
  p.append(row);
}

function hace(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "hace un momento";
  if (s < 3600) return "hace " + Math.floor(s / 60) + " min";
  if (s < 86400) return "hace " + Math.floor(s / 3600) + " h";
  const d = Math.floor(s / 86400);
  return d === 1 ? "ayer" : "hace " + d + " días";
}

// SUGERENCIAS: formulario "¿Cómo mejoramos UsiLab?". Cada persona guarda sus envíos en sugerencias/<su id>;
// solo el dueño de la página los lee todos (reglas del db).
const SUG_TEMAS = ["Preguntas", "Dificultad", "Microscopio", "Ahorcado", "Casos clínicos", "Zona de estudio", "Diseño", "Velocidad", "Otro"];
const SUG_MAX = 600;
const SUGERENCIAS = {
  puede: () => !!session.db && !!session.id,
  async enviar(envio) {
    const ref = session.db.doc("sugerencias/" + session.id);
    const s = await ref.get();
    const previos = (s.exists && ((s.data() || {}).envios)) || [];
    await ref.set({ envios: [...previos, envio].slice(-20) });
  },
  async todas() {
    const snap = await session.db.collection("sugerencias").get();
    const out = [];
    snap.docs.forEach((d) => (((d.data() || {}).envios) || []).forEach((e) => out.push(Object.assign({ uid: d.id }, e))));
    const ids = [...new Set(out.map((e) => e.uid))];
    let ps = {};
    try { ps = ids.length && session.user ? await session.user.profiles(ids) : {}; } catch (e) { ps = {}; }
    out.forEach((e) => { e.autor = (ps[e.uid] || {}).name || "Alumno"; });
    return out.sort((a, b) => (b.t || 0) - (a.t || 0));
  }
};

function formSugerencias(p) {
  const box = mk("section", "sug");
  box.append(mk("h3", null, "¿Cómo mejoramos UsiLab?"), mk("p", "note", "Tu opinión nos ayuda a decidir qué cambiar. Solo la leen quienes hacen la página. Toma un minuto."));
  if (!SUGERENCIAS.puede()) {
    box.append(mk("p", "note", "Abre la página con tu cuenta de Claude para poder enviar sugerencias."));
    p.append(box);
    return;
  }
  const f = mk("form", "sug-form"); f.noValidate = true;
  // 1. Utilidad
  let nota = 0;
  const q1 = mk("fieldset", "sug-q"); q1.append(mk("legend", null, "¿Qué tan útil te parece para estudiar?"));
  const estrellas = mk("div", "sug-rate"); estrellas.setAttribute("role", "radiogroup"); estrellas.setAttribute("aria-label", "Utilidad del 1 al 5");
  const etiquetas = ["Nada útil", "Poco útil", "Más o menos", "Útil", "Muy útil"];
  const leyenda = mk("small", "note", "Toca un número");
  for (let i = 1; i <= 5; i++) {
    const b = mk("button", "sug-n", String(i)); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false"); b.setAttribute("aria-label", i + ": " + etiquetas[i - 1]);
    b.onclick = () => { nota = i; estrellas.querySelectorAll(".sug-n").forEach((x, k) => { x.classList.toggle("on", k < i); x.setAttribute("aria-checked", String(k + 1 === i)); }); leyenda.textContent = etiquetas[i - 1]; };
    estrellas.append(b);
  }
  q1.append(estrellas, leyenda);
  // 2. Qué mejorar
  const temas = new Set();
  const q2 = mk("fieldset", "sug-q"); q2.append(mk("legend", null, "¿Qué parte deberíamos mejorar? Puedes marcar varias."));
  const chips = mk("div", "chips");
  SUG_TEMAS.forEach((t) => {
    const b = mk("button", "chip", t); b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.onclick = () => { if (temas.has(t)) temas.delete(t); else temas.add(t); b.classList.toggle("on", temas.has(t)); b.setAttribute("aria-pressed", String(temas.has(t))); };
    chips.append(b);
  });
  q2.append(chips);
  // 3 y 4. Texto libre
  const area = (id, label, ph) => {
    const l = mk("label", "field"); l.append(mk("span", null, label));
    const ta = mk("textarea"); ta.id = id; ta.rows = 3; ta.maxLength = SUG_MAX; ta.placeholder = ph;
    l.append(ta); return [l, ta];
  };
  const [l3, ta3] = area("sug-mejora", "¿Qué cambiarías o agregarías?", "Por ejemplo: más casos clínicos de parásitos, un modo examen con tiempo…");
  const [l4, ta4] = area("sug-falla", "¿Algo no funcionó o fue confuso? (opcional)", "Qué pasó y en qué parte de la página");
  const msg = mk("p", "msg"); msg.setAttribute("role", "status");
  const send = mk("button", "primary", "Enviar sugerencia"); send.type = "submit";
  f.append(q1, q2, l3, l4, send, msg);
  const limpiar = () => { if (msg.classList.contains("no")) { msg.textContent = ""; msg.className = "msg"; } };
  f.addEventListener("input", limpiar); f.addEventListener("click", (e) => { if (e.target !== send) limpiar(); });
  f.onsubmit = async (e) => {
    e.preventDefault();
    if (send.disabled) return;
    const mejora = ta3.value.trim(), falla = ta4.value.trim();
    if (!nota && !temas.size && !mejora && !falla) { msg.className = "msg no"; msg.textContent = "Responde al menos una pregunta antes de enviar."; return; }
    send.disabled = true; msg.className = "msg ok"; msg.textContent = "Enviando…";
    try {
      await SUGERENCIAS.enviar({ t: Date.now(), nota, temas: [...temas], mejora: mejora.slice(0, SUG_MAX), falla: falla.slice(0, SUG_MAX) });
      box.replaceChildren(mk("h3", null, "¡Gracias!"), mk("p", "note", "Recibimos tu sugerencia. La vamos a revisar para la próxima versión."));
      const otra = mk("button", "ghost", "Enviar otra"); otra.type = "button"; otra.onclick = () => showComments();
      box.append(otra);
    } catch (err) {
      console.error("[reto] sugerencia", err);
      msg.className = "msg no";
      msg.textContent = err && err.code === "invalid_argument" ? "Tu acceso a la página no permite enviar sugerencias. Pide acceso de colaborador." : "No se pudo enviar. Revisa tu conexión e inténtalo otra vez; lo que escribiste sigue aquí.";
    }
    send.disabled = false;
  };
  box.append(f);
  p.append(box);
}

async function bandejaSugerencias(p) {
  if (!session.user || !session.db) return;
  let owner = false;
  try { owner = await session.user.isOwner(); } catch (e) { owner = false; }
  if (!owner) return;
  const d = mk("details", "topic sug-inbox");
  const sum = mk("summary", null, "Sugerencias recibidas (solo tú las ves)");
  const cuerpo = mk("div", "results"); cuerpo.append(mk("p", "note", "Cargando…"));
  d.append(sum, cuerpo);
  p.insertBefore(d, p.querySelector(".sug") || null);
  try {
    const lista = await SUGERENCIAS.todas();
    sum.textContent = "Sugerencias recibidas: " + lista.length + " (solo tú las ves)";
    cuerpo.replaceChildren();
    if (!lista.length) { cuerpo.append(mk("p", "note", "Todavía no hay sugerencias.")); return; }
    const notas = lista.filter((e) => e.nota);
    if (notas.length) cuerpo.append(mk("p", "fa", "Utilidad promedio: " + (notas.reduce((n, e) => n + e.nota, 0) / notas.length).toFixed(1) + " de 5 (" + notas.length + " votos)"));
    lista.forEach((e) => {
      const c = mk("div", "result");
      c.append(mk("small", null, e.autor + " · " + hace(e.t || Date.now()) + (e.nota ? " · utilidad " + e.nota + "/5" : "")));
      if (e.temas && e.temas.length) c.append(mk("strong", null, "Mejorar: " + e.temas.join(", ")));
      if (e.mejora) c.append(mk("p", "study", e.mejora));
      if (e.falla) c.append(mk("p", "why", "No funcionó: " + e.falla));
      cuerpo.append(c);
    });
  } catch (err) {
    console.error("[reto] bandeja", err);
    cuerpo.replaceChildren(mk("p", "note", "No se pudieron cargar las sugerencias."));
  }
}

function showComments() {
  stopComments();
  const p = openPanel(); setCrumb("Comentarios");
  p.append(mk("h2", null, "Comentarios"));
  try { formSugerencias(p); bandejaSugerencias(p); } catch (e) { console.error("[reto] sugerencias", e); }
  p.append(mk("h3", "sug-sep", "Muro de comentarios"));
  if (COMMENTS.canPost()) {
    const f = mk("form", "comment-form");
    const ta = mk("textarea"); ta.id = "c-text"; ta.maxLength = 500; ta.rows = 3;
    ta.placeholder = "Escribe tu duda, aviso o sugerencia…";
    ta.setAttribute("aria-label", "Tu comentario");
    const row = mk("div", "row");
    const cnt = mk("span", "note", "0 / 500");
    const send = mk("button", "primary", "Publicar"); send.type = "submit";
    const msg = mk("p", "msg");
    ta.oninput = () => { cnt.textContent = ta.value.length + " / 500"; };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const texto = ta.value.trim();
      if (!texto) { msg.className = "msg no"; msg.textContent = "Escribe algo antes de publicar."; return; }
      send.disabled = true; msg.textContent = "";
      try { await COMMENTS.post(texto); ta.value = ""; cnt.textContent = "0 / 500"; msg.className = "msg ok"; msg.textContent = "Publicado."; }
      catch (err) { msg.className = "msg no"; msg.textContent = "No se pudo publicar. Revisa tu conexión e inténtalo otra vez."; }
      send.disabled = false;
    };
    row.append(send, cnt);
    f.append(ta, row, msg);
    p.append(f);
  } else {
    p.append(mk("p", "note", COMMENTS.whyNot()));
  }
  const list = mk("ol", "comments"); list.append(mk("li", "empty", "Cargando…"));
  p.append(list);
  commentsUnsub = COMMENTS.subscribe((items) => {
    list.innerHTML = "";
    if (items) updateBadge(items.length);
    if (items === null) { list.append(mk("li", "empty", "No se pudieron cargar los comentarios.")); return; }
    if (!items.length) { list.append(mk("li", "empty", COMMENTS.canPost() ? "Todavía no hay comentarios. Escribe el primero." : "Todavía no hay comentarios para mostrar.")); return; }
    items.forEach((it) => {
      const li = mk("li", it.mine ? "mine" : "");
      const head = mk("div", "c-head");
      head.append(mk("strong", null, it.autor + (it.mine ? " (tú)" : "")), mk("small", null, hace(it.t)));
      const body = mk("p", "c-text", it.texto);
      li.append(head, body);
      if (it.canDelete) {
        const del = mk("button", "c-del", "Borrar");
        let armed = false;
        del.onclick = async () => {
          if (!armed) { armed = true; del.textContent = "¿Seguro? Toca otra vez para borrar"; setTimeout(() => { armed = false; del.textContent = "Borrar"; }, 4000); return; }
          del.disabled = true;
          try { await COMMENTS.remove(it); } catch (err) { del.disabled = false; del.textContent = "No se pudo borrar"; }
        };
        li.append(del);
      }
      list.append(li);
    });
  });
}

function go(fn, topic) {
  const loader = $("#loader");
  const pool = FACTS[topic] || Object.values(FACTS).flat();
  let f = pool[Math.floor(Math.random() * pool.length)];
  if (f === lastFact && pool.length > 1) f = pool[(pool.indexOf(f) + 1) % pool.length];
  lastFact = f;
  $("#fact").textContent = f;
  loader.hidden = false;
  let done = false;
  const finish = () => { if (done) return; done = true; loader.hidden = true; loader.onclick = null; fn(); };

  setTimeout(finish, 3200);
}

const FLUJO_TIPO = { ini: "Inicio", pro: "Paso", dec: "Decisión", fin: "Final" };

/** Dibuja el flujograma: inicio y final redondeados, decisiones en rombo, flechas con «Sí»/«No». */
function dibujarFlujoGrafico(id) {
  const nodos = FLUJO_GRAFICOS[id] || [];
  const nombres = Object.fromEntries(FLUJO_CRITERIOS);
  const fig = mk("figure", "fg");
  fig.setAttribute("role", "img");
  fig.setAttribute("aria-label", "Flujograma: " + nodos.map((n) => n[2]).join(" → "));
  const ley = mk("div", "fg-leyenda");
  FLUJO_ORDEN.forEach((k) => { const s = mk("span", "fg-ley fg-" + k); s.textContent = nombres[k]; ley.append(s); });
  fig.append(ley);
  nodos.forEach(([tipo, crit, texto, rama], i) => {
    const fila = mk("div", "fg-fila" + (tipo === "dec" ? " con-rama" : ""));
    const n = mk("div", "fg-nodo fg-" + tipo + " fg-" + crit);
    n.append(mk("small", null, nombres[crit] || ""), mk("span", null, texto));
    fila.append(n);
    if (tipo === "dec" && rama) {
      const r = mk("div", "fg-rama");
      r.append(mk("b", null, "No"), mk("span", "fg-rama-caja", rama));
      fila.append(r);
    }
    fig.append(fila);
    if (i < nodos.length - 1) {
      const fl = mk("div", "fg-flecha");
      if (tipo === "dec") fl.append(mk("b", null, "Sí"));
      fig.append(fl);
    }
  });
  return fig;
}

/** El mismo flujograma en texto, para que Claude corrija contra él. */
function flujoModeloTexto(id) {
  const nombres = Object.fromEntries(FLUJO_CRITERIOS);
  return (FLUJO_GRAFICOS[id] || []).map(([tipo, crit, texto, rama], i) =>
    (i + 1) + ". [" + FLUJO_TIPO[tipo] + " · " + nombres[crit] + "] " + texto + (tipo === "dec" ? "  → Sí: sigue al paso " + (i + 2) + (rama ? " · No: " + rama : "") : "")
  ).join("\n");
}

function itemFlujo(k, casoId) {

  return { flujo: true, nivel: k, nombre: FLUJO_NIVEL[k].nombre, c };
}

function pintarEvaluacion(box, c, r, k) {
  const N = FLUJO_NIVEL[k] || FLUJO_NIVEL.d;
  const nombres = Object.fromEntries(FLUJO_CRITERIOS);
  box.replaceChildren();
  if (!r || typeof r !== "object") throw { code: "invalid_json" };
  if (r.legible === false) {
    box.append(mk("p", "msg no", "No se pudo leer tu flujograma: " + (r.motivo_no_legible || "la foto no es clara.") + " Toma otra foto con más luz y que salga toda la hoja."));
    return null;
  }
  const lista = Array.isArray(r.criterios) ? r.criterios : [];
  const num = (x) => { const n = Math.round(Number(x)); return Number.isFinite(n) ? Math.min(FLUJO_ESCALA, Math.max(0, n)) : 0; };
  const items = N.criterios.map((key, i) => {
    const t = nombres[key];
    const e = lista.find((x) => x && sinTildes(String(x.criterio || "")).startsWith(sinTildes(t).slice(0, 6))) || lista[i] || {};
    return { key, t, puntaje: num(e.puntaje), estado: String(e.estado || "ausente"), escribiste: e.escribiste || "", fallo: e.fallo || "", correccion: e.correccion || "" };
  });
  const nota = Math.round(20 * items.reduce((n, x) => n + x.puntaje, 0) / (FLUJO_ESCALA * items.length));
  flujoGuardar(c.id + ":" + k, nota);
  const aprob = nota >= 11;
  const head = mk("div", "exam-nota " + (aprob ? "aprob" : "desaprob"));
  head.append(mk("small", null, "Corrección · " + NOMBRE_NIVEL[k]), mk("strong", null, nota + " / 20"), mk("span", null, aprob ? "Aprobado" : "Desaprobado"));
  box.append(head);
  if (r.resumen) box.append(mk("p", "fe-resumen", String(r.resumen)));
  const ilegibles = Array.isArray(r.ilegibles) ? r.ilegibles.filter(Boolean) : [];
  if (ilegibles.length) {
    const s = mk("section", "fe-ilegible");
    s.append(mk("h3", null, "Letra que no se entiende"), mk("p", null, "Estas partes contaron como no escritas y bajaron tu nota. En el examen tampoco se califica lo que no se lee: escribe más claro."));
    const ul = mk("ul"); ilegibles.forEach((t) => ul.append(mk("li", null, String(t)))); s.append(ul);
    box.append(s);
  }
  const errs = Array.isArray(r.errores_graves) ? r.errores_graves.filter(Boolean) : [];
  if (errs.length) { const s = mk("section", "ag-sec p"); s.append(mk("h3", null, "Errores graves")); errs.forEach((t) => s.append(mk("p", null, "• " + t))); box.append(s); }
  items.forEach((x) => {
    const card = mk("details", "fe-crit " + (x.estado === "ilegible" ? "ileg" : x.puntaje === FLUJO_ESCALA ? "ok" : x.puntaje >= 2 ? "medio" : "mal"));
    if (x.puntaje < FLUJO_ESCALA) card.open = true;
    const sum = mk("summary");
    sum.append(mk("span", null, x.t), mk("b", null, x.puntaje + " / " + FLUJO_ESCALA));
    card.append(sum, mk("small", "fe-estado", x.estado.charAt(0).toUpperCase() + x.estado.slice(1)));
    if (x.escribiste) card.append(mk("p", "fe-tuyo", "Escribiste: " + x.escribiste));
    if (x.fallo) card.append(mk("p", "fe-fallo", "En qué fallaste: " + x.fallo));
    if (x.correccion) card.append(mk("p", "fe-corr", "Cómo debería ser: " + x.correccion));
    const ref = mk("details", "fe-ref");
    ref.append(mk("summary", null, "Ver la clave de la clase"), mk("p", null, x.key === "logica" ? FLUJO_LOGICA : c.clave[x.key]));
    card.append(ref);
    box.append(card);
  });
  const fort = Array.isArray(r.fortalezas) ? r.fortalezas.filter(Boolean) : [];
  if (fort.length) { const s = mk("section", "ag-sec t"); s.append(mk("h3", null, "Lo que hiciste bien")); fort.forEach((t) => s.append(mk("p", null, "• " + t))); box.append(s); }
  if (r.siguiente_paso) { const s = mk("section", "ag-sec x"); s.append(mk("h3", null, "Para la próxima"), mk("p", null, String(r.siguiente_paso))); box.append(s); }
  const modelo = mk("details", "topic fe-modelo");
  modelo.append(mk("summary", null, "Ver el flujograma modelo"), dibujarFlujoGrafico(c.id));
  box.append(modelo);
  const verSol = mk("button", "ghost", "Ver la solución completa en Estudio"); verSol.type = "button"; verSol.onclick = () => showFlujoSolucion(c.id, () => showFlujoSoluciones());
  box.append(verSol, mk("p", "note", "La corrección la hace Claude con la clave de la clase; puede equivocarse al leer letra a mano. Si algo no te cuadra, compáralo con la clave."));
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  return nota;
}

function jugarItemFlujo(p, titulo, i, total, it, base, alResponder, alSeguir, alSalir) {
  const N = FLUJO_NIVEL[it.nivel];
  const c = it.c;
  const nombres = Object.fromEntries(FLUJO_CRITERIOS);
  p.append(mk("h2", null, titulo), mk("p", "note", (i + 1) + " de " + total + " · flujograma en papel"));
  p.append(mk("small", "ag-kicker", N.nombre + " · " + NOMBRE_NIVEL[it.nivel]), mk("p", "case", c.caso));
  if (N.revela) p.append(mk("p", "fj-revela", "Diagnóstico: " + nombreEnfermedad(c)));
  const pasos = mk("ol", "fe-pasos");
  const li1 = mk("li", null, "En papel, haz el flujograma con flechas. Se califica:");
  const inc = mk("div", "fe-criterios"); N.criterios.forEach((key) => inc.append(mk("span", "fe-chip", nombres[key]))); li1.append(inc);
  const li2 = mk("li", null, "Usa formas de flujograma: inicio y final en óvalo, pasos en rectángulo" + (it.nivel === "x" ? " y al menos una decisión en rombo con Sí y No." : ", decisiones en rombo."));
  const muestra = mk("div", "fg-muestra");
  [["fg-ini", "Inicio"], ["fg-pro", "Paso"], ["fg-dec", "¿Decisión?"], ["fg-fin", "Final"]].forEach(([k2, t]) => { const d = mk("span", "fg-nodo " + k2); d.append(mk("span", null, t)); muestra.append(d); });
  li2.append(muestra);
  pasos.append(li1, li2, mk("li", null, "Escribe con letra clara: lo que no se entienda cuenta como no escrito y baja tu nota."), mk("li", null, "Tómale una foto nítida y envíala. Se aprueba con 11 de 20."));
  const prev = mk("div", "fe-preview"); prev.hidden = true;
  const msg = mk("p", "msg"); msg.setAttribute("role", "status");
  const res = mk("div", "fe-resultado");
  const fb = mk("p", "feedback"); fb.setAttribute("role", "status");
  let archivo = null;
  const elegir = (capturar) => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    if (capturar) inp.setAttribute("capture", "environment");
    inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return; archivo = f; prev.replaceChildren(); const im = mk("img"); im.alt = "Tu flujograma"; im.src = URL.createObjectURL(f); prev.append(im); prev.hidden = false; enviar.disabled = false; msg.textContent = ""; msg.className = "msg"; };
    inp.click();
  };
  const foto = mk("button", "primary", "📷 Tomar foto"); foto.type = "button"; foto.onclick = () => elegir(true);
  const gal = mk("button", "ghost", "Galería"); gal.type = "button"; gal.onclick = () => elegir(false);
  const enviar = mk("button", "primary", "Enviar a corregir"); enviar.type = "button"; enviar.disabled = true;
  const filaFoto = mk("div", "row"); filaFoto.append(foto, gal);
  const row = mk("div", "row");
  const sig = mk("button", "primary", "Siguiente"); sig.hidden = true; sig.onclick = alSeguir;
  const saltar = mk("button", "ghost", "Saltar"); saltar.onclick = () => { alResponder(false); alSeguir(); };
  const salir = mk("button", "ghost", "Salir"); salir.onclick = alSalir;
  row.append(sig, saltar, salir);
  p.append(pasos, filaFoto, prev, enviar, msg, fb, res, row);
  const puntos = base * 2;

  usarSample().then((s) => s ? s.limits().catch(() => null) : null).then((lim) => {
    if (!lim || !lim.images) {
      filaFoto.hidden = true; enviar.hidden = true;
      msg.className = "msg no";
      msg.textContent = "Aquí no se pueden mandar fotos a Claude. Abre la página con tu cuenta de Claude para hacer esta pregunta, o toca «Saltar».";
    }
  }).catch(() => {});

  enviar.onclick = async () => {
    if (!archivo || enviar.disabled) return;
    enviar.disabled = true; foto.disabled = true; gal.disabled = true; saltar.disabled = true;
    msg.className = "msg ok"; msg.textContent = "Claude está revisando tu flujograma… puede tardar hasta un minuto.";
    try {
      const sample = await usarSample();
      if (!sample) throw { code: "not_granted" };
      const r = await sample.json(promptFlujo(c, it.nivel), { images: [await reducirImagen(archivo)], modelTier: "complex" });
      const nota = pintarEvaluacion(res, c, r, it.nivel);
      msg.textContent = ""; msg.className = "msg";
      if (nota == null) { enviar.disabled = false; foto.disabled = false; gal.disabled = false; saltar.disabled = false; return; }
      filaFoto.hidden = true; enviar.hidden = true; prev.hidden = true; saltar.hidden = true;
      const ok = nota >= 11;
      const pts = Math.round(puntos * nota / 20);
      state.score += pts; if (ok) state.streak += 1; else state.streak = 0;
      saveState(); renderStats();
      alResponder(ok);
      fb.className = "feedback " + (ok ? "ok" : "no");
      fb.textContent = "Tu flujograma: " + nota + "/20" + (pts ? " · +" + pts + " puntos" : "");
      sig.hidden = false;
    } catch (e) {
      console.error("[reto] flujograma", e);
      const code = e && e.code;
      msg.className = "msg no";
      msg.textContent =
        code === "not_granted" ? "Para corregir, permite que esta página use Claude (te lo pregunta al enviar). Si lo rechazaste, recarga la página." :
        code === "rate_limited" ? "Llegaste al límite de uso de Claude por ahora. Espera un rato o toca «Saltar»." :

const FLUJO_HISTORIAL = "reto-flujo-eval";
function flujoHistorial() { try { return JSON.parse(localStorage.getItem(FLUJO_HISTORIAL) || "{}") || {}; } catch (e) { return {}; } }
function flujoGuardar(id, nota) {
  try {
    const h = flujoHistorial();
    const prev = h[id] || { mejor: 0, intentos: 0 };
    h[id] = { mejor: Math.max(prev.mejor, nota), ultima: nota, intentos: prev.intentos + 1 };
    localStorage.setItem(FLUJO_HISTORIAL, JSON.stringify(h));
  } catch (e) { /* sin almacenamiento: no pasa nada */ }
}

function reducirImagen(file) {
  // Achica la foto a 1600 px de lado mayor (JPEG). Así sube rápido y se lee bien.
  return new Promise((resolve) => {
    try {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement("canvas");
          c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          c.toBlob((b) => resolve(b || file), "image/jpeg", 0.85);
        } catch (e) { resolve(file); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    } catch (e) { resolve(file); }
  });
}
