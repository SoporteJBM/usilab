ivo","No descarta: pedir ex\xE1menes seriados"],["Cu\xE1ndo pedir coprocultivo","Diarrea con fiebre o sangre/moco, diarrea > 7 d\xEDas, sospecha de tifoidea, brotes, portadores, inmunocomprometidos"],["Transporte","Cary-Blair si demora m\xE1s de 2 h; en lactantes vale el hisopo rectal"],["Siembra","MacConkey, XLD o SS, agar Campylobacter"],["Incubaci\xF3n","35\u201337 \xB0C por 24\u201348 h; Campylobacter hasta 72 h"],["Identificaci\xF3n","TSI, LIA, urea, citrato, oxidasa"],["Pat\xF3genos m\xE1s frecuentes en Per\xFA","Salmonella (Typhi, Paratyphi, Enteritidis), Shigella (sobre todo flexneri), Campylobacter jejuni, Yersinia, E. coli pat\xF3genas"]]},{id:"tratamientos",titulo:"Tratamiento de elecci\xF3n",columnas:["Cuadro","Tratamiento"],filas:[["Aspergilosis invasiva","Voriconazol"],["Aspergiloma","Cirug\xEDa; embolizaci\xF3n si la hemoptisis es masiva"],["ABPA","Corticoides sist\xE9micos e itraconazol"],["Otomicosis por A. niger","Limpieza del conducto y clotrimazol t\xF3pico"],["Queratitis por Fusarium","Natamicina t\xF3pica (alternativa: voriconazol)"],["Tinea capitis por Microsporum canis","Griseofulvina oral; revisar a la mascota"],["Onicomicosis por T. rubrum","Terbinafina oral por 12 semanas"],["Esporotricosis","Itraconazol 3\u20136 meses (alternativa: yoduro de potasio)"],["Paracoccidioidomicosis","Itraconazol; grave: anfotericina B"],["Histoplasmosis diseminada","Anfotericina B liposomal y luego itraconazol"],["Muguet","Nistatina oral en suspensi\xF3n"],["Candidemia","Equinocandina y retirar el cat\xE9ter"],["Fungemia por Rhodotorula","Retirar el cat\xE9ter y anfotericina B (resiste fluconazol y equinocandinas)"],["Mucormicosis","Anfotericina B liposomal, desbridamiento urgente y corregir la cetoacidosis"],["Candiduria","Retirar o cambiar la sonda; fluconazol si hay s\xEDntomas"],["Cistitis por E. coli","Nitrofuranto\xEDna o fosfomicina, seg\xFAn antibiograma"],["Infecci\xF3n por BLEE","Carbapen\xE9mico; en cistitis no complicada, fosfomicina"],["ITU por Proteus mirabilis","Ceftriaxona o ciprofloxacino seg\xFAn antibiograma; cambiar la sonda; no nitrofuranto\xEDna"],["Neumon\xEDa por Klebsiella","Ceftriaxona; si es BLEE, meropenem"],["Klebsiella KPC","Ceftazidima-avibactam o colistina"],["MRSA","Vancomicina"],["Tuberculosis sensible","HRZE 2 meses y HR 4 meses, supervisado"],["TB resistente a rifampicina","BPaLM: bedaquilina, pretomanid, linezolid y moxifloxacino"],["Tricomoniasis","Metronidazol a la paciente y a su pareja"],["VIH, primera l\xEDnea (MINSA)","TDF + 3TC + DTG (TLD), de por vida"],["VIH con tuberculosis","TDF + 3TC + EFV (menos interacci\xF3n con rifampicina)"],["VIH con falla renal","ABC + 3TC + DTG"],["Verrugas genitales por VPH","Imiquimod, podofilotoxina, \xE1cido tricloroac\xE9tico o crioterapia"]]},{id:"baltimore",titulo:"Clasificaci\xF3n de Baltimore",columnas:["Grupo","Genoma","Ejemplos"],filas:[["I","ADN doble cadena","Herpesvirus, adenovirus, VPH, poxvirus"],["II","ADN cadena simple (+)","Parvovirus"],["III","ARN doble cadena","Rotavirus (reovirus)"],["IV","ARN cadena simple (+): funciona como ARNm","Picornavirus, flavivirus (dengue, zika, VHC), coronavirus, togavirus"],["V","ARN cadena simple (\u2212): trae su polimerasa","Influenza, rabia, sarampi\xF3n, VSR"],["VI","ARN (+) con transcriptasa inversa","Retrovirus: VIH, HTLV"],["VII","ADN doble cadena con transcriptasa inversa","Hepatitis B"]]},{id:"vih-dx",titulo:"VIH: pruebas de diagn\xF3stico",columnas:["Prueba","Qu\xE9 detecta","Para qu\xE9"],filas:[["ELISA 3.\xAA generaci\xF3n","Solo anticuerpos (ventana 3\u20136 semanas)","Tamizaje, en desuso"],["ELISA 4.\xAA generaci\xF3n","Anticuerpos + ant\xEDgeno p24 (ventana 14\u201318 d\xEDas)","Tamizaje recomendado por OMS y MINSA"],["Prueba r\xE1pida","Anticuerpos y casi siempre p24; resultado en 15\u201330 min","Tamizaje en el punto de atenci\xF3n"],["5.\xAA generaci\xF3n","Anticuerpos VIH-1/VIH-2 + p24, informados por separado","Tamizaje con ventana de 11\u201315 d\xEDas"],["Western blot","Positivo: 2 bandas de envoltura (gp120/160 + gp41)","Confirmatoria; obsoleta en varios pa\xEDses"],["LIA","Prote\xEDnas recombinantes en l\xEDneas","Confirmatoria recomendada"],["RT-qPCR (carga viral)","ARN viral en plasma; indetectable < 20\u201350 copias/mL","Discordantes, neonatos y monitoreo del TARV"]]},{id:"co-test",titulo:"VPH: manejo del co-test",columnas:["Citolog\xEDa","VPH","Manejo"],filas:[["Normal","Negativo","Repetir co-test en 5 a\xF1os"],["Normal","Positivo (no 16/18)","Repetir en 12 meses o genotipificar"],["Normal","16/18 positivo","Colposcopia inmediata"],["ASC-US","Negativo","Repetir en 3 a\xF1os"],["ASC-US","Positivo","Colposcopia"],["HSIL","Positivo","Colposcopia y/o biopsia"]]}];var Ro=[{clave:"f",nombre:"F\xE1cil",descripcion:"Preguntas b\xE1sicas. La pista es gratis."},{clave:"m",nombre:"Medio",descripcion:"Preguntas m\xE1s complejas. La pista cuesta la mitad de los puntos."},{clave:"d",nombre:"Dif\xEDcil",descripcion:"Preguntas realmente dif\xEDciles. Sin pistas."},{clave:"x",nombre:"Muy dif\xEDcil",descripcion:"Razonamiento en varios pasos, mecanismos y trampas. Sin pistas."}],ma={f:5,m:10,d:20,x:40},Fa={f:"gratis",m:"mitad",d:"ninguna",x:"ninguna"},_={f:"F\xE1cil",m:"Medio",d:"Dif\xEDcil",x:"Muy dif\xEDcil"};var Qi=[{id:"hongos-muguet",tema:"Hongos",grupo:"Levaduras",titulo:"Candidiasis oral (muguet)",consigna:"Var\xF3n de 32 a\xF1os con VIH sin tratamiento. Desde hace una semana tiene ardor en la boca y placas blancas en la lengua y el paladar que se desprenden al rasparlas y dejan la base roja. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Candida albicans: levadura de la flora normal"},{texto:"\xBFHay inmunosupresi\xF3n (VIH, CD4 bajos), antibi\xF3ticos o corticoides?",decision:!0,rama:"No \u2192 sigue como flora, sin enfermedad"},{texto:"Prolifera y forma pseudohifas en la mucosa"},{texto:"Mucosa oral (orofaringe)"},{texto:"Placas blancas que se desprenden y dejan base roja; ardor"},{texto:"Candidiasis oral (muguet)"},{texto:"Examen directo: levaduras + pseudohifas \xB7 Sabouraud \xB7 tubo germinal +"},{texto:"Nistatina oral en suspensi\xF3n + tratar la causa (TARV)"},{texto:"Controlar la inmunosupresi\xF3n \xB7 Complicaci\xF3n: candidiasis esof\xE1gica (SIDA), diseminaci\xF3n"}],claves:["S\xEDntomas: Placas blancas en lengua, paladar y mucosa oral que se desprenden y dejan base roja; ardor o dolor al comer.","Zona afectada: Mucosa oral (orofaringe).","Enfermedad: Candidiasis oral (muguet) por Candida albicans, favorecida por la inmunosupresi\xF3n del VIH.","Patogenia: Candida albicans es una levadura de la flora normal. Con inmunosupresi\xF3n (VIH, CD4 bajos), antibi\xF3ticos o corticoides prolifera, forma pseudohifas y coloniza la mucosa formando las placas.","Diagn\xF3stico: Cl\xEDnico; examen directo (KOH o Gram): levaduras con pseudohifas. Cultivo en Sabouraud. Tubo germinal positivo a las 2\u20133 horas a 37 \xB0C; en agar harina de ma\xEDz, clamidoconidias (solo C. albicans).","Tratamiento: Nistatina oral en suspensi\xF3n; tratar la causa (iniciar TARV en el VIH).","Prevenci\xF3n y complicaciones: Controlar la inmunosupresi\xF3n (TARV), evitar antibi\xF3ticos o corticoides innecesarios. Complicaciones: candidiasis esof\xE1gica (definitoria de SIDA) y diseminaci\xF3n."],intrusos:["Tratar con equinocandina IV como primera opci\xF3n","Tubo germinal negativo: confirma C. albicans"]},{id:"hongos-candidemia",tema:"Hongos",grupo:"Levaduras",titulo:"Candidemia asociada a cat\xE9ter",consigna:"Mujer de 60 a\xF1os en UCI con cat\xE9ter venoso central desde hace 2 semanas, recibiendo antibi\xF3ticos de amplio espectro. Tiene fiebre que no baja con los antibi\xF3ticos. En el hemocultivo crecen levaduras. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Antibi\xF3ticos de amplio espectro + cat\xE9ter venoso central"},{texto:"Candida prolifera y coloniza el cat\xE9ter \u2192 pasa a la sangre"},{texto:"Sangre (fungemia) desde el cat\xE9ter"},{texto:"Fiebre que no baja con antibi\xF3ticos"},{texto:"Candidemia asociada a cat\xE9ter"},{texto:"Hemocultivo: levaduras \u2192 identificar la especie (tubo germinal, harina de ma\xEDz)"},{texto:"\xBFEs Candida?",decision:!0,rama:"Rhodotorula (rosada, tubo germinal \u2212) \u2192 retirar cat\xE9ter + anfotericina B"},{texto:"Equinocandina + retirar el cat\xE9ter"},{texto:"Retirar cat\xE9teres innecesarios, uso racional de antibi\xF3ticos \xB7 Complicaciones: siembra en \xF3rganos, shock"}],claves:["S\xEDntomas: Fiebre persistente que no responde a antibi\xF3ticos; puede haber hipotensi\xF3n o shock.","Zona afectada: Sangre (fungemia), a partir del cat\xE9ter venoso central; puede sembrar otros \xF3rganos.","Enfermedad: Candidemia asociada a cat\xE9ter (candidiasis invasiva).","Patogenia: Los antibi\xF3ticos de amplio espectro eliminan la flora bacteriana y Candida prolifera; el cat\xE9ter es la puerta de entrada y se cubre de levaduras, que pasan a la sangre.","Diagn\xF3stico: Hemocultivo con levaduras. Identificaci\xF3n: tubo germinal (positivo en C. albicans), agar harina de ma\xEDz (clamidoconidias). Importa la especie: C. glabrata tolera mal los azoles y C. krusei resiste el fluconazol.","Tratamiento: Equinocandina y retirar el cat\xE9ter.","Prevenci\xF3n y complicaciones: Retirar cat\xE9teres que no se usan, usar antibi\xF3ticos solo cuando hacen falta. Complicaciones: siembra en otros \xF3rganos, shock, muerte. Si la levadura es Rhodotorula, las equinocandinas no sirven (anfotericina B)."],intrusos:["Mantener el cat\xE9ter y tratar solo con nistatina oral","Contagio por inhalaci\xF3n de conidias del ambiente"]},{id:"hongos-aspergilosis",tema:"Hongos",grupo:"Mohos hialinos",titulo:"Aspergilosis pulmonar invasiva",consigna:"Paciente de 45 a\xF1os con leucemia, neutrop\xE9nico tras quimioterapia. Fiebre persistente, tos y dolor tor\xE1cico. La TAC muestra un n\xF3dulo pulmonar con signo del halo y el galactomanano es positivo. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Inhalaci\xF3n de conidios de Aspergillus fumigatus"},{texto:"\xBFEl paciente es neutrop\xE9nico?",decision:!0,rama:"No \u2192 los conidios se eliminan (en asm\xE1ticos: ABPA; en cavernas: aspergiloma)"},{texto:"Conidios germinan \u2192 hifas hialinas septadas que invaden el tejido"},{texto:"Pulm\xF3n"},{texto:"Fiebre persistente, tos, dolor tor\xE1cico"},{texto:"Aspergilosis pulmonar invasiva"},{texto:"TAC: signo del halo \xB7 galactomanano + \xB7 cultivo: cabeza aspergilar"},{texto:"Voriconazol"},{texto:"Proteger al neutrop\xE9nico de los conidios \xB7 Complicaciones: diseminaci\xF3n, hemoptisis"}],claves:["S\xEDntomas: Fiebre persistente pese a antibi\xF3ticos, tos, dolor tor\xE1cico (puede haber hemoptisis).","Zona afectada: Pulm\xF3n.","Enfermedad: Aspergilosis pulmonar invasiva por Aspergillus fumigatus.","Patogenia: Se inhalan los conidios del ambiente. En el neutrop\xE9nico no se eliminan: germinan en hifas hialinas septadas que invaden el tejido pulmonar.","Diagn\xF3stico: TAC con signo del halo; galactomanano positivo. Cultivo en Sabouraud: colonia blanca que se vuelve verde azulada; microscopio: hifas hialinas septadas con conidi\xF3foro, ves\xEDcula y fi\xE1lides uniseriadas (cabeza aspergilar). Crece hasta 50 \xB0C.","Tratamiento: Voriconazol.","Prevenci\xF3n y complicaciones: Proteger al neutrop\xE9nico de la exposici\xF3n a conidios. Complicaciones: diseminaci\xF3n, hemoptisis, muerte. La resistencia a azoles se asocia a mutaciones en cyp51A; A. terreus resiste la anfotericina B."],intrusos:["Tratar con fluconazol","Levaduras con c\xE1psula en tinta china"]},{id:"hongos-mucormicosis",tema:"Hongos",grupo:"Mucorales",titulo:"Mucormicosis rinocerebral",consigna:"Var\xF3n de 58 a\xF1os con diabetes mal controlada, ingresa en cetoacidosis. Tiene dolor facial, congesti\xF3n nasal, fiebre y una escara negra en el paladar. En los d\xEDas siguientes aparece edema periorbitario. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Inhalaci\xF3n de esporas de Rhizopus"},{texto:"Cetoacidosis libera hierro \u2192 el hongo crece"},{texto:"Hifas anchas no septadas invaden y necrosan el tejido"},{texto:"Senos paranasales y paladar \u2192 \xF3rbita \u2192 cerebro"},{texto:"Dolor facial, congesti\xF3n, fiebre, escara negra en el paladar"},{texto:"Mucormicosis rinocerebral"},{texto:"Biopsia/cultivo: hifas anchas no septadas, esporangios y rizoides"},{texto:"\xBFSon hifas anchas no septadas (mucoral)?",decision:!0,rama:"No \u2192 otro moho (p. ej. Aspergillus: voriconazol)"},{texto:"Anfotericina B liposomal + desbridamiento urgente + corregir cetoacidosis (el voriconazol no cubre mucorales)"},{texto:"Control de la diabetes \xB7 Complicaciones: invasi\xF3n de \xF3rbita y cerebro, muerte"}],claves:["S\xEDntomas: Dolor facial, congesti\xF3n nasal, fiebre, escara negra en paladar o cornetes; luego compromiso de la \xF3rbita y alteraci\xF3n neurol\xF3gica.","Zona afectada: Senos paranasales, paladar, \xF3rbita y cerebro (forma rinocerebral).","Enfermedad: Mucormicosis rinocerebral por Rhizopus (mucorales).","Patogenia: Se inhalan las esporas. La cetoacidosis libera hierro, que el hongo aprovecha (la deferoxamina tambi\xE9n le entrega hierro). Las hifas invaden y necrosan el tejido, por eso la escara negra.","Diagn\xF3stico: Biopsia o cultivo: hifas anchas no septadas en cinta, ramificadas en \xE1ngulo recto; en cultivo, colonia algodonosa blanca con puntos negros (esporangios) y rizoides. En la forma pulmonar, TAC con halo invertido.","Tratamiento: Anfotericina B liposomal + desbridamiento quir\xFArgico urgente + corregir la cetoacidosis.","Prevenci\xF3n y complicaciones: Control de la diabetes. El voriconazol no cubre mucorales. Complicaciones: invasi\xF3n de \xF3rbita y cerebro, muerte."],intrusos:["Hifas septadas que se ramifican en \xE1ngulo agudo","Tratar con voriconazol"]},{id:"hongos-queratitis-fusarium",tema:"Hongos",grupo:"Mohos hialinos",titulo:"Queratitis por Fusarium",consigna:"Agricultor de 40 a\xF1os que sufri\xF3 un golpe en el ojo con una rama hace 10 d\xEDas. Tiene dolor, ojo rojo y visi\xF3n borrosa. En la c\xF3rnea hay una \xFAlcera de bordes plumosos con hipopi\xF3n. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Trauma vegetal en el ojo (o lentes de contacto)"},{texto:"Inoculaci\xF3n de Fusarium \u2192 hifas invaden el estroma corneal"},{texto:"C\xF3rnea"},{texto:"Dolor, ojo rojo, visi\xF3n borrosa; \xFAlcera de bordes plumosos con hipopi\xF3n"},{texto:"Queratitis por Fusarium"},{texto:"Raspado corneal + Sabouraud: macroconidias en canoa, multiseptadas"},{texto:"Natamicina t\xF3pica (alternativa: voriconazol)"},{texto:"Protecci\xF3n ocular \xB7 Complicaciones: perforaci\xF3n, p\xE9rdida de visi\xF3n; diseminada en neutrop\xE9nicos"}],claves:["S\xEDntomas: Dolor ocular, ojo rojo, visi\xF3n borrosa; \xFAlcera corneal de bordes plumosos con hipopi\xF3n.","Zona afectada: C\xF3rnea (ojo).","Enfermedad: Queratitis f\xFAngica por Fusarium.","Patogenia: Trauma vegetal (o lentes de contacto) que inocula el hongo del ambiente en la c\xF3rnea; las hifas hialinas septadas invaden el estroma.","Diagn\xF3stico: Raspado corneal: hifas hialinas septadas. Cultivo en Sabouraud: crecimiento r\xE1pido, colonia algodonosa blanca, rosada o p\xFArpura; microscopio: macroconidias en canoa o media luna, multiseptadas, de pared delgada y lisa.","Tratamiento: Natamicina t\xF3pica (alternativa: voriconazol).","Prevenci\xF3n y complicaciones: Protecci\xF3n ocular en el campo, higiene de lentes de contacto. Complicaciones: perforaci\xF3n corneal, p\xE9rdida de visi\xF3n; en neutrop\xE9nicos, fusariosis diseminada (voriconazol con o sin anfotericina B)."],intrusos:["Tratar solo con corticoides t\xF3picos","Levaduras con pseudohifas en el raspado corneal"]},{id:"hongos-tinea-capitis",tema:"Hongos",grupo:"Dermatofitos",titulo:"Tinea capitis por Microsporum canis",consigna:"Ni\xF1o de 7 a\xF1os que tiene un gato. Desde hace un mes tiene placas redondas sin pelo en el cuero cabelludo, con descamaci\xF3n y picaz\xF3n. Con la l\xE1mpara de Wood las placas brillan. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Contacto con gato o perro infectado"},{texto:"Microsporum canis (zoof\xEDlico) invade el pelo: se alimenta de queratina"},{texto:"Cuero cabelludo y pelo"},{texto:"Placas sin pelo, con descamaci\xF3n y picaz\xF3n"},{texto:"Tinea capitis por Microsporum canis"},{texto:"L\xE1mpara de Wood + \xB7 KOH \xB7 Sabouraud: macroconidios en huso, pared gruesa y rugosa"},{texto:"\xBFCompromete el pelo?",decision:!0,rama:"No (solo piel) \u2192 puede bastar un antif\xFAngico t\xF3pico"},{texto:"Griseofulvina oral (el t\xF3pico no basta) + revisar a la mascota"},{texto:"Tratar a la mascota, no compartir peines \xB7 Complicaci\xF3n: querion (no drenarlo)"}],claves:["S\xEDntomas: Placas de alopecia redondas con descamaci\xF3n y prurito; si se inflama mucho, querion.","Zona afectada: Cuero cabelludo y pelo (piel queratinizada).","Enfermedad: Tinea capitis por Microsporum canis (dermatofito zoof\xEDlico).","Patogenia: Contagio desde el gato o perro (zoof\xEDlico). El dermatofito se alimenta de queratina e invade el pelo y la capa c\xF3rnea.","Diagn\xF3stico: L\xE1mpara de Wood positiva; examen directo con KOH del pelo; cultivo en Sabouraud: macroconidios en huso de pared gruesa y rugosa, con muchos tabiques.","Tratamiento: Griseofulvina oral (no basta el t\xF3pico en el cuero cabelludo); revisar y tratar a la mascota.","Prevenci\xF3n y complicaciones: Tratar a la mascota, no compartir peines ni gorras. Complicaci\xF3n: querion, que no se trata solo con t\xF3pico ni se drena como absceso; alopecia cicatricial."],intrusos:["Tratar solo con crema t\xF3pica","Contagio por inhalaci\xF3n de esporas de murci\xE9lagos"]},{id:"hongos-onicomicosis",tema:"Hongos",grupo:"Dermatofitos",titulo:"Onicomicosis + tinea pedis por T. rubrum",consigna:"Mujer de 50 a\xF1os con pie de atleta cr\xF3nico. Las u\xF1as del dedo gordo de ambos pies est\xE1n engrosadas, amarillentas y se desmoronan. Usa calzado cerrado todo el d\xEDa. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Contagio en pisos h\xFAmedos (duchas, piscinas)"},{texto:"Trichophyton rubrum invade la queratina (humedad + calzado cerrado)"},{texto:"Piel de los pies \u2192 u\xF1as"},{texto:"U\xF1as engrosadas y amarillas; descamaci\xF3n entre los dedos"},{texto:"Onicomicosis + tinea pedis por T. rubrum"},{texto:"KOH: hifas septadas \xB7 Sabouraud: reverso rojo vinoso"},{texto:"Terbinafina oral 12 semanas + t\xF3pico en la piel"},{texto:"Pies secos, calzado ventilado \xB7 Complicaci\xF3n: recurrencia"}],claves:["S\xEDntomas: U\xF1as engrosadas, amarillentas, quebradizas; descamaci\xF3n y picaz\xF3n entre los dedos (tinea pedis cr\xF3nica).","Zona afectada: U\xF1as y piel de los pies.","Enfermedad: Onicomicosis y tinea pedis por Trichophyton rubrum.","Patogenia: Dermatofito antropof\xEDlico que se contagia en pisos h\xFAmedos (duchas, piscinas); invade la queratina de la piel y la u\xF1a, favorecido por humedad y calzado cerrado.","Diagn\xF3stico: KOH de la u\xF1a: hifas septadas; cultivo en Sabouraud: colonia blanca con reverso rojo vinoso; microscopio: hifas delgadas con pocos conidios, microconidios en l\xE1grima pegados a la hifa.","Tratamiento: Terbinafina oral por 12 semanas, m\xE1s tratamiento t\xF3pico en la piel.","Prevenci\xF3n y complicaciones: Pies secos, calzado ventilado, sandalias en duchas p\xFAblicas. Complicaciones: recurrencia, dolor, sobreinfecci\xF3n bacteriana."],intrusos:["Tratar con nistatina oral","Contagio por inhalaci\xF3n de conidias"]},{id:"hongos-esporotricosis",tema:"Hongos",grupo:"Dim\xF3rficos",titulo:"Esporotricosis linfocut\xE1nea",consigna:"Jardinero de 45 a\xF1os que se pinch\xF3 con un rosal hace un mes. En el dorso de la mano tiene un n\xF3dulo que se ulcer\xF3, y ahora aparecen otros n\xF3dulos en cadena que suben por el antebrazo. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Pinchazo con rosal o madera"},{texto:"Inoculaci\xF3n de Sporothrix (moho a 25 \xB0C \u2192 levadura a 37 \xB0C)"},{texto:"Piel, subcut\xE1neo y linf\xE1ticos del miembro"},{texto:"N\xF3dulo que se ulcera + n\xF3dulos en cadena por los linf\xE1ticos"},{texto:"Esporotricosis linfocut\xE1nea"},{texto:"Cultivo 25 \xB0C: conidios en margarita \xB7 tejido: levaduras en puro"},{texto:"Itraconazol 3\u20136 meses (alternativa: yoduro de potasio)"},{texto:"Guantes con plantas y madera \xB7 Complicaci\xF3n: diseminaci\xF3n en inmunodeprimidos"}],claves:["S\xEDntomas: N\xF3dulo en el sitio del pinchazo que se ulcera; n\xF3dulos en cadena que siguen el trayecto linf\xE1tico.","Zona afectada: Piel y tejido subcut\xE1neo, y vasos linf\xE1ticos del miembro.","Enfermedad: Esporotricosis linfocut\xE1nea por Sporothrix schenckii.","Patogenia: Hongo dim\xF3rfico de inoculaci\xF3n: entra por pinchazo con rosal o madera. En el ambiente (25 \xB0C) es moho; en el cuerpo (37 \xB0C) se vuelve levadura y avanza por los linf\xE1ticos.","Diagn\xF3stico: Cultivo a 25 \xB0C: hifas delgadas septadas con conidios en margarita o roseta. En tejido (37 \xB0C): levaduras en forma de puro.","Tratamiento: Itraconazol por 3 a 6 meses (alternativa: yoduro de potasio).","Prevenci\xF3n y complicaciones: Guantes al manipular plantas y madera. Complicaciones: diseminaci\xF3n en inmunodeprimidos, cronicidad."],intrusos:["Inhalaci\xF3n de excremento de aves y murci\xE9lagos","Tratar con nistatina t\xF3pica"]},{id:"hongos-histoplasmosis",tema:"Hongos",grupo:"Dim\xF3rficos",titulo:"Histoplasmosis diseminada",consigna:"Var\xF3n de 35 a\xF1os con VIH y CD4 bajos. Hace un mes visit\xF3 cuevas con murci\xE9lagos en Tingo Mar\xEDa. Tiene fiebre, baja de peso, hepatoesplenomegalia y pancitopenia. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Inhalaci\xF3n de conidios en cuevas con murci\xE9lagos (Tingo Mar\xEDa)"},{texto:"Dim\xF3rfico: a 37 \xB0C se vuelve levadura dentro de los macr\xF3fagos"},{texto:"\xBFHay inmunosupresi\xF3n (VIH)?",decision:!0,rama:"No \u2192 infecci\xF3n leve o asintom\xE1tica"},{texto:"Pulm\xF3n \u2192 h\xEDgado, bazo, m\xE9dula \xF3sea"},{texto:"Fiebre, baja de peso, hepatoesplenomegalia, pancitopenia"},{texto:"Histoplasmosis diseminada"},{texto:"Tejido: levaduras en macr\xF3fagos \xB7 cultivo 25 \xB0C: macroconidias tuberculadas"},{texto:"Anfotericina B liposomal \u2192 luego itraconazol"},{texto:"Evitar cuevas si hay VIH, TARV \xB7 Complicaci\xF3n: falla multiorg\xE1nica"}],claves:["S\xEDntomas: Fiebre, baja de peso, hepatoesplenomegalia, pancitopenia (forma diseminada).","Zona afectada: Pulm\xF3n (entrada) y sistema reticuloendotelial: h\xEDgado, bazo, m\xE9dula \xF3sea (macr\xF3fagos).","Enfermedad: Histoplasmosis diseminada por Histoplasma capsulatum, en paciente con VIH.","Patogenia: Se inhalan los conidios de suelos con guano de murci\xE9lagos (cuevas). Es dim\xF3rfico: a 37 \xB0C se vuelve levadura que vive dentro de los macr\xF3fagos; con la inmunosupresi\xF3n del VIH se disemina.","Diagn\xF3stico: En tejido: levaduras peque\xF1as dentro de los macr\xF3fagos. Cultivo a 25 \xB0C (fase moho): macroconidias tuberculadas, redondas con espinas.","Tratamiento: Anfotericina B liposomal y luego itraconazol.","Prevenci\xF3n y complicaciones: Evitar cuevas con murci\xE9lagos si hay inmunosupresi\xF3n; TARV. Complicaciones: falla multiorg\xE1nica, muerte."],intrusos:["Inoculaci\xF3n traum\xE1tica con espinas de rosa","Levaduras con gemaci\xF3n m\xFAltiple en \xABrueda de tim\xF3n\xBB"]},{id:"hongos-paracoccidioidomicosis",tema:"Hongos",grupo:"Dim\xF3rficos",titulo:"Paracoccidioidomicosis",consigna:"Agricultor de 50 a\xF1os de la selva, fumador. Tiene tos cr\xF3nica desde hace meses con baciloscop\xEDas negativas, \xFAlceras en la boca de aspecto moriforme y adenopat\xEDas cervicales. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Inhalaci\xF3n del hongo del suelo rural (selva)"},{texto:"Dim\xF3rfico: a 37 \xB0C se vuelve levadura \u2192 se disemina desde el pulm\xF3n"},{texto:"Pulm\xF3n \u2192 mucosa oral y ganglios"},{texto:"Tos cr\xF3nica, \xFAlceras orales moriformes, adenopat\xEDas"},{texto:"\xBFBaciloscop\xEDa negativa?",decision:!0,rama:"No (BK positiva) \u2192 pensar en tuberculosis"},{texto:"Paracoccidioidomicosis"},{texto:"Directo o biopsia: levadura en \xABrueda de tim\xF3n\xBB"},{texto:"Itraconazol 6\u201312 meses; grave: anfotericina B"},{texto:"Diagn\xF3stico temprano en agricultores \xB7 Complicaci\xF3n: fibrosis pulmonar"}],claves:["S\xEDntomas: Tos cr\xF3nica, \xFAlceras orales moriformes, adenopat\xEDas; baja de peso.","Zona afectada: Pulm\xF3n (entrada), mucosa oral y ganglios linf\xE1ticos.","Enfermedad: Paracoccidioidomicosis por Paracoccidioides brasiliensis.","Patogenia: Hongo dim\xF3rfico del suelo de zonas rurales de la selva; se inhala y en el cuerpo (37 \xB0C) se vuelve levadura; desde el pulm\xF3n se disemina a mucosas y ganglios.","Diagn\xF3stico: Examen directo o biopsia: levadura madre grande con m\xFAltiples gemaciones alrededor (\xABrueda de tim\xF3n\xBB). BK negativa la diferencia de tuberculosis.","Tratamiento: Itraconazol por 6 a 12 meses; en casos graves, anfotericina B.","Prevenci\xF3n y complicaciones: Diagn\xF3stico temprano en agricultores con tos cr\xF3nica y BK negativa. Complicaciones: fibrosis pulmonar, lesiones cr\xF3nicas de mucosa."],intrusos:["Levadura con una sola gemaci\xF3n de base ancha","Afecta sobre todo a ni\xF1os de zonas urbanas"]},{id:"hongos-otomicosis",tema:"Hongos",grupo:"Mohos hialinos",titulo:"Otomicosis por Aspergillus niger",consigna:"Nadadora de 22 a\xF1os con picaz\xF3n y sensaci\xF3n de o\xEDdo tapado desde hace dos semanas. En el conducto auditivo externo se ve una secreci\xF3n con puntos negros, como algod\xF3n con pimienta. Elabora el flujograma: s\xEDntomas, zona afectada, enfermedad, patogenia, diagn\xF3stico, tratamiento, prevenci\xF3n y complicaciones.",pasos:[{texto:"Humedad en el o\xEDdo (nataci\xF3n)"},{texto:"Aspergillus niger del ambiente coloniza el conducto"},{texto:"Conducto auditivo externo"},{texto:"Picaz\xF3n, o\xEDdo tapado, secreci\xF3n con puntos negros"},{texto:"Otomicosis por Aspergillus niger"},{texto:"Otoscopia + Sabouraud: colonia negra, cabeza aspergilar biseriada"},{texto:"Limpieza del conducto + clotrimazol t\xF3pico"},{texto:"Secar los o\xEDdos tras nadar, no usar hisopos \xB7 Complicaci\xF3n: recurrencia"}],claves:["S\xEDntomas: Prurito \xF3tico, sensaci\xF3n de o\xEDdo tapado, secreci\xF3n con puntos negros; puede haber dolor leve.","Zona afectada: Conducto auditivo externo.","Enfermedad: Otomicosis (otitis externa f\xFAngica) por Aspergillus niger.","Patogenia: La humedad del conducto (nataci\xF3n) favorece que el moho ambiental colonice el cerumen y la piel del conducto; los conidios negros dan el aspecto t\xEDpico.","Diagn\xF3stico: Otoscopia; examen directo y cultivo en Sabouraud: colonia cubierta de conidios negros, reverso incoloro o marfil; microscopio: hifas hialinas septadas con cabeza aspergilar biseriada.","Tratamiento: Limpieza del conducto y clotrimazol t\xF3pico.","Prevenci\xF3n y complicaciones: Secar bien los o\xEDdos despu\xE9s de nadar, no usar hisopos. Complicaciones: recurrencia, perforaci\xF3n timp\xE1nica."],intrusos:["Tratar solo con antibi\xF3tico oral","Hifas anchas sin septos, en cinta"]}];var Rr=[{id:"vih-dx-adulto",tema:"Virus",titulo:"Diagn\xF3stico de VIH en un adulto (MINSA)",consigna:"Elabora el flujograma de diagn\xF3stico de laboratorio de la infecci\xF3n por VIH en un adulto, seg\xFAn la norma t\xE9cnica del MINSA. Indica qu\xE9 se hace si las pruebas no coinciden.",pasos:[{texto:"Tamizaje: prueba r\xE1pida o ELISA de 4.\xAA generaci\xF3n"},{texto:"\xBFReactivo?",decision:!0,rama:"No \u2192 negativo. Si la exposici\xF3n fue reciente (ventana), repetir."},{texto:"Segunda prueba con otra metodolog\xEDa (si fue ELISA: prueba r\xE1pida, LIA, IFI o PCR)"},{texto:"\xBFAmbas reactivas?",decision:!0,rama:"Discordantes \u2192 confirmar con LIA o RT-qPCR. LIA con una sola l\xEDnea (p. ej. p24): indeterminado \u2192 repetir y pedir carga viral."},{texto:"Diagn\xF3stico confirmado"},{texto:"CD4 y carga viral iniciales (obligatorios antes del TARV)"},{texto:"Iniciar TARV: TDF + 3TC + DTG (TLD)"},{texto:"Monitoreo: carga viral a los 6 meses y luego cada 6 meses; meta indetectable (< 200 copias/mL)"}],claves:["Empieza con prueba r\xE1pida o ELISA de 4.\xAA generaci\xF3n","Si es reactiva, segunda prueba de otra metodolog\xEDa","Dos reactivas = diagn\xF3stico confirmado","Discordantes se resuelven con LIA o RT-qPCR","Menciona el periodo de ventana si sale negativo tras exposici\xF3n reciente","Pide CD4 y carga viral antes del TARV","Esquema de inicio TLD","Seguimiento con carga viral (meta indetectable)"],intrusos:["Western blot obligatorio antes de todo","Esperar s\xEDntomas para pedir la segunda prueba"]},{id:"vih-neonato",tema:"Virus",titulo:"Diagn\xF3stico de VIH en el reci\xE9n nacido",consigna:"Un reci\xE9n nacido es hijo de una madre con VIH. Elabora el flujograma para saber si est\xE1 infectado y explica por qu\xE9 no se usan pruebas de anticuerpos.",pasos:[{texto:"Reci\xE9n nacido de madre con VIH"},{texto:"No usar anticuerpos: pueden ser de la madre",rama:"Por eso se busca el virus (material gen\xE9tico), no anticuerpos."},{texto:"PCR a las 2 semanas"},{texto:"PCR al mes"},{texto:"PCR a los 4\u20136 meses"},{texto:"\xBFAlguna PCR positiva?",decision:!0,rama:"S\xED \u2192 infecci\xF3n confirmada: evaluar y tratar (ABC + 3TC + DTG desde los 3 kg y 4 semanas). No \u2192 no infectado."}],claves:["Usa PCR, no pruebas de anticuerpos","Explica que los anticuerpos pueden ser de la madre","PCR a las 2 semanas","PCR al mes","PCR a los 4\u20136 meses"],intrusos:["ELISA de 4.\xAA generaci\xF3n al nacer","Western blot a las 2 semanas"]},{id:"vih-ciclo",tema:"Virus",titulo:"Ciclo de replicaci\xF3n del VIH",consigna:"Esquematiza el ciclo de replicaci\xF3n del VIH desde que llega a la c\xE9lula hasta que salen nuevos virus. Indica qu\xE9 prote\xEDna o enzima act\xFAa en cada paso.",pasos:[{texto:"Uni\xF3n: gp120 se une a CD4"},{texto:"Correceptor: CCR5 (fase inicial) o CXCR4 (fase avanzada)"},{texto:"Fusi\xF3n de membranas: gp41"},{texto:"Liberaci\xF3n del ARN viral en el citoplasma"},{texto:"Retrotranscripci\xF3n: la transcriptasa inversa copia el ARN a ADN"},{texto:"Integraci\xF3n: la integrasa inserta el ADN en el genoma \u2192 provirus"},{texto:"\xBFSe activa?",decision:!0,rama:"No \u2192 latencia (reservorio: CD4 de memoria, macr\xF3fagos, SNC)."},{texto:"Transcripci\xF3n y traducci\xF3n: prote\xEDnas gag, pol y env"},{texto:"Ensamblaje de nuevos viriones"},{texto:"Maduraci\xF3n: la proteasa corta las poliprote\xEDnas"},{texto:"Liberaci\xF3n por gemaci\xF3n e infecci\xF3n de otras c\xE9lulas"}],claves:["gp120 se une a CD4","Correceptor CCR5 o CXCR4","gp41 hace la fusi\xF3n","Transcriptasa inversa: ARN \u2192 ADN","Integrasa: forma el provirus","Posibilidad de latencia","Proteasa en la maduraci\xF3n","Salida por gemaci\xF3n"],intrusos:["La neuraminidasa libera los viriones","El ARN se traduce directamente como ARNm sin pasar a ADN"]},{id:"vih-historia",tema:"Virus",titulo:"Historia natural de la infecci\xF3n por VIH",consigna:"Elabora el flujograma de la historia natural del VIH sin tratamiento. Para cada fase indica el tiempo, el nivel de CD4 y lo que encuentras en el paciente o en el laboratorio.",pasos:[{texto:"Exposici\xF3n al virus"},{texto:"S\xEDndrome retroviral agudo (2\u20134 semanas)",rama:"Fiebre, adenopat\xEDas, faringitis, rash, \xFAlceras. Carga viral muy alta. p24 positivo con anticuerpos a\xFAn negativos (ventana)."},{texto:"Latencia cl\xEDnica (8\u201310 a\xF1os)",rama:"Asintom\xE1tico; el virus se replica y los CD4 bajan poco a poco. Linfadenopat\xEDa generalizada persistente."},{texto:"Fase sintom\xE1tica (CD4 200\u2013500)",rama:"Herpes z\xF3ster, candidiasis oral, p\xE9rdida de peso, sudoraci\xF3n nocturna."},{texto:"SIDA (CD4 < 200 o enfermedad definitoria)",rama:"Pneumocystis, toxoplasmosis cerebral, TB extrapulmonar, candidiasis esof\xE1gica, CMV, Cryptococcus, Kaposi (HHV-8), linfoma (EBV)."},{texto:"Sin tratamiento: muerte en 2\u20133 a\xF1os"}],claves:["Fase aguda a las 2\u20134 semanas con p24 y ventana serol\xF3gica","Latencia de 8\u201310 a\xF1os con ca\xEDda progresiva de CD4","Fase sintom\xE1tica con CD4 entre 200 y 500","SIDA con CD4 < 200 o enfermedad definitoria","Al menos 3 infecciones oportunistas","Neoplasias: Kaposi (HHV-8) y linfoma (EBV)"],intrusos:["Anticuerpos positivos desde el d\xEDa 3","Hipercalcemia con c\xE9lulas en flor"]},{id:"vph-cotest",tema:"Virus",titulo:"Tamizaje de c\xE1ncer de cuello uterino (co-test)",consigna:"Elabora el flujograma del tamizaje de c\xE1ncer de cuello uterino con co-test: a qui\xE9n se le hace y qu\xE9 se hace seg\xFAn el resultado de la citolog\xEDa y de la prueba de VPH.",pasos:[{texto:"Mujer de 30 a 65 a\xF1os (no se recomienda antes de 30)"},{texto:"Co-test: Papanicolaou + PCR de VPH"},{texto:"\xBFCitolog\xEDa normal?",decision:!0,rama:"ASC-US con VPH negativo \u2192 repetir en 3 a\xF1os. ASC-US con VPH positivo \u2192 colposcopia. HSIL con VPH positivo \u2192 colposcopia y/o biopsia."},{texto:"\xBFVPH negativo?",decision:!0,rama:"S\xED \u2192 repetir el co-test en 5 a\xF1os."},{texto:"\xBFEs VPH 16/18?",decision:!0,rama:"No \u2192 repetir en 12 meses o genotipificar."},{texto:"VPH 16/18 positivo \u2192 colposcopia inmediata"},{texto:"Si se confirma NIC 2\u20133 \u2192 escisi\xF3n (LEEP o conizaci\xF3n)"}],claves:["Edad de 30 a 65 a\xF1os","Co-test = citolog\xEDa + PCR de VPH","Normal + VPH negativo \u2192 5 a\xF1os","Normal + VPH positivo no 16/18 \u2192 12 meses o genotipificar","Normal + VPH 16/18 \u2192 colposcopia inmediata","ASC-US: seg\xFAn VPH (3 a\xF1os o colposcopia)","HSIL \u2192 colposcopia y/o biopsia"],intrusos:["Antiviral contra el VPH si sale positivo","Iniciar el tamizaje a los 18 a\xF1os"]},{id:"vph-cancer",tema:"Virus",titulo:"Del VPH de alto riesgo al c\xE1ncer",consigna:"Explica con un flujograma c\xF3mo una infecci\xF3n por VPH de alto riesgo puede llegar a c\xE1ncer de cuello uterino. Incluye qu\xE9 hacen E2, E6 y E7.",pasos:[{texto:"Infecci\xF3n de la capa basal del epitelio por microlesiones"},{texto:"\xBFPersiste m\xE1s de 12\u201324 meses?",decision:!0,rama:"No (\u2248 90 %) \u2192 la infecci\xF3n se elimina sola."},{texto:"Integraci\xF3n del ADN viral al genoma de la c\xE9lula"},{texto:"P\xE9rdida de E2, que normalmente frena a E6 y E7"},{texto:"E6 degrada p53 (no hay apoptosis); E7 inactiva Rb (libera E2F \u2192 fase S)"},{texto:"Proliferaci\xF3n sin control y acumulaci\xF3n de da\xF1o gen\xE9tico"},{texto:"NIC 1 \u2192 NIC 2 \u2192 NIC 3 (carcinoma in situ)"},{texto:"C\xE1ncer invasor"}],claves:["Solo una minor\xEDa (~10 %) persiste","Integraci\xF3n del ADN viral","P\xE9rdida de E2","E6 \u2192 p53","E7 \u2192 Rb / E2F","Progresi\xF3n NIC 1 \u2192 2 \u2192 3 \u2192 c\xE1ncer"],intrusos:["Viremia y paso a la sangre","El ADN se queda como episoma y no se integra"]},{id:"htlv",tema:"Virus",titulo:"HTLV-1: de la infecci\xF3n a la enfermedad",consigna:"Elabora un flujograma de la infecci\xF3n por HTLV-1: c\xF3mo se adquiere, c\xF3mo se mantiene y qu\xE9 dos enfermedades produce, con su mecanismo.",pasos:[{texto:"Transmisi\xF3n por c\xE9lulas infectadas: lactancia (la principal), sexual o parenteral"},{texto:"Infecta linfocitos T CD4+ e integra su ADN (provirus)"},{texto:"Latencia: p30 y Rex mantienen el estado latente; HBZ, p12 y p13 evaden la inmunidad"},{texto:"\xBFQu\xE9 ocurre despu\xE9s de a\xF1os?",decision:!0,rama:"La mayor\xEDa se queda como portador asintom\xE1tico."},{texto:"V\xEDa tumoral: Tax y HBZ estimulan la proliferaci\xF3n + mutaciones \u2192 ATLL (< 5 %, tras 20\u201340 a\xF1os): c\xE9lulas en flor, hipercalcemia"},{texto:"V\xEDa inmune: respuesta citot\xF3xica contra CD4 infectados en el SNC \u2192 HAM/TSP (< 1 %): paraparesia esp\xE1stica"}],claves:["Lactancia como v\xEDa principal","Infecta CD4 y se integra","Tax y HBZ como oncoprote\xEDnas","ATLL: < 5 %, tras 20\u201340 a\xF1os","ATLL: c\xE9lulas en flor e hipercalcemia","HAM/TSP: da\xF1o inmune, no infecci\xF3n de neuronas"],intrusos:["El virus destruye los CD4 como el VIH","Se transmite por mosquitos"]},{id:"ciclo-viral",tema:"Virus",titulo:"Ciclo viral general",consigna:"Esquematiza las etapas del ciclo de un virus dentro de la c\xE9lula, desde que se une hasta que sale. Se\xF1ala la diferencia en la salida entre virus envueltos y desnudos.",pasos:[{texto:"Reconocimiento de la c\xE9lula diana y uni\xF3n a receptores"},{texto:"Penetraci\xF3n (endocitosis) o fusi\xF3n"},{texto:"P\xE9rdida de la envoltura y desnudamiento del genoma"},{texto:"S\xEDntesis temprana: ARNm y prote\xEDnas no estructurales (enzimas)"},{texto:"Replicaci\xF3n del genoma"},{texto:"S\xEDntesis tard\xEDa: prote\xEDnas estructurales"},{texto:"Modificaci\xF3n de prote\xEDnas y ensamblaje"},{texto:"\xBFTiene envoltura?",decision:!0,rama:"S\xED \u2192 sale por gemaci\xF3n. No (desnudo) \u2192 sale por lisis celular."}],claves:["Uni\xF3n a receptores","Penetraci\xF3n o fusi\xF3n","Desnudamiento","Prote\xEDnas tempranas antes que las tard\xEDas","Replicaci\xF3n del genoma","Ensamblaje","Envueltos: gemaci\xF3n; desnudos: lisis"],intrusos:["Divisi\xF3n binaria","Formaci\xF3n de esporas"]},{id:"genoma",tema:"Virus",titulo:"\xBFQu\xE9 hace el genoma al entrar a la c\xE9lula?",consigna:"Elabora un flujograma que, seg\xFAn el tipo de genoma (ADN, ARN +, ARN \u2212 o retrovirus), explique c\xF3mo llega el virus a producir sus prote\xEDnas.",pasos:[{texto:"El virus entra a la c\xE9lula"},{texto:"\xBFADN?",decision:!0,rama:"S\xED \u2192 va al n\xFAcleo, la ARN polimerasa de la c\xE9lula hace el ARNm. Mutan menos y pueden hacer latencia."},{texto:"\xBFARN de sentido positivo?",decision:!0,rama:"S\xED \u2192 funciona directo como ARNm: se traduce y produce su polimerasa."},{texto:"\xBFARN de sentido negativo?",decision:!0,rama:"S\xED \u2192 usa la ARN polimerasa que trae consigo para hacer ARN (+), y luego se traduce."},{texto:"Retrovirus: la transcriptasa inversa copia el ARN a ADN, que se integra al genoma y se transcribe"}],claves:["ADN: n\xFAcleo y polimerasa de la c\xE9lula","ARN +: se traduce directo","ARN \u2212: trae su propia polimerasa","Retrovirus: transcriptasa inversa e integraci\xF3n"],intrusos:["El ARN \u2212 se traduce directamente","Los virus ADN usan transcriptasa inversa siempre"]}],ga=[...Rr,...Qi];var Te=[["sintomas","S\xEDntomas"],["zona","Zona afectada del cuerpo"],["enfermedad","Enfermedad"],["patogenia","Patogenia"],["diagnostico","Diagn\xF3stico"],["tratamiento","Tratamiento"],["prevencion","Prevenci\xF3n y complicaciones"],["logica","L\xF3gica del flujograma"]],se="Debe ir en orden causal y con flechas que unan causa y efecto: agente y transmisi\xF3n \u2192 patogenia \u2192 zona afectada \u2192 s\xEDntomas \u2192 enfermedad \u2192 diagn\xF3stico \u2192 tratamiento \u2192 prevenci\xF3n y complicaciones. Las decisiones (s\xED/no) deben tener sus dos salidas. Una lista sin flechas o con pasos fuera de orden no es un flujograma completo.",Le=["patogenia","zona","sintomas","enfermedad","diagnostico","tratamiento","prevencion"],Ua={virus:{nombre:"Virus",fuente:"las teor\xEDas 10 y 11 de Virus"},hongos:{nombre:"Hongos",fuente:"el material de Hongos del curso (pr\xE1cticas y banco de laboratorio)"}},ka={f:{nombre:"Flujograma corto",criterios:["sintomas","enfermedad","tratamiento","logica"],revela:!0,desc:"Te digo la enfermedad. 4 criterios: s\xEDntomas, enfermedad, tratamiento y l\xF3gica.",rigor:"NIVEL F\xC1CIL. El alumno ya conoce la enfermedad (se la dimos). Eval\xFAa SOLO los 4 criterios indicados. Acepta ideas generales si son correctas (no exijas mecanismos moleculares ni esquemas exactos), pero cualquier dato falso baja el criterio. En \xABL\xF3gica\xBB basta un orden coherente de inicio a fin unido con flechas."},m:{nombre:"Flujograma intermedio",criterios:["sintomas","zona","enfermedad","diagnostico","tratamiento","logica"],desc:"T\xFA identificas la enfermedad. 6 criterios: se suman zona afectada y diagn\xF3stico.",rigor:"NIVEL MEDIO. El alumno debe identificar la enfermedad. Eval\xFAa SOLO los 6 criterios indicados. Exige los datos principales de cada uno: la c\xE9lula u \xF3rgano diana, el examen que confirma y el f\xE1rmaco o medida de elecci\xF3n. Un 4 requiere esos datos sin errores. En \xABL\xF3gica\xBB exige orden causal y flechas."},d:{nombre:"Flujograma completo",criterios:["sintomas","zona","enfermedad","patogenia","diagnostico","tratamiento","prevencion","logica"],desc:"Los 8 criterios: se suman patogenia y prevenci\xF3n/complicaciones.",rigor:"NIVEL DIF\xCDCIL. Eval\xFAa los 8 criterios. La patogenia debe explicar el mecanismo (c\xF3mo entra, qu\xE9 c\xE9lula infecta, qu\xE9 hace dentro), el diagn\xF3stico la secuencia de pruebas, el tratamiento el esquema o f\xE1rmaco espec\xEDfico, y deben aparecer prevenci\xF3n y complicaciones. En \xABL\xF3gica\xBB el flujograma debe seguir el orden del modelo con flechas."},x:{nombre:"Flujograma de examen final",criterios:["sintomas","zona","enfermedad","patogenia","diagnostico","tratamiento","prevencion","logica"],desc:"Los 8 criterios con detalle de examen final y al menos una decisi\xF3n S\xED/No. Correcci\xF3n muy estricta.",rigor:"NIVEL MUY DIF\xCDCIL: corrige como un examen final exigente. Exige TODOS los detalles de la clave (receptores, enzimas, genes, tiempos, esquemas y dosis de la clave cuando existan). Cualquier imprecisi\xF3n baja el criterio; un 4 solo si es impecable. En \xABL\xF3gica\xBB exige formas de flujograma (inicio, pasos, al menos una decisi\xF3n en rombo con salidas S\xED y No coherentes con el modelo) y flechas; sin decisi\xF3n, m\xE1ximo 2 en ese criterio."}},Pa=[{id:"vih-agudo",area:"virus",tema:"VIH",caso:"Var\xF3n de 25 a\xF1os. Tres semanas despu\xE9s de una relaci\xF3n sexual sin preservativo presenta fiebre, adenopat\xEDas generalizadas, dolor de garganta, mialgias, rash maculopapular y \xFAlceras orales.",clave:{sintomas:"Fiebre, linfadenopat\xEDas generalizadas, dolor de garganta, mialgias y artralgias, rash maculopapular, \xFAlceras orales o genitales (cuadro tipo mononucleosis).",zona:"Sistema inmune: linfocitos T CD4+ y tejido linfoide (ganglios, GALT). Puerta de entrada: mucosa genital o rectal.",enfermedad:"Infecci\xF3n por VIH-1 en fase aguda: s\xEDndrome retroviral agudo (2\u20134 semanas tras la exposici\xF3n). Sin tratamiento sigue latencia cl\xEDnica (8\u201310 a\xF1os) y luego SIDA.",patogenia:"Retrovirus (Lentivirus, ARN +, Baltimore VI). gp120 se une a CD4 con correceptor CCR5 (fase inicial) o CXCR4; gp41 fusiona. Transcriptasa inversa ARN \u2192 ADN, integrasa \u2192 provirus (latencia en reservorios). Destrucci\xF3n de CD4 por lisis, apoptosis y citotoxicidad CD8. Carga viral muy alta en esta fase.",diagnostico:"Tamizaje con ELISA de 4.\xAA generaci\xF3n o prueba r\xE1pida: el ant\xEDgeno p24 aparece antes que los anticuerpos (periodo de ventana). Segunda prueba de otra metodolog\xEDa; discordantes con LIA o RT-qPCR. Al confirmar: CD4 y carga viral.",tratamiento:"TARV de por vida, primera l\xEDnea MINSA: TDF + 3TC + DTG (TLD).",prevencion:"Preservativo, no compartir agujas, tamizaje y TARV en gestantes. Complicaci\xF3n: SIDA (CD4 < 200) con infecciones oportunistas (Pneumocystis jirovecii, toxoplasmosis cerebral, TB extrapulmonar, candidiasis esof\xE1gica, CMV, Cryptococcus) y neoplasias (sarcoma de Kaposi por HHV-8, linfoma por EBV). Es muy contagioso en esta fase."},grafico:[["ini","patogenia","VIH-1 entra por mucosa genital (relaci\xF3n sin preservativo)"],["pro","patogenia","gp120 se une a CD4 + correceptor CCR5 \xB7 gp41 fusiona"],["pro","patogenia","Transcriptasa inversa: ARN \u2192 ADN \xB7 integrasa \u2192 provirus"],["pro","zona","Linfocitos T CD4+ y tejido linfoide (ganglios, GALT)"],["pro","sintomas","Fiebre, adenopat\xEDas, faringitis, mialgias, rash, \xFAlceras orales"],["pro","enfermedad","S\xEDndrome retroviral agudo (2\u20134 semanas)"],["dec","diagnostico","ELISA 4.\xAA gen o prueba r\xE1pida: \xBFreactiva?","Ventana: el p24 aparece antes que los anticuerpos \u2192 repetir"],["pro","diagnostico","Segunda prueba de otra metodolog\xEDa (discordantes: LIA o RT-qPCR)"],["pro","diagnostico","Confirmado \u2192 CD4 y carga viral"],["pro","tratamiento","TARV de por vida: TDF + 3TC + DTG (TLD)"],["fin","prevencion","Preservativo, no compartir agujas \xB7 Sin TARV: latencia 8\u201310 a\xF1os \u2192 SIDA (oportunistas, Kaposi, linfoma)"]]},{id:"kaposi",area:"virus",tema:"VIH",caso:"Var\xF3n de 40 a\xF1os con VIH que abandon\xF3 el tratamiento. P\xE9rdida de peso, sudoraci\xF3n nocturna y n\xF3dulos rojo-viol\xE1ceos en ambas piernas. CD4: 150 c\xE9lulas/mm\xB3.",clave:{sintomas:"N\xF3dulos y placas rojo-viol\xE1ceas en la piel, p\xE9rdida de peso, sudoraci\xF3n nocturna, fatiga (inmunodeficiencia avanzada).",zona:"Piel (c\xE9lulas endoteliales de los vasos) y sistema inmune (CD4).",enfermedad:"SIDA (CD4 < 200) con sarcoma de Kaposi, neoplasia definitoria de SIDA.",patogenia:"El VIH destruye CD4 y baja la inmunidad celular; el herpesvirus humano 8 (HHV-8) prolifera sin control, infecta c\xE9lulas endoteliales e induce angiog\xE9nesis y proliferaci\xF3n (IL-6, VEGF). La prote\xEDna Tat del VIH potencia la angiog\xE9nesis. El VIH no es oncog\xE9nico directo.",diagnostico:"CD4 < 200 y carga viral alta. Biopsia de la lesi\xF3n: c\xE9lulas fusiformes con hemat\xEDes en peque\xF1os vasos.",tratamiento:"Reiniciar TARV (TLD; si hay fallo virol\xF3gico con buena adherencia, segunda l\xEDnea AZT + 3TC + LPV/r) y manejo oncol\xF3gico de la lesi\xF3n.",prevencion:"Adherencia al TARV, diagn\xF3stico temprano. Complicaciones: otras infecciones oportunistas (Pneumocystis, toxoplasmosis, TB extrapulmonar), linfoma no Hodgkin por EBV, caquexia y muerte sin tratamiento."},grafico:[["ini","patogenia","VIH sin tratamiento"],["pro","patogenia","Destrucci\xF3n de CD4 \u2192 baja la inmunidad celular"],["pro","patogenia","HHV-8 prolifera sin control \u2192 infecta endotelio \u2192 angiog\xE9nesis (IL-6, VEGF; Tat del VIH)"],["pro","zona","Piel (endotelio de los vasos) y sistema inmune"],["pro","sintomas","N\xF3dulos rojo-viol\xE1ceos, p\xE9rdida de peso, sudoraci\xF3n nocturna"],["dec","diagnostico","\xBFCD4 < 200 o enfermedad definitoria?","Fase sintom\xE1tica (CD4 200\u2013500): a\xFAn no es SIDA"],["pro","enfermedad","SIDA con sarcoma de Kaposi"],["pro","diagnostico","Carga viral + biopsia: c\xE9lulas fusiformes con hemat\xEDes"],["pro","tratamiento","Reiniciar TARV (TLD) + manejo oncol\xF3gico"],["fin","prevencion","Adherencia al TARV \xB7 Complicaciones: otras oportunistas, linfoma (EBV), caquexia"]]},{id:"cancer-cervix",area:"virus",tema:"VPH",caso:"Mujer de 42 a\xF1os que nunca se hizo un Papanicolaou. Consulta por sangrado despu\xE9s de las relaciones sexuales, flujo f\xE9tido y dolor p\xE9lvico.",clave:{sintomas:"Sangrado postcoital, flujo f\xE9tido, dolor p\xE9lvico (en etapas iniciales suele ser asintom\xE1tico: m\xE1s del 90 % de las infecciones por VPH no dan s\xEDntomas).",zona:"Cuello uterino, en la zona de transformaci\xF3n (epitelio escamoso).",enfermedad:"C\xE1ncer de cuello uterino asociado a VPH de alto riesgo (16 y 18), tras NIC 1 \u2192 NIC 2 \u2192 NIC 3.",patogenia:"VPH (Papillomaviridae, ADN doble cadena, no envuelto) entra a la capa basal por microlesiones. Solo ~10 % persiste m\xE1s de 12\u201324 meses: el ADN se integra, se pierde E2 y E6 y E7 quedan sin control. E6 degrada p53 (sin apoptosis) y E7 inactiva Rb (libera E2F, entra a fase S): proliferaci\xF3n descontrolada y da\xF1o gen\xE9tico.",diagnostico:"Co-test: Papanicolaou (coilocitos, LSIL/HSIL) + PCR de VPH con genotipificaci\xF3n. Colposcopia y biopsia.",tratamiento:"No hay antiviral curativo. NIC 2\u20133: escisi\xF3n (LEEP o conizaci\xF3n). C\xE1ncer: cirug\xEDa, radioterapia y/o quimioterapia seg\xFAn estadio.",prevencion:"Vacuna tetravalente del MINSA (6, 11, 16, 18) a los 9\u201313 a\xF1os en 2 dosis; tamizaje con co-test de 30 a 65 a\xF1os; preservativo. Complicaci\xF3n: c\xE1ncer invasor y muerte; Per\xFA tiene alta incidencia y mortalidad."},grafico:[["ini","patogenia","VPH 16/18 por contacto sexual (microlesiones)"],["pro","zona","Capa basal del cuello uterino (zona de transformaci\xF3n)"],["dec","patogenia","\xBFLa infecci\xF3n persiste m\xE1s de 12\u201324 meses?","\u2248 90 % se elimina sola"],["pro","patogenia","ADN viral se integra \xB7 se pierde E2"],["pro","patogenia","E6 degrada p53 \xB7 E7 inactiva Rb \u2192 proliferaci\xF3n sin control"],["pro","enfermedad","NIC 1 \u2192 NIC 2 \u2192 NIC 3 \u2192 c\xE1ncer de cuello uterino"],["pro","sintomas","Sangrado postcoital, flujo f\xE9tido, dolor p\xE9lvico"],["pro","diagnostico","Co-test (Papanicolaou + PCR de VPH) \u2192 colposcopia y biopsia"],["pro","tratamiento","NIC 2\u20133: LEEP o conizaci\xF3n \xB7 C\xE1ncer: cirug\xEDa, radio y/o quimioterapia"],["fin","prevencion","Vacuna tetravalente (9\u201313 a\xF1os) \xB7 co-test de 30 a 65 a\xF1os \xB7 Complicaci\xF3n: c\xE1ncer invasor"]]},{id:"condiloma",area:"virus",tema:"VPH",caso:"Var\xF3n de 24 a\xF1os con lesiones m\xFAltiples, blandas, h\xFAmedas y exof\xEDticas en la regi\xF3n genital y perianal desde hace 2 meses. Tiene varias parejas sexuales.",clave:{sintomas:"Lesiones exof\xEDticas, h\xFAmedas, blandas y m\xFAltiples (verrugas), generalmente indoloras.",zona:"Piel y mucosa genital y perianal (epitelio escamoso, capa basal).",enfermedad:"Condiloma acuminado (verrugas genitales) por VPH de bajo riesgo 6 y 11.",patogenia:"VPH de bajo riesgo entra por microlesiones a la capa basal; su ADN queda como episoma (no se integra). E6 y E7 tienen poca afinidad por p53 y Rb: solo hay proliferaci\xF3n epitelial leve (hiperplasia, acantosis, coilocitosis), sin transformaci\xF3n maligna. Se libera sin lisis en las capas superficiales.",diagnostico:"Cl\xEDnico; PCR de VPH con genotipificaci\xF3n si hace falta; en citolog\xEDa, coilocitos.",tratamiento:"Se trata la lesi\xF3n, no el virus: imiquimod, podofilina o podofilotoxina, \xE1cido tricloroac\xE9tico, crioterapia, electrocauterio o l\xE1ser.",prevencion:"Vacuna tetravalente (cubre 6 y 11), preservativo (protecci\xF3n parcial: el contagio es piel a piel). Complicaciones: recurrencia, contagio a parejas aun sin lesiones visibles, y en el parto, papilomatosis lar\xEDngea del reci\xE9n nacido."},grafico:[["ini","patogenia","VPH 6/11 por contacto sexual piel a piel"],["pro","zona","Capa basal de piel y mucosa genital y perianal"],["pro","patogenia","ADN queda como episoma (no se integra)"],["pro","patogenia","E6/E7 d\xE9biles con p53 y Rb \u2192 solo hiperplasia (coilocitos)"],["pro","sintomas","Verrugas exof\xEDticas, h\xFAmedas, blandas, m\xFAltiples"],["pro","enfermedad","Condiloma acuminado"],["pro","diagnostico","Cl\xEDnico \xB1 PCR con genotipificaci\xF3n \xB7 citolog\xEDa: coilocitos"],["pro","tratamiento","Tratar la lesi\xF3n: imiquimod, podofilotoxina, \xE1cido tricloroac\xE9tico, crioterapia"],["fin","prevencion","Vacuna tetravalente, preservativo \xB7 Recurrencia, contagio sin lesiones, papilomatosis lar\xEDngea en el reci\xE9n nacido"]]},{id:"ham-tsp",area:"virus",tema:"HTLV",caso:"Mujer de 45 a\xF1os de la Amazon\xEDa peruana, amamantada por su madre hasta los 2 a\xF1os. Desde hace 3 a\xF1os tiene debilidad progresiva de ambas piernas, hiperreflexia, Babinski positivo, dolor lumbar y urgencia urinaria.",clave:{sintomas:"Paraparesia esp\xE1stica progresiva de miembros inferiores, hiperreflexia, clonus, Babinski positivo, hormigueo o ardor en piernas, dolor lumbar, disfunci\xF3n urinaria (polaquiuria, urgencia, incontinencia).",zona:"M\xE9dula espinal: cordones laterales y anteriores (atrofia de m\xE9dula dorsal).",enfermedad:"Paraparesia esp\xE1stica tropical o mielopat\xEDa asociada a HTLV-1 (HAM/TSP).",patogenia:"HTLV-1 (Deltaretrovirus, ARN +, Baltimore VI) transmitido por linfocitos infectados en la leche. Infecta CD4+ y se integra. Los CD4 infectados entran al SNC y la respuesta inmune citot\xF3xica cr\xF3nica desmieliniza la m\xE9dula. El virus no infecta las neuronas. Afecta a menos del 1 % de los infectados.",diagnostico:"ELISA de anticuerpos anti-HTLV (tamizaje), Western blot (diferencia HTLV-1 de HTLV-2), PCR del ADN proviral (pol, tax, gag) y carga proviral.",tratamiento:"No curativo: corticoides (prednisona), interfer\xF3n \u03B1 o \u03B2, azatioprina o plasmaf\xE9resis en algunos casos; rehabilitaci\xF3n f\xEDsica y control de esf\xEDnteres.",prevencion:"Tamizaje prenatal y evitar o acortar la lactancia en madres positivas; tamizaje en bancos de sangre; preservativo; no compartir agujas. Curso cr\xF3nico e irreversible. Per\xFA es end\xE9mico."},grafico:[["ini","patogenia","HTLV-1 por lactancia (linfocitos infectados en la leche)"],["pro","patogenia","Infecta linfocitos T CD4+ e integra su ADN (provirus)"],["dec","patogenia","\xBFEnferma despu\xE9s de a\xF1os?","La mayor\xEDa queda como portador asintom\xE1tico"],["pro","patogenia","CD4 infectados entran al SNC \u2192 respuesta citot\xF3xica \u2192 desmielinizaci\xF3n"],["pro","zona","M\xE9dula espinal: cordones laterales y anteriores"],["pro","sintomas","Paraparesia esp\xE1stica, hiperreflexia, Babinski, dolor lumbar, urgencia urinaria"],["pro","enfermedad","HAM/TSP (paraparesia esp\xE1stica tropical)"],["pro","diagnostico","ELISA anti-HTLV \u2192 Western blot (HTLV-1 vs 2) \u2192 PCR proviral"],["pro","tratamiento","No curativo: corticoides, interfer\xF3n, rehabilitaci\xF3n"],["fin","prevencion","Tamizaje prenatal, limitar lactancia, tamizaje en bancos de sangre \xB7 Curso cr\xF3nico e irreversible"]]},{id:"atll",area:"virus",tema:"HTLV",caso:"Var\xF3n de 55 a\xF1os, de padres de la costa norte del Per\xFA. Fiebre, adenopat\xEDas generalizadas, hepatoesplenomegalia y lesiones en la piel. Laboratorio: leucocitosis con linfocitos de n\xFAcleo multilobulado e hipercalcemia.",clave:{sintomas:"Fiebre, adenomegalias generalizadas, hepatomegalia, esplenomegalia, lesiones cut\xE1neas (p\xE1pulas, placas, n\xF3dulos), s\xEDntomas de hipercalcemia.",zona:"Linfocitos T CD4+ en sangre, ganglios, h\xEDgado, bazo, piel y hueso (oste\xF3lisis).",enfermedad:"Leucemia/linfoma de c\xE9lulas T del adulto (ATLL), forma aguda, por HTLV-1.",patogenia:"HTLV-1 adquirido (sobre todo por lactancia) infecta CD4+ y se integra. No destruye la c\xE9lula: Tax y HBZ estimulan la proliferaci\xF3n y evitan la apoptosis; con mutaciones acumuladas hay expansi\xF3n clonal y transformaci\xF3n maligna tras 20\u201340 a\xF1os (menos del 5 % de infectados). La hipercalcemia se debe a oste\xF3lisis por IL-1 y sustancia parecida a PTH.",diagnostico:"Sangre perif\xE9rica: c\xE9lulas en flor (n\xFAcleo multilobulado). Anticuerpos anti-HTLV-1 (ELISA, Western blot), alta carga proviral por PCR. Calcio elevado.",tratamiento:"Quimioterapia combinada (CHOP; en Jap\xF3n VCAP-AMP-VECP), zidovudina + interfer\xF3n \u03B1, trasplante de m\xE9dula \xF3sea en casos seleccionados.",prevencion:"Tamizaje prenatal y limitar la lactancia en madres positivas, tamizaje en bancos de sangre. Pron\xF3stico muy malo en la forma aguda (supervivencia menor de 1 a\xF1o); infecciones oportunistas por inmunosupresi\xF3n."},grafico:[["ini","patogenia","HTLV-1 (sobre todo por lactancia) infecta CD4+ y se integra"],["pro","patogenia","Tax y HBZ: estimulan proliferaci\xF3n y evitan apoptosis"],["dec","patogenia","\xBFMutaciones acumuladas tras 20\u201340 a\xF1os?","M\xE1s del 95 % queda como portador"],["pro","patogenia","Expansi\xF3n clonal \u2192 transformaci\xF3n maligna del CD4"],["pro","zona","Sangre, ganglios, h\xEDgado, bazo, piel y hueso"],["pro","sintomas","Fiebre, adenopat\xEDas, hepatoesplenomegalia, lesiones en la piel"],["pro","enfermedad","Leucemia/linfoma T del adulto (ATLL), forma aguda"],["pro","diagnostico","C\xE9lulas en flor + hipercalcemia + anti-HTLV-1 + carga proviral"],["pro","tratamiento","CHOP \xB7 zidovudina + interfer\xF3n \u03B1 \xB7 trasplante de m\xE9dula"],["fin","prevencion","Tamizaje prenatal y en bancos de sangre \xB7 Pron\xF3stico: menos de 1 a\xF1o"]]},{id:"sarampion",area:"virus",tema:"Dermatotr\xF3picos",caso:"Ni\xF1o de 3 a\xF1os sin vacunas. Fiebre alta, tos, coriza y conjuntivitis desde hace 3 d\xEDas; puntos blancos en la mucosa oral. Hoy aparece un exantema que empez\xF3 en la cara y est\xE1 bajando.",clave:{sintomas:"Pr\xF3dromo con fiebre alta, tos, coriza y conjuntivitis; manchas de Koplik; exantema m\xE1culo-papular que inicia en la cara y desciende, poco pruriginoso, con todas las lesiones en el mismo estadio.",zona:"V\xEDa respiratoria (entrada y replicaci\xF3n), mucosa oral y piel; puede comprometer pulm\xF3n y sistema nervioso.",enfermedad:"Sarampi\xF3n.",patogenia:"Paramyxovirus de ARN de sentido negativo (Baltimore V), trae su propia ARN polimerasa. Muy contagioso por v\xEDa respiratoria: replicaci\xF3n local, diseminaci\xF3n sist\xE9mica y tropismo por piel y mucosas. Forma c\xE9lulas gigantes multinucleadas.",diagnostico:"Cl\xEDnico (Koplik + exantema c\xE9falo-caudal). En casos dudosos o graves: PCR, serolog\xEDa IgM; en tejido, c\xE9lulas gigantes multinucleadas.",tratamiento:"Sintom\xE1tico.",prevencion:"Vacuna (triple viral). Inmunidad permanente tras la infecci\xF3n. Complicaciones: neumon\xEDa, encefalitis y panencefalitis esclerosante subaguda (SSPE)."},grafico:[["ini","patogenia","Ni\xF1o no vacunado inhala gotas respiratorias"],["pro","patogenia","Paramyxovirus ARN (\u2212): replica en v\xEDa respiratoria \u2192 diseminaci\xF3n"],["pro","zona","V\xEDa respiratoria, mucosa oral y piel"],["pro","sintomas","Fiebre alta, tos, coriza, conjuntivitis \u2192 Koplik \u2192 exantema de la cara hacia abajo"],["pro","enfermedad","Sarampi\xF3n"],["pro","diagnostico","Cl\xEDnico \xB7 PCR o IgM si hay duda \xB7 c\xE9lulas gigantes multinucleadas"],["pro","tratamiento","Sintom\xE1tico"],["fin","prevencion","Vacuna (triple viral) \xB7 Complicaciones: neumon\xEDa, encefalitis, SSPE"]]},{id:"varicela",area:"virus",tema:"Dermatotr\xF3picos",caso:"Ni\xF1a de 5 a\xF1os con fiebre leve y malestar. Al d\xEDa siguiente aparecen ves\xEDculas muy pruriginosas que empezaron en el tronco; hoy hay p\xE1pulas, ves\xEDculas y costras al mismo tiempo. Un compa\xF1ero del colegio tuvo algo parecido.",clave:{sintomas:"Pr\xF3dromo con fiebre leve y malestar; ves\xEDculas \xABgota de roc\xEDo\xBB muy pruriginosas, que empiezan en el tronco y se diseminan, en distintos estadios a la vez.",zona:"Piel y mucosas; entra por v\xEDa respiratoria.",enfermedad:"Varicela por virus varicela-z\xF3ster.",patogenia:"Herpesviridae, ADN doble cadena (Baltimore I), replica en el n\xFAcleo. Se transmite por v\xEDa respiratoria y por contacto con las lesiones; replicaci\xF3n local, viremia y llegada a la piel. Queda latente y puede reactivarse a\xF1os despu\xE9s como herpes z\xF3ster.",diagnostico:"Cl\xEDnico (lesiones en distintos estadios); en casos graves PCR o inmunofluorescencia.",tratamiento:"Aciclovir o valaciclovir (an\xE1logos de nucle\xF3sido activados por la timidina quinasa viral) y manejo del prurito.",prevencion:"Vacuna; aislamiento. Complicaciones: sobreinfecci\xF3n bacteriana de las lesiones, neumon\xEDa; reactivaci\xF3n como herpes z\xF3ster."},grafico:[["ini","patogenia","Contagio respiratorio o por contacto con las ves\xEDculas"],["pro","patogenia","Virus varicela-z\xF3ster (herpesvirus, ADN ds): viremia \u2192 piel; queda latente"],["pro","zona","Piel y mucosas"],["pro","sintomas","Ves\xEDculas pruriginosas desde el tronco, en distintos estadios"],["pro","enfermedad","Varicela"],["pro","diagnostico","Cl\xEDnico \xB7 PCR o inmunofluorescencia si es grave"],["pro","tratamiento","Aciclovir o valaciclovir + manejo del prurito"],["fin","prevencion","Vacuna \xB7 Sobreinfecci\xF3n, neumon\xEDa \xB7 Reactivaci\xF3n como herpes z\xF3ster"]]},{id:"rotavirus",area:"virus",tema:"Ent\xE9ricos",caso:"Lactante de 9 meses que va a guarder\xEDa. Diarrea acuosa abundante, v\xF3mitos y fiebre desde hace 2 d\xEDas. Est\xE1 irritable, con mucosas secas y llanto sin l\xE1grimas.",clave:{sintomas:"Diarrea acuosa, v\xF3mitos, fiebre, dolor abdominal y signos de deshidrataci\xF3n (mucosas secas, llanto sin l\xE1grimas).",zona:"Tracto gastrointestinal (intestino delgado).",enfermedad:"Gastroenteritis aguda por rotavirus, con deshidrataci\xF3n.",patogenia:"Reoviridae, ARN doble cadena (Baltimore III), sin envoltura: muy resistente en el ambiente. Transmisi\xF3n fecal-oral (agua, alimentos, superficies, contacto). Replicaci\xF3n local en el intestino (infecci\xF3n local, sin diseminaci\xF3n sist\xE9mica).",diagnostico:"Cl\xEDnico; prueba r\xE1pida de ant\xEDgeno o PCR en heces.",tratamiento:"Rehidrataci\xF3n oral o intravenosa; no se usan antibi\xF3ticos.",prevencion:"Vacuna contra el rotavirus, lavado de manos, agua y alimentos seguros. Complicaci\xF3n principal: deshidrataci\xF3n grave en lactantes."},grafico:[["ini","patogenia","Fecal-oral en la guarder\xEDa (manos, agua, superficies)"],["pro","patogenia","Reovirus ARN ds sin envoltura (muy resistente): replica en el intestino"],["pro","zona","Intestino delgado"],["pro","sintomas","Diarrea acuosa, v\xF3mitos, fiebre"],["pro","enfermedad","Gastroenteritis aguda por rotavirus"],["dec","diagnostico","\xBFSignos de deshidrataci\xF3n?","Hidrataci\xF3n oral y vigilancia"],["pro","diagnostico","Prueba r\xE1pida de ant\xEDgeno o PCR en heces"],["pro","tratamiento","Rehidrataci\xF3n oral o IV \xB7 sin antibi\xF3ticos"],["fin","prevencion","Vacuna contra rotavirus, lavado de manos \xB7 Complicaci\xF3n: deshidrataci\xF3n grave"]]},{id:"encefalitis-herpetica",area:"virus",tema:"Neurotr\xF3picos",caso:"Mujer de 35 a\xF1os con 3 d\xEDas de fiebre y cefalea; hoy est\xE1 confusa, con alteraciones de conducta y una convulsi\xF3n. El LCR muestra linfocitos y la resonancia, compromiso del l\xF3bulo temporal.",clave:{sintomas:"Fiebre, cefalea, confusi\xF3n, alteraci\xF3n de conducta, convulsiones.",zona:"Sistema nervioso central: l\xF3bulo temporal (enc\xE9falo).",enfermedad:"Encefalitis por virus herpes simple.",patogenia:"Herpesviridae, ADN doble cadena (Baltimore I). Neuroinvasi\xF3n (llega al SNC) y neurovirulencia (causa da\xF1o). Latencia y reactivaci\xF3n. Efecto citop\xE1tico con cuerpos de inclusi\xF3n de Cowdry.",diagnostico:"LCR con linfocitos (pensar viral); PCR en LCR es el gold standard; neuroimagen con compromiso temporal.",tratamiento:"Aciclovir intravenoso (an\xE1logo de nucle\xF3sido activado por la timidina quinasa viral), con hidrataci\xF3n y vigilancia de la funci\xF3n renal (puede precipitar en los t\xFAbulos), y soporte intensivo.",prevencion:"Inicio temprano del aciclovir. Complicaciones: secuelas neurol\xF3gicas, epilepsia, muerte; insuficiencia renal por aciclovir."},grafico:[["ini","patogenia","Virus herpes simple (latente) llega al SNC"],["pro","patogenia","Neuroinvasi\xF3n + neurovirulencia \xB7 inclusiones de Cowdry"],["pro","zona","Enc\xE9falo: l\xF3bulo temporal"],["pro","sintomas","Fiebre, cefalea, confusi\xF3n, alteraci\xF3n de conducta, convulsiones"],["pro","enfermedad","Encefalitis herp\xE9tica"],["dec","diagnostico","LCR: \xBFpredominan linfocitos?","Considerar otra causa"],["pro","diagnostico","Pensar viral \u2192 PCR en LCR (gold standard) + resonancia"],["pro","tratamiento","Aciclovir IV + hidrataci\xF3n (vigilar ri\xF1\xF3n) + soporte"],["fin","prevencion","Aciclovir temprano \xB7 Secuelas neurol\xF3gicas, epilepsia, muerte"]]},{id:"dengue",area:"virus",tema:"Hemorr\xE1gicos",caso:"Adolescente de 16 a\xF1os de Piura, en temporada de lluvias. Fiebre alta, cefalea, mialgias y malestar desde hace 4 d\xEDas; ahora tiene petequias, sangrado de enc\xEDas, dolor abdominal y presi\xF3n baja. Tuvo dengue hace 2 a\xF1os.",clave:{sintomas:"Fiebre alta de inicio agudo, cefalea, mialgias, malestar; luego petequias, equimosis, sangrados y signos de aumento de permeabilidad vascular; shock.",zona:"Endotelio vascular (sist\xE9mico), sangre (plaquetas), con compromiso de \xF3rganos por shock.",enfermedad:"Dengue grave (fiebre hemorr\xE1gica con shock) por una segunda infecci\xF3n con otro serotipo.",patogenia:"Flavivirus de ARN de sentido positivo (Baltimore IV), transmitido por mosquito. Da\xF1o endotelial y aumento de la permeabilidad vascular. El da\xF1o es sobre todo inmunopatol\xF3gico: en una segunda infecci\xF3n los anticuerpos no neutralizantes facilitan la entrada del virus a los monocitos (potenciaci\xF3n dependiente de anticuerpos).",diagnostico:"PCR (de elecci\xF3n en fase aguda), ant\xEDgeno NS1, serolog\xEDa IgM/IgG.",tratamiento:"Reposici\xF3n de l\xEDquidos, manejo del shock y soporte en UCI. No hay antiviral espec\xEDfico.",prevencion:"Control vectorial (mosquito), evitar picaduras. Complicaci\xF3n principal: shock; hemorragias graves, falla multiorg\xE1nica."},grafico:[["ini","patogenia","Picadura de mosquito: segunda infecci\xF3n, otro serotipo"],["pro","patogenia","Anticuerpos no neutralizantes facilitan la entrada a monocitos"],["pro","patogenia","Da\xF1o endotelial \u2192 aumenta la permeabilidad vascular"],["pro","zona","Endotelio vascular (todo el cuerpo) y plaquetas"],["pro","sintomas","Fiebre alta, cefalea, mialgias \u2192 petequias, sangrados, dolor abdominal, hipotensi\xF3n"],["pro","enfermedad","Dengue grave con shock"],["pro","diagnostico","PCR (fase aguda), ant\xEDgeno NS1, IgM/IgG"],["pro","tratamiento","Reposici\xF3n de l\xEDquidos, manejo del shock, UCI"],["fin","prevencion","Control vectorial \xB7 Complicaciones: shock, hemorragias, falla multiorg\xE1nica"]]},{id:"muguet",area:"hongos",tema:"Levaduras",caso:"Var\xF3n de 32 a\xF1os con VIH sin tratamiento. Desde hace una semana tiene ardor en la boca y placas blancas en la lengua y el paladar que se desprenden al rasparlas y dejan la base roja.",clave:{sintomas:"Placas blancas en lengua, paladar y mucosa oral que se desprenden y dejan base roja; ardor o dolor al comer.",zona:"Mucosa oral (orofaringe).",enfermedad:"Candidiasis oral (muguet) por Candida albicans, favorecida por la inmunosupresi\xF3n del VIH.",patogenia:"Candida albicans es una levadura de la flora normal. Con inmunosupresi\xF3n (VIH, CD4 bajos), antibi\xF3ticos o corticoides prolifera, forma pseudohifas y coloniza la mucosa formando las placas.",diagnostico:"Cl\xEDnico; examen directo (KOH o Gram): levaduras con pseudohifas. Cultivo en Sabouraud. Tubo germinal positivo a las 2\u20133 horas a 37 \xB0C; en agar harina de ma\xEDz, clamidoconidias (solo C. albicans).",tratamiento:"Nistatina oral en suspensi\xF3n; tratar la causa (iniciar TARV en el VIH).",prevencion:"Controlar la inmunosupresi\xF3n (TARV), evitar antibi\xF3ticos o corticoides innecesarios. Complicaciones: candidiasis esof\xE1gica (definitoria de SIDA) y diseminaci\xF3n."},grafico:[["ini","patogenia","Candida albicans: levadura de la flora normal"],["dec","patogenia","\xBFHay inmunosupresi\xF3n (VIH, CD4 bajos), antibi\xF3ticos o corticoides?","No \u2192 sigue como flora, sin enfermedad"],["pro","patogenia","Prolifera y forma pseudohifas en la mucosa"],["pro","zona","Mucosa oral (orofaringe)"],["pro","sintomas","Placas blancas que se desprenden y dejan base roja; ardor"],["pro","enfermedad","Candidiasis oral (muguet)"],["pro","diagnostico","Examen directo: levaduras + pseudohifas \xB7 Sabouraud \xB7 tubo germinal +"],["pro","tratamiento","Nistatina oral en suspensi\xF3n + tratar la causa (TARV)"],["fin","prevencion","Controlar la inmunosupresi\xF3n \xB7 Complicaci\xF3n: candidiasis esof\xE1gica (SIDA), diseminaci\xF3n"]]},{id:"candidemia",area:"hongos",tema:"Levaduras",caso:"Mujer de 60 a\xF1os en UCI con cat\xE9ter venoso central desde hace 2 semanas, recibiendo antibi\xF3ticos de amplio espectro. Tiene fiebre que no baja con los antibi\xF3ticos. En el hemocultivo crecen levaduras.",clave:{sintomas:"Fiebre persistente que no responde a antibi\xF3ticos; puede haber hipotensi\xF3n o shock.",zona:"Sangre (fungemia), a partir del cat\xE9ter venoso central; puede sembrar otros \xF3rganos.",enfermedad:"Candidemia asociada a cat\xE9ter (candidiasis invasiva).",patogenia:"Los antibi\xF3ticos de amplio espectro eliminan la flora bacteriana y Candida prolifera; el cat\xE9ter es la puerta de entrada y se cubre de levaduras, que pasan a la sangre.",diagnostico:"Hemocultivo con levaduras. Identificaci\xF3n: tubo germinal (positivo en C. albicans), agar harina de ma\xEDz (clamidoconidias). Importa la especie: C. glabrata tolera mal los azoles y C. krusei resiste el fluconazol.",tratamiento:"Equinocandina y retirar el cat\xE9ter.",prevencion:"Retirar cat\xE9teres que no se usan, usar antibi\xF3ticos solo cuando hacen falta. Complicaciones: siembra en otros \xF3rganos, shock, muerte. Si la levadura es Rhodotorula, las equinocandinas no sirven (anfotericina B)."},grafico:[["ini","patogenia","Antibi\xF3ticos de amplio espectro + cat\xE9ter venoso central"],["pro","patogenia","Candida prolifera y coloniza el cat\xE9ter \u2192 pasa a la sangre"],["pro","zona","Sangre (fungemia) desde el cat\xE9ter"],["pro","sintomas","Fiebre que no baja con antibi\xF3ticos"],["pro","enfermedad","Candidemia asociada a cat\xE9ter"],["pro","diagnostico","Hemocultivo: levaduras \u2192 identificar la especie (tubo germinal, harina de ma\xEDz)"],["dec","diagnostico","\xBFEs Candida?","Rhodotorula (rosada, tubo germinal \u2212) \u2192 retirar cat\xE9ter + anfotericina B"],["pro","tratamiento","Equinocandina + retirar el cat\xE9ter"],["fin","prevencion","Retirar cat\xE9teres innecesarios, uso racional de antibi\xF3ticos \xB7 Complicaciones: siembra en \xF3rganos, shock"]]},{id:"aspergilosis",area:"hongos",tema:"Mohos hialinos",caso:"Paciente de 45 a\xF1os con leucemia, neutrop\xE9nico tras quimioterapia. Fiebre persistente, tos y dolor tor\xE1cico. La TAC muestra un n\xF3dulo pulmonar con signo del halo y el galactomanano es positivo.",clave:{sintomas:"Fiebre persistente pese a antibi\xF3ticos, tos, dolor tor\xE1cico (puede haber hemoptisis).",zona:"Pulm\xF3n.",enfermedad:"Aspergilosis pulmonar invasiva por Aspergillus fumigatus.",patogenia:"Se inhalan los conidios del ambiente. En el neutrop\xE9nico no se eliminan: germinan en hifas hialinas septadas que invaden el tejido pulmonar.",diagnostico:"TAC con signo del halo; galactomanano positivo. Cultivo en Sabouraud: colonia blanca que se vuelve verde azulada; microscopio: hifas hialinas septadas con conidi\xF3foro, ves\xEDcula y fi\xE1lides uniseriadas (cabeza aspergilar). Crece hasta 50 \xB0C.",tratamiento:"Voriconazol.",prevencion:"Proteger al neutrop\xE9nico de la exposici\xF3n a conidios. Complicaciones: diseminaci\xF3n, hemoptisis, muerte. La resistencia a azoles se asocia a mutaciones en cyp51A; A. terreus resiste la anfotericina B."},grafico:[["ini","patogenia","Inhalaci\xF3n de conidios de Aspergillus fumigatus"],["dec","patogenia","\xBFEl paciente es neutrop\xE9nico?","No \u2192 los conidios se eliminan (en asm\xE1ticos: ABPA; en cavernas: aspergiloma)"],["pro","patogenia","Conidios germinan \u2192 hifas hialinas septadas que invaden el tejido"],["pro","zona","Pulm\xF3n"],["pro","sintomas","Fiebre persistente, tos, dolor tor\xE1cico"],["pro","enfermedad","Aspergilosis pulmonar invasiva"],["pro","diagnostico","TAC: signo del halo \xB7 galactomanano + \xB7 cultivo: cabeza aspergilar"],["pro","tratamiento","Voriconazol"],["fin","prevencion","Proteger al neutrop\xE9nico de los conidios \xB7 Complicaciones: diseminaci\xF3n, hemoptisis"]]},{id:"mucormicosis",area:"hongos",tema:"Mucorales",caso:"Var\xF3n de 58 a\xF1os con diabetes mal controlada, ingresa en cetoacidosis. Tiene dolor facial, congesti\xF3n nasal, fiebre y una escara negra en el paladar. En los d\xEDas siguientes aparece edema periorbitario.",clave:{sintomas:"Dolor facial, congesti\xF3n nasal, fiebre, escara negra en paladar o cornetes; luego compromiso de la \xF3rbita y alteraci\xF3n neurol\xF3gica.",zona:"Senos paranasales, paladar, \xF3rbita y cerebro (forma rinocerebral).",enfermedad:"Mucormicosis rinocerebral por Rhizopus (mucorales).",patogenia:"Se inhalan las esporas. La cetoacidosis libera hierro, que el hongo aprovecha (la deferoxamina tambi\xE9n le entrega hierro). Las hifas invaden y necrosan el tejido, por eso la escara negra.",diagnostico:"Biopsia o cultivo: hifas anchas no septadas en cinta, ramificadas en \xE1ngulo recto; en cultivo, colonia algodonosa blanca con puntos negros (esporangios) y rizoides. En la forma pulmonar, TAC con halo invertido.",tratamiento:"Anfotericina B liposomal + desbridamiento quir\xFArgico urgente + corregir la cetoacidosis.",prevencion:"Control de la diabetes. El voriconazol no cubre mucorales. Complicaciones: invasi\xF3n de \xF3rbita y cerebro, muerte."},grafico:[["ini","patogenia","Inhalaci\xF3n de esporas de Rhizopus"],["pro","patogenia","Cetoacidosis libera hierro \u2192 el hongo crece"],["pro","patogenia","Hifas anchas no septadas invaden y necrosan el tejido"],["pro","zona","Senos paranasales y paladar \u2192 \xF3rbita \u2192 cerebro"],["pro","sintomas","Dolor facial, congesti\xF3n, fiebre, escara negra en el paladar"],["pro","enfermedad","Mucormicosis rinocerebral"],["pro","diagnostico","Biopsia/cultivo: hifas anchas no septadas, esporangios y rizoides"],["dec","diagnostico","\xBFSon hifas anchas no septadas (mucoral)?","No \u2192 otro moho (p. ej. Aspergillus: voriconazol)"],["pro","tratamiento","Anfotericina B liposomal + desbridamiento urgente + corregir cetoacidosis (el voriconazol no cubre mucorales)"],["fin","prevencion","Control de la diabetes \xB7 Complicaciones: invasi\xF3n de \xF3rbita y cerebro, muerte"]]},{id:"queratitis-fusarium",area:"hongos",tema:"Mohos hialinos",caso:"Agricultor de 40 a\xF1os que sufri\xF3 un golpe en el ojo con una rama hace 10 d\xEDas. Tiene dolor, ojo rojo y visi\xF3n borrosa. En la c\xF3rnea hay una \xFAlcera de bordes plumosos con hipopi\xF3n.",clave:{sintomas:"Dolor ocular, ojo rojo, visi\xF3n borrosa; \xFAlcera corneal de bordes plumosos con hipopi\xF3n.",zona:"C\xF3rnea (ojo).",enfermedad:"Queratitis f\xFAngica por Fusarium.",patogenia:"Trauma vegetal (o lentes de contacto) que inocula el hongo del ambiente en la c\xF3rnea; las hifas hialinas septadas invaden el estroma.",diagnostico:"Raspado corneal: hifas hialinas septadas. Cultivo en Sabouraud: crecimiento r\xE1pido, colonia algodonosa blanca, rosada o p\xFArpura; microscopio: macroconidias en canoa o media luna, multiseptadas, de pared delgada y lisa.",tratamiento:"Natamicina t\xF3pica (alternativa: voriconazol).",prevencion:"Protecci\xF3n ocular en el campo, higiene de lentes de contacto. Complicaciones: perforaci\xF3n corneal, p\xE9rdida de visi\xF3n; en neutrop\xE9nicos, fusariosis diseminada (voriconazol con o sin anfotericina B)."},grafico:[["ini","patogenia","Trauma vegetal en el ojo (o lentes de contacto)"],["pro","patogenia","Inoculaci\xF3n de Fusarium \u2192 hifas invaden el estroma corneal"],["pro","zona","C\xF3rnea"],["pro","sintomas","Dolor, ojo rojo, visi\xF3n borrosa; \xFAlcera de bordes plumosos con hipopi\xF3n"],["pro","enfermedad","Queratitis por Fusarium"],["pro","diagnostico","Raspado corneal + Sabouraud: macroconidias en canoa, multiseptadas"],["pro","tratamiento","Natamicina t\xF3pica (alternativa: voriconazol)"],["fin","prevencion","Protecci\xF3n ocular \xB7 Complicaciones: perforaci\xF3n, p\xE9rdida de visi\xF3n; diseminada en neutrop\xE9nicos"]]},{id:"tinea-capitis",area:"hongos",tema:"Dermatofitos",caso:"Ni\xF1o de 7 a\xF1os que tiene un gato. Desde hace un mes tiene placas redondas sin pelo en el cuero cabelludo, con descamaci\xF3n y picaz\xF3n. Con la l\xE1mpara de Wood las placas brillan.",clave:{sintomas:"Placas de alopecia redondas con descamaci\xF3n y prurito; si se inflama mucho, querion.",zona:"Cuero cabelludo y pelo (piel queratinizada).",enfermedad:"Tinea capitis por Microsporum canis (dermatofito zoof\xEDlico).",patogenia:"Contagio desde el gato o perro (zoof\xEDlico). El dermatofito se alimenta de queratina e invade el pelo y la capa c\xF3rnea.",diagnostico:"L\xE1mpara de Wood positiva; examen directo con KOH del pelo; cultivo en Sabouraud: macroconidios en huso de pared gruesa y rugosa, con muchos tabiques.",tratamiento:"Griseofulvina oral (no basta el t\xF3pico en el cuero cabelludo); revisar y tratar a la mascota.",prevencion:"Tratar a la mascota, no compartir peines ni gorras. Complicaci\xF3n: querion, que no se trata solo con t\xF3pico ni se drena como absceso; alopecia cicatricial."},grafico:[["ini","patogenia","Contacto con gato o perro infectado"],["pro","patogenia","Microsporum canis (zoof\xEDlico) invade el pelo: se alimenta de queratina"],["pro","zona","Cuero cabelludo y pelo"],["pro","sintomas","Placas sin pelo, con descamaci\xF3n y picaz\xF3n"],["pro","enfermedad","Tinea capitis por Microsporum canis"],["pro","diagnostico","L\xE1mpara de Wood + \xB7 KOH \xB7 Sabouraud: macroconidios en huso, pared gruesa y rugosa"],["dec","tratamiento","\xBFCompromete el pelo?","No (solo piel) \u2192 puede bastar un antif\xFAngico t\xF3pico"],["pro","tratamiento","Griseofulvina oral (el t\xF3pico no basta) + revisar a la mascota"],["fin","prevencion","Tratar a la mascota, no compartir peines \xB7 Complicaci\xF3n: querion (no drenarlo)"]]},{id:"onicomicosis",area:"hongos",tema:"Dermatofitos",caso:"Mujer de 50 a\xF1os con pie de atleta cr\xF3nico. Las u\xF1as del dedo gordo de ambos pies est\xE1n engrosadas, amarillentas y se desmoronan. Usa calzado cerrado todo el d\xEDa.",clave:{sintomas:"U\xF1as engrosadas, amarillentas, quebradizas; descamaci\xF3n y picaz\xF3n entre los dedos (tinea pedis cr\xF3nica).",zona:"U\xF1as y piel de los pies.",enfermedad:"Onicomicosis y tinea pedis por Trichophyton rubrum.",patogenia:"Dermatofito antropof\xEDlico que se contagia en pisos h\xFAmedos (duchas, piscinas); invade la queratina de la piel y la u\xF1a, favorecido por humedad y calzado cerrado.",diagnostico:"KOH de la u\xF1a: hifas septadas; cultivo en Sabouraud: colonia blanca con reverso rojo vinoso; microscopio: hifas delgadas con pocos conidios, microconidios en l\xE1grima pegados a la hifa.",tratamiento:"Terbinafina oral por 12 semanas, m\xE1s tratamiento t\xF3pico en la piel.",prevencion:"Pies secos, calzado ventilado, sandalias en duchas p\xFAblicas. Complicaciones: recurrencia, dolor, sobreinfecci\xF3n bacteriana."},grafico:[["ini","patogenia","Contagio en pisos h\xFAmedos (duchas, piscinas)"],["pro","patogenia","Trichophyton rubrum invade la queratina (humedad + calzado cerrado)"],["pro","zona","Piel de los pies \u2192 u\xF1as"],["pro","sintomas","U\xF1as engrosadas y amarillas; descamaci\xF3n entre los dedos"],["pro","enfermedad","Onicomicosis + tinea pedis por T. rubrum"],["pro","diagnostico","KOH: hifas septadas \xB7 Sabouraud: reverso rojo vinoso"],["pro","tratamiento","Terbinafina oral 12 semanas + t\xF3pico en la piel"],["fin","prevencion","Pies secos, calzado ventilado \xB7 Complicaci\xF3n: recurrencia"]]},{id:"esporotricosis",area:"hongos",tema:"Dim\xF3rficos",caso:"Jardinero de 45 a\xF1os que se pinch\xF3 con un rosal hace un mes. En el dorso de la mano tiene un n\xF3dulo que se ulcer
