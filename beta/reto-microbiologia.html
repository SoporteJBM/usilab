\xF3n negra en o\xEDdo es A. niger; la resistencia a anfotericina, A. terreus."},{id:"hongos-032",nivel:"d",pregunta:"\xBFQu\xE9 diferencia microsc\xF3pica separa A. fumigatus de A. niger?",correcta:"A. fumigatus tiene fi\xE1lides uniseriadas; A. niger, cabeza aspergilar biseriada con conidios negros",distractores:["A. fumigatus no tiene ves\xEDcula","A. niger tiene hifas no septadas","A. fumigatus forma esporangios"],pista:"Cuenta las filas de fi\xE1lides.",explicacion:"Ambos tienen hifas hialinas septadas y ves\xEDcula."},{id:"hongos-033",nivel:"d",pregunta:"Rhodotorula en la pr\xE1ctica: \xBFc\xF3mo se ve al Gram y en el cultivo?",correcta:"Levadura Gram positiva ovoide; colonias cremosas y rosadas por pigmento carotenoide",distractores:["Bacilo Gram negativo con colonias mucoides","Moho con hifas cenoc\xEDticas y colonias negras","Levadura con colonias verde azuladas"],pista:"Su color viene de un pigmento.",explicacion:"Pr\xE1ctica 6: colonias de aspecto cremoso, color rosado, pigmento carotenoide."},{id:"hongos-034",nivel:"d",pregunta:"Hongo demati\xE1ceo con conidios grandes y marrones, con tabiques transversales y longitudinales (muriformes):",correcta:"Alternaria",distractores:["Cladosporium","Fusarium","Penicillium"],pista:"Los conidios tienen forma de maza con pico.",explicacion:"Cladosporium tambi\xE9n es marr\xF3n, pero sus conidios son peque\xF1os y en cadenas ramificadas."},{id:"hongos-035",nivel:"x",pregunta:"En la placa de Sabouraud del muestreo ambiental crece en pocos d\xEDas una colonia algodonosa blanca con puntos negros. Al microscopio: hifas anchas casi sin tabiques. \xBFQu\xE9 es y qu\xE9 importancia cl\xEDnica tiene?",correcta:"Rhizopus: en un diab\xE9tico con cetoacidosis puede causar mucormicosis rinocerebral",distractores:["Aspergillus niger: otitis con secreci\xF3n negra","Penicillium: pat\xF3geno invasivo frecuente","Fusarium: queratitis por trauma vegetal","Rhodotorula: fungemia por cat\xE9ter"],explicacion:"Los puntos negros son los es \u2022 Gram positivas: pared gruesa; Gram negativas: pared delgada con membrana externa.
\u2022 Resistencia: mecA (MRSA), D-Ala-D-Lac (enterococo resistente a vancomicina), BLEE, AmpC, KPC.
\u2022 Proteus: ureasa +++, H\u2082S +, swarming. Klebsiella: mucoide, inm\xF3vil.`,preguntas:[{id:"bacterias-001",nivel:"f",pregunta:"\xBFPor qu\xE9 una bacteria Gram negativa se decolora con alcohol-acetona?",correcta:"Su pared delgada y su membrana externa no retienen el cristal violeta",distractores:["Tiene c\xE1psula gruesa","Tiene flagelos","Carece de ribosomas"],pista:"Piensa en el peptidoglicano.",explicacion:"Por eso toma el color de la safranina."},{id:"bacterias-002",nivel:"m",pregunta:"\xBFQu\xE9 gen confiere resistencia a meticilina en Staphylococcus aureus?",correcta:"mecA",distractores:["vanA","tetM","gyrA"],pista:"Codifica una PBP alterada.",explicacion:"mecA codifica PBP2a, a la que los \u03B2-lact\xE1micos casi no se unen."},{id:"bacterias-003",nivel:"f",pregunta:"\xBFCu\xE1l es el blanco de los \u03B2-lact\xE1micos?",correcta:"Las transpeptidasas (PBP)",distractores:["La membrana citoplasm\xE1tica","El ribosoma 30S","La ADN girasa"],pista:"Cierran las cadenas de peptidoglicano.",explicacion:"Sin transpeptidasas, la pared no se arma."},{id:"bacterias-004",nivel:"d",pregunta:"\xBFC\xF3mo se vuelve resistente Enterococcus a la vancomicina?",correcta:"Cambia D-Ala-D-Ala por D-Ala-D-Lac",distractores:["Bomba de expulsi\xF3n","Enzima que degrada el antibi\xF3tico","Membrana impermeable"],pista:"El cambio est\xE1 en el sitio de uni\xF3n.",explicacion:"D-Ala-D-Lac tiene mucha menor afinidad por la vancomicina."},{id:"bacterias-005",nivel:"f",pregunta:"S. aureus sin halo alrededor de oxacilina y con halo grande en vancomicina. \xBFQu\xE9 es y c\xF3mo se trata?",correcta:"MRSA; vancomicina",distractores:["MSSA; oxacilina","MRSA; amoxicilina","BLEE; meropenem"],pista:"Resistente a oxacilina = resistente a todos los \u03B2-lact\xE1micos.",explicacion:"Oxacilina resistente indica MRSA."},{id:"bacterias-006",nivel:"f",pregunta:"Orina con pH 8.5, olor amoniacal y cristales de estruvita. Bacteria sospechosa:",correcta:"Proteus mirabilis",distractores:["Escherichia coli","Enterococcus","Klebsiella"],pista:"Tiene ureasa muy activa.",explicacion:"La ureasa alcaliniza la orina y precipita estruvita."},{id:"bacterias-007",nivel:"m",pregunta:"Bacilo Gram negativo lactosa negativo, H\u2082S +, indol \u2212, ureasa +++ y swarming en agar sangre:",correcta:"Proteus mirabilis",distractores:["Escherichia coli","Klebsiella pneumoniae","Morganella morganii"],pista:"El swarming es la clave.",explicacion:"Morganella es H\u2082S \u2212 e indol +."},{id:"bacterias-008",nivel:"m",pregunta:"Colonia rosada muy mucoide en MacConkey, indol \u2212, citrato + e inm\xF3vil:",correcta:"Klebsiella pneumoniae",distractores:["Escherichia coli","Proteus mirabilis","Salmonella"],pista:"Lo mucoide viene de la c\xE1psula.",explicacion:"Fermenta lactosa (rosada) y es inm\xF3vil."},{id:"bacterias-009",nivel:"f",pregunta:"Nitritos positivos en la tira reactiva de orina indican:",correcta:"Bacterias Gram negativas que reducen nitratos",distractores:["Hematuria","Diabetes","Deshidrataci\xF3n"],pista:"Es una enzima bacteriana.",explicacion:"E. coli y otras enterobacterias tienen nitrato reductasa."},{id:"bacterias-010",nivel:"f",pregunta:"En la tinci\xF3n de Ziehl-Neelsen, los BAAR se ven:",correcta:"Rojos sobre fondo azul",distractores:["Azules sobre fondo rojo","Morados","Verdes"],pista:"Retienen el primer colorante.",explicacion:"Los \xE1cidos mic\xF3licos retienen la fucsina; el contraste es azul de metileno."},{id:"bacterias-011",nivel:"d",pregunta:"Factor de virulencia de S. pyogenes que evita la fagocitosis uni\xE9ndose al factor H y al fibrin\xF3geno:",correcta:"Prote\xEDna M",distractores:["Estreptolisina O","Estreptoquinasa","Toxina eritrog\xE9nica"],pista:"Es una prote\xEDna de superficie.",explicacion:"Impide el dep\xF3sito de C3b sobre la bacteria."},{id:"bacterias-012",nivel:"f",pregunta:"Causa m\xE1s frecuente de pielonefritis aguda:",correcta:"Bacilos ent\xE9ricos Gram negativos",distractores:["Estafilococos","Estreptococos","Enterococos"],pista:"Piensa en E. coli.",explicacion:"E. coli asciende desde la vejiga."},{id:"bacterias-013",nivel:"f",pregunta:"\xBFQu\xE9 prueba separa Staphylococcus de Streptococcus?",correcta:"Catalasa",distractores:["Coagulasa","Oxidasa","Ureasa"],pista:"Burbujas con agua oxigenada.",explicacion:"Staphylococcus es catalasa positivo; Streptococcus, negativo."},{id:"bacterias-014",nivel:"m",pregunta:"\xBFQu\xE9 prueba separa S. aureus de los dem\xE1s estafilococos?",correcta:"Coagulasa",distractores:["Catalasa","Oxidasa","Indol"],pista:"Coagula el plasma.",explicacion:"S. aureus es coagulasa positivo; S. epidermidis, negativo."},{id:"bacterias-015",nivel:"d",pregunta:"Enterococcus es naturalmente resistente a:",correcta:"Cefalosporinas",distractores:["Ampicilina","Vancomicina","Linezolid"],pista:"Es una resistencia intr\xEDnseca, no adquirida.",explicacion:"Por eso nunca se trata un enterococo con cefalosporinas."},{id:"bacterias-016",nivel:"d",pregunta:"\xBFPor qu\xE9 una ITU por Proteus mirabilis no se trata con nitrofuranto\xEDna?",correcta:"Tiene resistencia natural a la nitrofuranto\xEDna",distractores:["La nitrofuranto\xEDna no llega a la orina","Proteus es Gram positivo","La orina alcalina activa el f\xE1rmaco"],pista:"Es intr\xEDnseca.",explicacion:"Adem\xE1s, la orina alcalina por la ureasa reduce su actividad."},{id:"bacterias-017",nivel:"d",pregunta:"En el laboratorio, adem\xE1s de la oxacilina, \xBFqu\xE9 disco se usa para detectar MRSA?",correcta:"Cefoxitina",distractores:["Vancomicina","Bacitracina","Optoquina"],pista:"Es una cefamicina.",explicacion:"La cefoxitina es mejor inductor de mecA y da resultados m\xE1s claros."},{id:"bacterias-018",nivel:"d",pregunta:"Bacilo Gram negativo no fermentador, oxidasa positivo, con pigmento verde-azulado y olor a uvas:",correcta:"Pseudomonas aeruginosa",distractores:["Klebsiella pneumoniae","Proteus mirabilis","Escherichia coli"],pista:"Es t\xEDpico de quemados y pacientes en UCI.",explicacion:"El pigmento es la piocianina."},{i aphylococcus aureus","Streptococcus pyogenes"],explicacion:"Viridans tambi\xE9n da hem\xF3lisis alfa, pero es resistente a la optoquina."},{id:"bacterias-024",nivel:"f",pregunta:"Colonia rosada, plana y seca en MacConkey, indol positivo:",correcta:"Escherichia coli",distractores:["Klebsiella pneumoniae","Proteus mirabilis","Salmonella"],pista:"Fermenta lactosa y no es mucoide.",explicacion:"Klebsiella tambi\xE9n es rosada, pero muy mucoide e indol negativo."},{id:"bacterias-025",nivel:"m",pregunta:"En el Per\xFA, \xBFqu\xE9 especie de Shigella es la m\xE1s frecuente?",correcta:"Shigella flexneri",distractores:["Shigella sonnei","Shigella dysenteriae","Shigella boydii"],pista:"Est\xE1 en la lista de pat\xF3genos del coprocultivo.",explicacion:"Pr\xE1ctica 4: pat\xF3genos m\xE1s frecuentes en Per\xFA."},{id:"bacterias-026",nivel:"m",pregunta:"\xBFQu\xE9 examen se usa para seguir a un portador cr\xF3nico de Salmonella Typhi?",correcta:"Coprocultivo",distractores:["Urocultivo","Examen completo de orina","Coprol\xF3gico directo"],pista:"Hay que aislar la bacteria de las heces.",explicacion:"Pr\xE1ctica 4: el seguimiento de portadores cr\xF3nicos es una indicaci\xF3n del coprocultivo."},{id:"bacterias-027",nivel:"m",pregunta:"\xBFPor qu\xE9 Klebsiella pneumoniae se ve muy mucoide en MacConkey?",correcta:"Por su c\xE1psula",distractores:["Porque produce H\u2082S","Porque hace swarming","Porque no fermenta lactosa"],pista:"Es una estructura de superficie.",explicacion:"La c\xE1psula tambi\xE9n la hace m\xE1s resistente a la fagocitosis."},{id:"bacterias-028",nivel:"d",pregunta:"Bacteria del coprocultivo que necesita microaerofilia y hasta 72 horas de incubaci\xF3n:",correcta:"Campylobacter jejuni",distractores:["Salmonella","Shigella","Escherichia coli"],pista:"Tiene su propio agar.",explicacion:"Pr\xE1ctica 4: agar Campylobacter en microaerofilia; el resto se lee a las 24\u201348 h."},{id:"bacterias-029",nivel:"d",pregunta:"Bacilo Gram negativo H\u2082S negativo, indol positivo y ureasa positiva:",correcta:"Morganella morganii",distractores:["Proteus mirabilis","Klebsiella pneumoniae","Salmonella"],pista:"Es lo contrario de Proteus en H\u2082S e indol.",explicacion:"Proteus mirabilis es H\u2082S positivo e indol negativo."},{id:"bacterias-030",nivel:"d",pregunta:"Colonias rugosas, secas, color crema 'en coliflor', que aparecen reci\xE9n en la cuarta semana en L\xF6wenstein-Jensen:",correcta:"Mycobacterium tuberculosis",distractores:["Klebsiella pneumoniae","Candida albicans","Proteus mirabilis"],pista:"Se replica cada 18 a 24 horas.",explicacion:"Por eso el cultivo tarda de 3 a 8 semanas."},{id:"bacterias-031",nivel:"d",pregunta:"Orina de color verde en un paciente con sonda sugiere infecci\xF3n por:",correcta:"Pseudomonas aeruginosa",distractores:["Escherichia coli","Proteus mirabilis","Klebsiella pneumoniae"],pista:"Est\xE1 en la tabla de colores de orina.",explicacion:"Pr\xE1ctica 4: orina verde por Pseudomonas o f\xEDstula intestinal; tambi\xE9n por azul de metileno."},{id:"bacterias-032",nivel:"x",pregunta:"Manipulador de alimentos con fiebre prolongada. Coprocultivo: colonias lactosa negativas en MacConkey y rojas con centro negro en XLD. \xBFQu\xE9 es y qu\xE9 implica?",correcta:"Salmonella: hay que descartar portador cr\xF3nico de S. Typhi con coprocultivos de seguimiento",distractores:["Shigella: no requiere seguimiento","E. coli: es flora normal","Campylobacter: repetir en microaerofilia","Proteus: contaminaci\xF3n con orina"],explicacion:"El centro negro es H\u2082S; Shigella sale roja sin centro negro."},{id:"bacterias-033",nivel:"x",pregunta:"S. aureus resistente a oxacilina. \xBFQu\xE9 otro \u03B2-lact\xE1mico sirve?",correcta:"Ninguno: MRSA es resistente a todos los \u03B2-lact\xE1micos",distractores:["Ceftriaxona","Amoxicilina-clavul\xE1nico","Meropenem"],explicacion:"Banco de laboratorio: oxacilina resistente = MRSA = resistente a todos los \u03B2-lact\xE1micos; se usa vancomicina."},{id:"bacterias-034",nivel:"x",pregunta:"ITU en paciente con sonda: bacilo con swarming, TSI K/A con H\u2082S, indol negativo y ureasa +++. \xBFPor qu\xE9 importa identificarlo?",correcta:"Es Proteus mirabilis: forma c\xE1lculos de estruvita, obliga a cambiar la sonda y no responde a nitrofuranto\xEDna",distractores:["Es E. coli: basta con nitrofuranto\xEDna","Es Klebsiella: requiere carbapen\xE9mico siempre","Es Morganella: no causa ITU","Es contaminaci\xF3n: no se trata"],explicacion:"La ureasa alcaliniza la orina y precipita estruvita sobre la sonda."},{id:"bacterias-035",nivel:"x",pregunta:"K. pneumoniae resistente a ceftriaxona, con sinergia hacia amoxicilina-clavul\xE1nico y sensible a meropenem, en una neumon\xEDa grave. \xBFTratamiento?",correcta:"Meropenem: es productora de BLEE",distractores:["Ceftriaxona a dosis alta","Amoxicilina-clavul\xE1nico","Ciprofloxacino sin antibiograma","Vancomicina"],explicacion:"La sinergia con clavul\xE1nico marca BLEE; en infecci\xF3n grave, carbapen\xE9mico."},{id:"bacterias-036",nivel:"x",pregunta:"K. pneumoniae en UCI sin halo en ning\xFAn disco, ni siquiera imipenem ni meropenem. \xBFMecanismo y manejo?",correcta:"Carbapenemasa (KPC): ceftazidima-avibactam o colistina, con infectolog\xEDa",distractores:["BLEE: meropenem","AmpC: cefepime","Contaminaci\xF3n: no tratar","MRSA: vancomicina"],explicacion:"Banco de laboratorio, caso C19."}]};var Bi={id:"virus",nombre:"Virus",descripcion:"Estructura, cuadros t\xEDpicos y tratamiento",resumen:`Ideas clave:
\u2022 Virus con envoltura: sensibles a alcohol y detergentes.
\u2022 Retrovirus: transcriptasa reversa; VIH usa CD4.
\u2022 Mano-pie-boca: Coxsackie. Bronquiolitis obliterante: adenovirus.
\u2022 Rub\xE9ola: sin antiviral; se previene con vacuna.

Teor\xEDa 10 \xB7 Introducci\xF3n a los virus:
\u2022 Ivanovsky (1892): el \xABagente filtrable\xBB del tabaco atravesaba filtros que retienen bacterias.
\u2022 Fuera de la c\xE9lula el viri\xF3n es metab\xF3licamente inerte: solo se multiplica dentro de una c\xE9lula.
\u2022 Nucleoc\xE1pside = c\xE1pside + genoma. Desnudos (solo c\xE1pside): resisten \xE1cido, detergentes, desecaci\xF3n y calor; salen por lisis. Envueltos: sensibles a \xE1cido, detergentes, desecaci\xF3n y calor; salen por gemaci\xF3n.
\u2022 Baltimore: I ADN ds (herpes, adeno, VPH) \xB7 II ADN ss \xB7 III ARN ds (rotavirus) \xB7 IV ARN + (picorna, flavi, corona) \xB7 V ARN \u2212 (influenza, rabia, sarampi\xF3n, VSR) \xB7 VI ARN con transcriptasa inversa (retrovirus) \xB7 VII ADN ds con transcriptasa inversa (VHB).
\u2022 ARN \u2212 siempre trae su propia ARN polimerasa. ARN + funciona directo como ARNm. Virus ADN replican en el n\xFAcleo, mutan menos y pueden hacer latencia.
\u2022 Curva de crecimiento: infecci\xF3n \u2192 eclipse (sin viriones completos detectables) \u2192 ensamblaje \u2192 liberaci\xF3n \u2192 meseta. Burst size = viriones liberados por c\xE9lula.
\u2022 Oncog\xE9nicos: VPH, EBV, VHB, VHC, HHV-8 (Kaposi), poliomavirus de Merkel, HTLV-1. Quitan los \xABfrenos\xBB p53 y Rb.
\u2022 Diagn\xF3stico: PCR / RT-PCR es el gold standard. Western blot confirma VIH. IgM = infecci\xF3n aguda; IgG = pasada o inmunidad. Carga viral para monitorear VIH, VHB y VHC.
\u2022 Pensar en virus: fiebre + mialgias + s\xEDntomas respiratorios + leucopenia con linfocitosis, sin pus y sin respuesta a antibi\xF3ticos.

Teor\xEDa 11 \xB7 VIH, HTLV y VPH:
\u2022 VIH: lentivirus, 2 copias de ARN +, envuelto. gp120 se une a CD4; correceptor CCR5 (inicio) o CXCR4 (avanzado); gp41 fusiona. p24 = c\xE1pside.
\u2022 Transmisi\xF3n: sexual (principal), sangre, vertical (m\xE1s en el parto). S\xED: sangre, semen, secreciones vaginales, leche. No: saliva, sudor, l\xE1grimas, orina.
\u2022 Fases: s\xEDndrome retroviral agudo (2\u20134 sem, p24+, anticuerpos a\xFAn no) \u2192 latencia cl\xEDnica (8\u201310 a\xF1os) \u2192 sintom\xE1tica (CD4 200\u2013500) \u2192 SIDA (CD4 < 200 o enfermedad definitoria).
\u2022 Diagn\xF3stico: tamizaje con ELISA 4.\xAA gen o prueba r\xE1pida \u2192 segunda prueba distinta \u2192 confirmaci\xF3n con LIA o RT-qPCR. WB positivo = 2 bandas de envoltura (gp120/160 + gp41); solo p24 no confirma. Neonato: PCR a las 2 sem, 1 mes y 4\u20136 meses.
\u2022 TARV MINSA: TDF + 3TC + DTG (TLD) de primera l\xEDnea, tambi\xE9n en gestantes y en coinfecci\xF3n con VHB. Con TB: TDF + 3TC + EFV. Falla renal: ABC + 3TC + DTG.
\u2022 HTLV-1: deltaretrovirus, infecta CD4 (HTLV-2: CD8). Se transmite por c\xE9lulas infectadas, sobre todo lactancia. Per\xFA es end\xE9mico. Causa ATLL (c\xE9lulas en flor, hipercalcemia) y HAM/TSP (paraparesia esp\xE1stica).
\u2022 VPH: ADN ds, no envuelto. E6 degrada p53; E7 inactiva Rb. Alto riesgo 16 y 18; bajo riesgo 6 y 11 (verrugas). Coilocitos. Gold standard de tamizaje: co-test (Papanicolaou + PCR de VPH) de 30 a 65 a\xF1os. Vacuna MINSA tetravalente (6, 11, 16, 18) a los 9\u201313 a\xF1os, 2 dosis.`,preguntas:[{id:"virus-001",nivel:"m",pregunta:"Lactante con fiebre y ves\xEDculas en lengua, paladar, palmas y plantas. Agente:",correcta:"Coxsackie",distractores:["Adenovirus","Herpes virus","Virus sincitial respiratorio"],pista:"Enfermedad mano-pie-boca.",explicacion:"Es un enterovirus."},{id:"virus-002",nivel:"d",pregunta:"La bronquiolitis obliterante es t\xEDpica de:",correcta:"Adenovirus",distractores:["Virus sincitial respiratorio","Rinovirus","Influenza"],pista:"Tambi\xE9n causa conjuntivitis y faringitis.",explicacion:"El adenovirus puede dejar da\xF1o bronquiolar permanente."},{id:"virus-003",nivel:"m",pregunta:"Agente del condiloma acuminado:",correcta:"Virus del papiloma humano (papovavirus)",distractores:["Chlamydia trachomatis","Gardnerella vaginalis","Herpes virus 2"],pista:"Es un virus de ADN.",explicacion:"Los tipos 6 y 11 causan verrugas genitales."},{id:"virus-004",nivel:"d",pregunta:"Sobre el VIH, es FALSO que:",correcta:"Se une al receptor CD5",distractores:["Es linfotropo","Su genoma es ARN","Es un lentivirus"],pista:"Revisa el receptor.",explicacion:"El receptor es CD4, con CCR5 o CXCR4 como correceptor."},{id:"virus-005",nivel:"m",pregunta:"El s\xEDndrome TORCH incluye:",correcta:"Toxoplasma, rub\xE9ola, citomegalovirus, herpes y otros como s\xEDfilis",distractores:["S\xEDfilis, gonorrea y chancro blando","Rub\xE9ola, citomegalovirus y gonorrea","Toxoplasma, VIH e influenza"],pista:"La O es 'otros'.",explicacion:"Son infecciones que pasan de la madre al feto."},{id:"virus-006",nivel:"m",pregunta:"Encefalitis herp\xE9tica tratada con aciclovir. \xBFQu\xE9 efecto adverso hay que vigilar?",correcta:"Insuficiencia renal",distractores:["Erupci\xF3n cut\xE1nea","Insuficiencia hep\xE1tica","Inmunosupresi\xF3n"],pista:"Precipita en los t\xFAbulos.",explicacion:"Por eso se hidrata bien al paciente."},{id:"virus-007",nivel:"f",pregunta:"Antiviral de elecci\xF3n para la influenza:",correcta:"Oseltamivir",distractores:["Aciclovir","Zidovudina","Ganciclovir"],pista:"Inhibe la neuraminidasa.",explicacion:"Funciona mejor en las primeras 48 horas."},{id:"virus-008",nivel:"f",pregunta:"\xBFPuede un virus reproducirse fuera de una c\xE9lula?",correcta:"No: es un par\xE1sito intracelular obligado",distractores:["S\xED, en cualquier medio de cultivo","S\xED, si tiene envoltura","Solo los virus de ADN"],pista:"No tiene ribosomas propios.",explicacion:"Usa la maquinaria de la c\xE9lula hu\xE9sped."},{id:"virus-009",nivel:"f",pregunta:"\xBFQu\xE9 vacuna previene la rub\xE9ola?",correcta:"Triple viral (sarampi\xF3n, paperas y rub\xE9ola)",distractores:["BCG","Pentavalente","DPT"],pista:"Protege contra tres virus.",explicacion:"Es la prevenci\xF3n principal del s\xEDndrome de rub\xE9ola cong\xE9nita."},{id:"virus-010",nivel:"m",pregunta:"Agente m\xE1s frecuente de bronquiolitis en lactantes:",correcta:"Virus sincitial respiratorio",distractores:["Adenovirus","Rinovirus","Coxsackie"],pista:"Su nombre viene de las c\xE9lulas gigantes que forma.",explicacion:"Causa la mayor\xEDa de bronquiolitis en menores de 2 a\xF1os."},{id:"virus-011",nivel:"d",pregunta:"Antiviral an\xE1logo de nucle\xF3sido que necesita la timidina quinasa viral para activarse:",correcta:"Aciclovir",distractores:["Oseltamivir","Amantadina","Zidovudina"],pista:"Se usa en herpes.",explicacion:"Solo se activa en c\xE9lulas infectadas, por eso es selectivo."},{id:"virus-012",nivel:"d",pregunta:"\xBFA qu\xE9 g\xE9nero pertenece el virus del dengue?",correcta:"Flavivirus",distractores:["Alfavirus","Bunyavirus","Arenavirus"],pista:"Comparte g\xE9nero con la fiebre amarilla.",explicacion:"El chikungunya, en cambio, es un alfavirus."},{id:"virus-013",nivel:"d",pregunta:"\xBFQu\xE9 corre ir, ledipasvir, daclatasvir, glecaprevir/pibrentasvir. Hepatitis B: tenofovir, entecavir, lamivudina, IFN-\u03B1."},{id:"virus-104",nivel:"m",pregunta:"\xBFQu\xE9 ventaja tiene el LIA frente al Western blot para confirmar VIH?",correcta:"Es m\xE1s estandarizado y automatizable",distractores:["Detecta el virus antes que la PCR","No necesita suero del paciente","Se lee con microscopio de fluorescencia"],pista:"Usa prote\xEDnas recombinantes en l\xEDneas.",explicacion:"El LIA usa prote\xEDnas recombinantes fijas en l\xEDneas, es r\xE1pido y reproducible: es la confirmatoria recomendada. El WB est\xE1 obsoleto en varios pa\xEDses."},{id:"virus-105",nivel:"d",caso:"Paciente de 40 a\xF1os con fiebre, cefalea, confusi\xF3n y convulsiones. El LCR tiene linfocitos y la resonancia muestra compromiso del l\xF3bulo temporal.",pregunta:"\xBFQu\xE9 virus sospechas y qu\xE9 examen lo confirma?",correcta:"Herpes simple; PCR en LCR",distractores:["Rabia; cultivo de LCR","Poliovirus; hemocultivo","VIH; Western blot"],explicacion:"Encefalitis temporal = herpes simple. LCR con linfocitos orienta a virus y la PCR en LCR es el gold standard. Se trata con aciclovir."},{id:"virus-106",nivel:"d",caso:"Var\xF3n de 50 a\xF1os de la costa norte del Per\xFA con HTLV-1: linfocitosis con c\xE9lulas de n\xFAcleo multilobulado, adenopat\xEDas generalizadas, hepatoesplenomegalia, lesiones en la piel e hipercalcemia.",pregunta:"\xBFQu\xE9 forma de ATLL es?",correcta:"Aguda",distractores:["Indolente","Cr\xF3nica","Linfomatosa"],explicacion:"Forma aguda: leucocitosis con c\xE9lulas en flor, compromiso sist\xE9mico e hipercalcemia; pron\xF3stico muy malo. La cr\xF3nica no tiene hipercalcemia; la indolente solo afecta piel o pulm\xF3n; la linfomatosa tiene adenopat\xEDas sin c\xE9lulas tumorales en sangre."},{id:"virus-107",nivel:"d",caso:"Paciente con VIH en TARV con buena adherencia. La carga viral, que estaba indetectable, sube y se mantiene alta en dos controles.",pregunta:"Seg\xFAn el MINSA, \xBFqu\ \xF1os. Antes de los 30, las infecciones transitorias son muy frecuentes; solo cerca del 10 % persiste m\xE1s de 12\u201324 meses."}]};var Fi={id:"parasitos",nombre:"Par\xE1sitos",descripcion:"Coprol\xF3gico, protozoos, helmintos, vectores y ar\xE1cnidos",resumen:`Lo que se vio en la Pr\xE1ctica 4:

masas dan halos 'sensibles' y aun as\xED fallan en el tratamiento."},{id:"laboratorio-025",nivel:"x",pregunta:"Escala de baciloscop\xEDa: ++ son 1 a 10 BAAR por campo en 50 campos. \xBFQu\xE9 es +++?",correcta:"M\xE1s de 10 BAAR por campo en 20 campos",distractores:["M\xE1s de 10 BAAR por campo en 50 campos","1 a 9 BAAR en 100 campos","M\xE1s de 100 BAAR en 100 campos","Cualquier n\xFAmero en 10 campos"],explicacion:"Con tantos bacilos, basta revisar menos campos."},{id:"laboratorio-026",nivel:"x",pregunta:"En agar XLD, un bacilo da colonias amarillas. \xBFPor qu\xE9 no es Salmonella ni Shigella?",correcta:"El amarillo indica fermentaci\xF3n con acidez sostenida; Shigella no fermenta xilosa y Salmonella termina alcalinizando (rojo)",distractores:["El amarillo indica producci\xF3n de H\u2082S","Ambas siempre dan colonias amarillas","XLD no permite crecer a ninguna de las dos","El amarillo indica swarming"],explicacion:"Salmonella fermenta xilosa pero descarboxila lisina y vira a rojo, con centro negro por H\u2082S."},{id:"laboratorio-027",nivel:"d",pregunta:"Orina alcalina con cristales en 'tapa de ata\xFAd' y nitritos positivos. \xBFQu\xE9 cristal y qu\xE9 germen sospechas?",correcta:"Fosfato am\xF3nico magn\xE9sico (estruvita) por Proteus mirabilis",distractores:["Oxalato de calcio por dieta rica en oxalato","\xC1cido \xFArico por gota","Cistina por cistinuria"],pista:"Depende del pH y de una enzima bacteriana.",explicacion:"Pr\xE1ctica 4: tabla de cristales en orina."},{id:"laboratorio-028",nivel:"d",pregunta:"Orina anaranjada en un paciente que recibe tratamiento para tuberculosis. Causa m\xE1s probable:",correcta:"Rifampicina",distractores:["Hematuria","Proteinuria","Infecci\xF3n por Pseudomonas"],pista:"Es un f\xE1rmaco del esquema HRZE.",explicacion:"Pr\xE1ctica 4: tabla de colores de orina."},{id:"laboratorio-029",nivel:"x",pregunta:"Urocultivo de un paciente con sonda: la orina se tom\xF3 de la bolsa colectora. \xBFQu\xE9 haces?",correcta:"Rechazarla: en sondas se toma por punci\xF3n del tubo de drenaje, nunca de la bolsa",distractores:["Procesarla normalmente","Procesarla y bajar el punto de corte","Usar la orina del ECO","Sembrarla solo en agar sangre"],explicacion:"Pr\xE1ctica 4: toma de muestra del urocultivo."},{id:"laboratorio-030",nivel:"x",pregunta:"Urocultivo con tres tipos de colonias distintas y recuento bajo. \xBFInterpretaci\xF3n?",correcta:"Contaminaci\xF3n: repetir con orina de chorro medio e higiene previa",distractores:["Infecci\xF3n mixta grave","Pielonefritis","Bacteriuria significativa","Infecci\xF3n por hongos"],explicacion:"Pr\xE1ctica 4: el crecimiento polimicrobiano o escaso sugiere contaminaci\xF3n."},{id:"laboratorio-031",nivel:"x",pregunta:"Urocultivo negativo en un paciente con s\xEDntomas urinarios. \xBFQu\xE9 descarta?",correcta:"Solo la infecci\xF3n bacteriana: no descarta infecci\xF3n viral o mic\xF3tica",distractores:["Toda infecci\xF3n urinaria","Solo la contaminaci\xF3n","La necesidad de un ECO","Nada: siempre es falso negativo"],explicacion:"Pr\xE1ctica 4: interpretaci\xF3n de resultados del urocultivo."},{id:"laboratorio-032",nivel:"x",pregunta:"Urocultivo por punci\xF3n suprap\xFAbica con menos de 10\u2074 UFC/mL de un solo germen. \xBFC\xF3mo se interpreta?",correcta:"Puede ser significativo: la regla de contaminaci\xF3n bajo 10\u2074 no se aplica a la punci\xF3n suprap\xFAbica",distractores:["Es contaminaci\xF3n","Es negativo","Hay que repetir con chorro medio","Solo cuenta si supera 10\u2075"],explicacion:"Pr\xE1ctica 4: menos de 10\u2074 UFC/mL es probable contaminaci\xF3n, excepto en punci\xF3n suprap\xFAbica."}]};var ki={id:"tratamientos",nombre:"Tratamientos",descripcion:"Qu\xE9 antimicrobiano elegir en cada caso",resumen:`Cuadro \u2192 tratamiento de elecci\xF3n.
\u2022 Aspergilosis invasiva: voriconazol. Mucormicosis: anfotericina B liposomal y cirug\xEDa.
\u2022 Candidemia: equinocandina y retirar el cat\xE9ter.
\u2022 MRSA: vancomicina. BLEE grave: carbapen\xE9mico.
\u2022 TB: HRZE 2 meses + HR 4 meses; resistente a rifampicina: BPaLM.
En bacterias, en el examen agrega siempre 'seg\xFAn el antibiograma'.`,preguntas:[{id:"tratamientos-001",nivel:"f",pregunta:"Paciente neutrop\xE9nico con aspergilosis invasiva. Tratamiento de elecci\xF3n:",correcta:"Voriconazol",distractores:["Fluconazol","Nistatina","Terbinafina"],pista:"Es un azol activo contra mohos.",explicacion:"El fluconazol tiene poca actividad contra Aspergillus."},{id:"tratamientos-002",nivel:"m",pregunta:"Candidemia por C. albicans en paciente con cat\xE9ter venoso central:",correcta:"Equinocandina y retirar el cat\xE9ter",distractores:["Nistatina oral","Fluconazol sin retirar el cat\xE9ter","Terbinafina"],pista:"Hay que eliminar el reservorio.",explicacion:"El biofilm del cat\xE9ter no se erradica solo con antif\xFAngicos."},{id:"tratamientos-003",nivel:"m",pregunta:"Mucormicosis rinocerebral en diab\xE9tico con cetoacidosis:",correcta:"Anfotericina B liposomal, desbridamiento quir\xFArgico y corregir la cetoacidosis",distractores:["Fluconazol oral","Voriconazol solo","Caspofungina"],pista:"Los mucorales son resistentes a varios azoles.",explicacion:"La cirug\xEDa es urgente."},{id:"tratamientos-004",nivel:"m",pregunta:"Fungemia por Rhodotorula asociada a cat\xE9ter:",correcta:"Retirar el cat\xE9ter y anfotericina B",distractores:["Fluconazol","Caspofungina","No requiere tratamiento"],pista:"Resiste fluconazol y equinocandinas.",explicacion:"El cat\xE9ter es el reservorio."},{id:"tratamientos-005",nivel:"f",pregunta:"Onicomicosis por Trichophyton rubrum:",correcta:"Terbinafina oral por 12 semanas",distractores:["Nistatina t\xF3pica","Griseofulvina t\xF3pica","Fluconazol una dosis"],pista:"Lo t\xF3pico no alcanza la u\xF1a.",explicacion:"Se suma tratamiento t\xF3pico en la piel."},{id:"tratamientos-006",nivel:"f",pregunta:"Cistitis no complicada por E. coli:",correcta:"Nitrofuranto\xEDna o fosfomicina, seg\xFAn antibiograma",distractores:["Meropenem","Vancomicina","Fluconazol"],pista:"Antibi\xF3ticos que se concentran en orina.",explicacion:"Se reservan los carbapen\xE9micos para infecciones graves o BLEE."},{id:"tratamientos-007",nivel:"m",pregunta:"Infecci\xF3n grave por enterobacteria productora de BLEE:",correcta:"Meropenem",distractores:["Ceftriaxona","Amoxicilina","Ampicilina"],pista:"Las cefalosporinas quedan inactivas.",explicacion:"Los carbapen\xE9micos son de elecci\xF3n; en cistitis no complicada, fosfomicina."},{id:"tratamientos-008",nivel:"f",pregunta:"Infecci\xF3n por S. aureus resistente a meticilina:",correcta:"Vancomicina",distractores:["Oxacilina","Cefalexina","Amoxicilina"],pista:"MRSA resiste todos los \u03B2-lact\xE1micos.",explicacion:"Alternativas: daptomicina o linezolid."},{id:"tratamientos-009",nivel:"f",pregunta:"Tuberculosis pulmonar con baciloscop\xEDa positiva, sensible:",correcta:"HRZE 2 meses y HR 4 meses",distractores:["Rifampicina sola 6 meses","Isoniazida sola 9 meses","BPaLM"],pista:"Cuatro f\xE1rmacos en la fase intensiva.",explicacion:"Supervisado; la segunda fase es 3 veces por semana."},{id:"tratamientos-010",nivel:"d",pregunta:"Tuberculosis resistente a rifampicina detectada por GeneXpert:",correcta:"BPaLM: bedaquilina, pretomanid, linezolid y moxifloxacino",distractores:["HRZE est\xE1ndar","Rifampicina a doble dosis","Isoniazida sola"],pista:"Es el esquema para resistentes.",explicacion:"Sin rifampicina, el esquema est\xE1ndar falla."},{id:"tratamientos-011",nivel:"f",pregunta:"Tricomoniasis:",correcta:"Metronidazol a la paciente y a su pareja",distractores:["Fluconazol","Nistatina vaginal","Amoxicilina"],pista:"Es una ITS.",explicacion:"Si no se trata a la pareja, se reinfecta."},{id:"tratamientos-012",nivel:"f",pregunta:"Muguet (candidiasis oral) en un lactante:",correcta:"Nistatina oral en suspensi\xF3n",distractores:["Anfotericina B intravenosa","Griseofulvina","Voriconazol"],pista:"Tratamiento local.",explicacion:"Es una infecci\xF3n superficial."},{id:"tratamientos-013",nivel:"m",pregunta:"Candiduria en paciente diab\xE9tica con sonda vesical:",correcta:"Retirar o cambiar la sonda; fluconazol si hay s\xEDntomas",distractores:["Anfotericina B siempre","Caspofungina siempre","No hacer nada nunca"],pista:"La sonda es el problema.",explicacion:"La candiduria asintom\xE1tica muchas veces no requiere antif\xFAngico."},{id:"tratamientos-014",nivel:"m",pregunta:"Paciente con gota que inicia tratamiento para tuberculosis. \xBFQu\xE9 f\xE1rmaco est\xE1 contraindicado?",correcta:"Pirazinamida",distractores:["Rifampicina","Etambutol","Isoniazida"],pista:"Eleva el \xE1cido \xFArico.",explicacion:"La pirazinamida produce hiperuricemia."},{id:"tratamientos-015",nivel:"d",pregunta:"Lactante con sordera neurosensorial; la madre recibi\xF3 un antituberculoso inyectable en el embarazo:",correcta:"Estreptomicina",distractores:["Isoniazida","Rifampicina","Etambutol"],pista:"Es un aminogluc\xF3sido.",explicacion:"Los aminogluc\xF3sidos son otot\xF3xicos."},{id:"tratamientos-016",nivel:"d",pregunta:"\xBFC\xF3mo se reduce la nefrotoxicidad de la anfotericina B desoxicolato?",correcta:"Soluci\xF3n salina isot\xF3nica antes de la infusi\xF3n",distractores:["Furosemida despu\xE9s de la infusi\xF3n","Dopamina","Coloides antes de la infusi\xF3n"],pista:"Carga de sodio.",explicacion:"La sal protege el ri\xF1\xF3n frente a la vasoconstricci\xF3n."},{id:"tratamientos-017",nivel:"m",pregunta:"Histoplasmosis diseminada en paciente con VIH:",correcta:"Anfotericina B liposomal y luego itraconazol",distractores:["Fluconazol t\xF3pico","Nistatina","Solo antirretrovirales"],pista:"Primero lo m\xE1s potente, luego mantenimiento oral.",explicacion:"Itraconazol en formas leves o como continuaci\xF3n."},{id:"tratamientos-018",nivel:"f",pregunta:"Malaria por Plasmodium falciparum:",correcta:"Combinaci\xF3n con artemisinina",distractores:["Cloroquina","Ivermectina","Albendazol"],pista:"Hay mucha resistencia a cloroquina.",explicacion:"Las terapias combinadas con artemisinina son de elecci\xF3n."},{id:"tratamientos-019",nivel:"m",pregunta:"Antituberculoso que Proteus mirabilis en paciente con sonda:",correcta:"Ceftriaxona o ciprofloxacino seg\xFAn antibiograma, cambiar la sonda y no usar nitrofuranto\xEDna",distractores:["Nitrofuranto\xEDna sola","Fluconazol","Retirar la sonda sin antibi\xF3tico"],pista:"Proteus tiene una resistencia natural.",explicacion:"Banco de laboratorio, caso C17."},{id:"tratamientos-026",nivel:"d",pregunta:"Neumon\xEDa por Klebsiella pneumoniae productora de BLEE:",correcta:"Meropenem",distractores:["Ceftriaxona","Amoxicilina","Ampicilina"],pista:"Las cefalosporinas quedan inactivas.",explicacion:"Banco de laboratorio, caso C18."},{id:"tratamientos-027",nivel:"d",pregunta:"Otomicosis por Aspergillus niger:",correcta:"Limpieza del conducto y clotrimazol t\xF3pico",distractores:["Anfotericina B intravenosa","Voriconazol oral siempre","Griseofulvina"],pista:"Es una infecci\xF3n superficial.",explicacion:"Banco de laboratorio, caso C5."},{id:"tratamientos-028",nivel:"d",pregunta:"Esporotricosis linfocut\xE1nea: alternativa al itraconazol:",correcta:"Yoduro de potasio",distractores:["Nistatina","Fluconazol t\xF3pico","Caspofungina"],pista:"Es una opci\xF3n cl\xE1sica y barata.",explicacion:"Banco de laboratorio, caso C9."},{id:"tratamientos-029",nivel:"x",pregunta:"K. pneumoniae productora de carbapenemasa (KPC) en UCI. \xBFOpci\xF3n de tratamiento?",correcta:"Ceftazidima-avibactam o colistina, con infectolog\xEDa",distractores:["Meropenem a dosis alta","Ceftriaxona","Amoxicilina-clavul\xE1nico","Vancomicina"],explicacion:"Banco de laboratorio, caso C19."},{id:"tratamientos-030",nivel:"x",pregunta:"Aspergilosis invasiva por A. terreus. \xBFQu\xE9 f\xE1rmaco NO conviene?",correcta:"Anfotericina B",distractores:["Voriconazol","Los dos sirven igual","Ninguno: no se trata","Natamicina t\xF3pica sola"],explicacion:"Pr\xE1ctica 6: A. terreus es resistente a la anfotericina B."},{id:"tratamientos-031",nivel:"x",pregunta:"Cistitis no complicada por E. coli BLEE, sensible a fosfomicina. Tratamiento:",correcta:"Fosfomicina",distractores:["Meropenem intravenoso","Ceftriaxona","Amoxicilina-clavul\xE1nico","Vancomicina"],explicacion:"Banco de laboratorio, caso C16: en cistitis no complicada por BLEE, fosfomicina."},{id:"tratamientos-032",nivel:"x",pregunta:"Fungemia por Rhodotorula. \xBFPor qu\xE9 no se usan fluconazol ni caspofungina?",correcta:"Es resistente a ambos: se usa anfotericina B y se retira el cat\xE9ter",distractores:["Porque no llegan a la sangre","Porque son t\xF3xicos en pacientes con cat\xE9ter","S\xED se usan: son de elecci\xF3n","Porque Rhodotorula es una bacteria"],explicacion:"Banco de laboratorio, pregunta 28 y caso C14; Pr\xE1ctica 6."},{id:"tratamientos-033",nivel:"x",pregunta:"GeneXpert: M. tuberculosis resistente a rifampicina. \xBFPor qu\xE9 no sirve el esquema HRZE?",correcta:"La rifampicina es la base del esquema; se usa el esquema para resistentes (BPaLM)",distractores:["S\xED sirve si se alarga a 12 meses","Basta con duplicar la isoniazida","Se cambia solo el etambutol","No se trata hasta tener cultivo"],explicacion:"Banco de laboratorio, caso C22."}]};var wi={id:"contagio",nombre:"C\xF3mo te contagias",descripcion:"Mapa de v\xEDas de transmisi\xF3n",resumen:`Seg\xFAn lo visto en las pr\xE1cticas:
\u2022 V\xEDa fecal-oral: Salmonella, Shigella, Campylobacter, E. coli pat\xF3genas; Giardia y Entamoeba (quistes).
\u2022 V\xEDa urinaria ascendente: E. coli; Proteus y Pseudomonas en pacientes con sonda.
\u2022 Inhalaci\xF3n de esporas del ambiente: Aspergillus, Rhizopus (sobre todo en inmunodeprimidos y diab\xE9ticos).
\u2022 Inoculaci\xF3n: Sporothrix por espina de rosal; Fusarium por trauma vegetal en el ojo.
\u2022 Contacto con mascotas: Microsporum canis (gatos y perros).
\u2022 Dispositivos invasivos: Candida y Rhodotorula por cat\xE9ter.
\u2022 V\xEDa a\xE9rea: Mycobacterium tuberculosis.
\u2022 Transmisi\xF3n sexual: Trichomonas vaginalis; tambi\xE9n VIH y virus del papiloma humano.
\u2022 Picadura de vectores: Plasmodium (Anopheles), Leishmania y Bartonella (titira), Trypanosoma cruzi (chinche besucona), dengue (mosquito).
\u2022 Alimentos o agua contaminados: Fasciola (berros crudos), huevos de Taenia solium (cisticercosis), Echinococcus (contacto con perros).
\u2022 V\xEDa respiratoria: influenza, virus sincitial respiratorio, adenovirus.`,preguntas:[]};var Gi={id:"casos",nombre:"Casos cl\xEDnicos",descripcion:"Casos para diagnosticar",resumen:`C\xF3mo resolver un caso:
1. Ubica al paciente: edad, inmunidad, antecedentes (diabetes, cat\xE9ter, viajes, mascotas, ocupaci\xF3n).
2. Busca el dato clave del laboratorio: tinci\xF3n, morfolog\xEDa, cultivo o prueba r\xE1pida.
3. Une ambos: el antecedente te dice qu\xE9 buscar y el laboratorio lo confirma.
4. Piensa el tratamiento: en bacterias, siempre seg\xFAn el antibiograma.`,preguntas:[{id:"casos-001",nivel:"m",caso:"Paciente inmunosuprimido con fiebre, tos y hemoptisis. Infiltrados pulmonares, galactomanano positivo y cultivo con hifas septadas ramificadas a 45\xB0.",correcta:"Aspergilosis invasiva",distractores:["Candidiasis oral","Histoplasmosis","Ti\xF1a capitis"],pista:"Inmunosupresi\xF3n y galactomanano.",explicacion:"Tratamiento: voriconazol."},{id:"casos-002",nivel:"f",caso:"Adulto con diarrea acuosa profusa tipo 'agua de arroz' y deshidrataci\xF3n r\xE1pida. Bacilos Gram negativos curvos, oxidasa positiva.",correcta:"C\xF3lera",distractores:["Shigelosis","Rotavirosis","Giardiasis"],pista:"El tipo de diarrea es la clave.",explicacion:"Lo principal es la rehidrataci\xF3n."},{id:"casos-003",nivel:"f",caso:"Viajero con fiebre c\xEDclica, esplenomegalia y anemia. La gota gruesa muestra trofozo\xEDtos en anillo dentro de los hemat\xEDes.",correcta:"Malaria",distractores:["Leishmaniasis","Dengue","Enfermedad de Chagas"],pista:"Fiebre c\xEDclica y formas en anillo.",explicacion:"P. falciparum: combinaci\xF3n con artemisinina."},{id:"casos-004",nivel:"m",caso:"Diab\xE9tico en cetoacidosis con dolor facial, edema periorbitario y escara negra en el paladar. Biopsia con hifas anchas no septadas, ramificadas en \xE1ngulo recto.",correcta:"Mucormicosis rinocerebral",distractores:["Aspergilosis pulmonar","Histoplasmosis","Candidiasis oral"],pista:"Hifas anchas sin tabiques.",explicacion:"Anfotericina B liposomal y desbridamiento urgente."},{id:"casos-005",nivel:"m",caso:"Nadador con dolor y prurito de o\xEDdo. En la otoscopia hay detritus con puntos negros y el cultivo da colonias negras.",correcta:"Otomicosis por Aspergillus niger",distractores:["Otitis media aguda","Sinusitis","Miringitis bacteriana"],pista:"Colonias negras en el conducto.",explicacion:"Limpieza del conducto y clotrimazol t\xF3pico."},{id:"casos-006",nivel:"f",caso:"Lactante de 2 meses con placas blancas en lengua y mucosa oral que se desprenden y dejan la base roja.",correcta:"Candidiasis oral (muguet)",distractores:["Herpes labial","Aftas","Leucoplasia"],pista:"Se desprenden al raspar.",explicacion:"Nistatina oral en suspensi\xF3n."},{id:"casos-007",nivel:"d",caso:"Var\xF3n de 60 a\xF1os con TB antigua y caverna residual. Hemoptisis; la radiograf\xEDa muestra una masa redonda dentro de la caverna con una media luna de aire.",correcta:"Aspergiloma (bola f\xFAngica)",distractores:["Reactivaci\xF3n de tuberculosis","C\xE1ncer de pulm\xF3n","Absceso pulmonar"],pista:"El hongo coloniza una cavidad previa.",explicacion:"Cirug\xEDa; embolizaci\xF3n si la hemoptisis es masiva."},{id:"casos-008",nivel:"d",caso:"Asm\xE1tico de 30 a\xF1os que empeora, con tapones de moco marr\xF3n, eosinofilia, IgE muy elevada y bronquiectasias centrales.",correcta:"Aspergilosis broncopulmonar al\xE9rgica (ABPA)",distractores:["Aspergilosis invasiva","Tuberculosis","Neumon\xEDa por Klebsiella"],pista:"Es al\xE9rgica, no invasiva.",explicacion:"Corticoides sist\xE9micos e itraconazol."},{id:"casos-009",nivel:"m",caso:"Agricultor golpeado en el ojo con una rama. D\xEDas despu\xE9s: ojo rojo, \xFAlcera corneal de bordes plumosos e hipopi\xF3n. Se ven macroconidias en canoa.",correcta:"Queratitis por Fusarium",distractores:["Conjuntivitis bacteriana","Queratitis herp\xE9tica","Uve\xEDtis"],pista:"Trauma vegetal y canoas.",explicacion:"Natamicina t\xF3pica."},{id:"casos-010",nivel:"f",caso:"Ni\xF1o de 7 a\xF1os con gato. Placas de alopecia con descamaci\xF3n gris\xE1cea en el cuero cabelludo; l\xE1mpara de Wood positiva; macroconidios en huso.",correcta:"Tinea capitis por Microsporum canis",distractores:["Alopecia areata","Dermatitis seborreica","Tinea capitis por T. rubrum"],pista:"Huso de pared gruesa y mascota.",explicacion:"Griseofulvina oral; revisar a la mascota."},{id:"casos-011",nivel:"m",caso:"Deportista con prurito y descamaci\xF3n entre los dedos del pie y una u\xF1a gruesa y amarilla. Colonia blanca con reverso rojo vino.",correcta:"Tinea pedis y onicomicosis por Trichophyton rubrum",distractores:["Candidiasis interdigital","Psoriasis ungueal","Tinea pedis por Epidermophyton"],pista:"El reverso rojo vino.",explicacion:"Terbinafina oral por 12 semanas."},{id:"casos-012",nivel:"m",caso:"Jardinera que se pinch\xF3 con un rosal. N\xF3dulo que se ulcera en la mano y luego n\xF3dulos en cadena que suben por el brazo.",correcta:"Esporotricosis linfocut\xE1nea",distractores:["Celulitis estreptoc\xF3cica","Leishmaniasis","Tuberculosis cut\xE1nea"],pista:"Sigue el trayecto de los linf\xE1ticos.",explicacion:"Itraconazol 3 a 6 meses."},{id:"casos-013",nivel:"d",caso:"Agricultor de la selva con tos cr\xF3nica y BK negativa, \xFAlceras orales moriformes y adenopat\xEDas cervicales. En el esputo hay levaduras en 'rueda de tim\xF3n'.",correcta:"Paracoccidioidomicosis",distractores:["Tuberculosis","Histoplasmosis","Leishmaniasis mucosa"],pista:"Rueda de tim\xF3n.",explicacion:"Itraconazol; en casos graves, anfotericina B."},{id:"casos-014",nivel:"m",caso:"Paciente con VIH y CD4 bajos que visit\xF3 cuevas con murci\xE9lagos en Tingo Mar\xEDa. Fiebre, baja de peso, hepatoesplenomegalia y pancitopenia.",correcta:"Histoplasmosis diseminada",distractores:["Tuberculosis miliar","Linfoma","Leishmaniasis visceral"],pista:"Cuevas y murci\xE9lagos.",explicacion:"Anfotericina B liposomal y luego itraconazol."},{id:"casos-015",nivel:"m",caso:"Paciente en UCI con cat\xE9ter venoso central y fiebre. El hemocultivo muestra levaduras con tubo germinal positivo.",correcta:"Candidemia por Candida albicans",distractores:["Fungemia por Rhodotorula","Criptococosis","Bacteriemia por S. aureus"],pista:"El tubo germinal identifica a una especie.",explicacion:"Equinocandina y retirar el cat\xE9ter."},{id:"casos-016",nivel:"m",caso:"Paciente oncol\xF3gico con cat\xE9ter. El hemocultivo da una levadura rosada, sin hifas.",correcta:"Fungemia por Rhodotorula",distractores:["Candidemia por C. albicans","Aspergilosis","Criptococosis"],pista:"El color es la clave.",explicacion:"Retirar el cat\xE9ter y anfotericina B."},{id:"casos-017",nivel:"f",caso:"Mujer de 24 a\xF1os con disuria. Nitritos y esterasa positivos, 30 leucocitos por campo. Urocultivo: 150 colonias (asa de 0.001 mL) rosadas en MacConkey; indol +, citrato \u2212.",correcta:"Cistitis por E. coli",distractores:["Pielonefritis por Proteus","Muestra contaminada","Uretritis por Trichomonas"],pista:"150 \xD7 1000 = 1.5 \xD7 10\u2075 UFC/mL.",explicacion:"Nitrofuranto\xEDna o fosfomicina seg\xFAn antibiograma."},{id:"casos-018",nivel:"m",caso:"Anciano con sonda vesical. Orina de pH 8.5, olor amoniacal y cristales de estruvita. Colonias incoloras en MacConkey, swarming en agar sangre, ureasa +++ y H\u2082S +.",correcta:"ITU complicada por Proteus mirabilis",distractores:["Cistitis por E. coli","Candiduria","ITU por Klebsiella"],pista:"Swarming y ureasa.",explicacion:"Cambiar la sonda; no usar nitrofuranto\xEDna (resistencia natural)."},{id:"casos-019",nivel:"f",caso:"Paciente alcoh\xF3lico con neumon\xEDa del l\xF3bulo superior derecho y esputo 'en jalea de grosella'. Colonias rosadas muy mucoides, indol \u2212, citrato +, inm\xF3vil.",correcta:"Neumon\xEDa por Klebsiella pneumoniae",distractores:["Neumon\xEDa neumoc\xF3cica","Tuberculosis","Aspergilosis"],pista:"Jalea de grosella y colonias mucoides.",explicacion:"Ceftriaxona; si es BLEE, meropenem."},{id:"casos-020",nivel:"f",caso:"Var\xF3n de 40 a\xF1os con tos de m\xE1s de 2 semanas, baja de peso y sudoraci\xF3n nocturna. Ziehl-Neelsen: 25 BAAR en 100 campos.",correcta:"Tuberculosis pulmonar con baciloscop\xEDa positiva",distractores:["Neumon\xEDa bacteriana","Paracoccidioidomicosis","C\xE1ncer de pulm\xF3n"],pista:"BAAR en el esputo.",explicacion:"HRZE 2 meses y HR 4 meses, supervisado."},{id:"casos-021",nivel:"f",caso:"Mujer con flujo vaginal amarillo-verdoso espumoso y prurito. En el sedimento urinario se ve un protozoo en forma de pera, con flagelos, que se mueve.",correcta:"Tricomoniasis",distractores:["Candidiasis vaginal","Vaginosis bacteriana","Gonorrea"],pista:"Pera con flagelos.",explicacion:"Metronidazol a la paciente y a su pareja."},{id:"casos-022",nivel:"d",caso:"Paciente de Ja\xE9n con baja de peso, dolor abdominal y diarrea; asm\xE1tico con corticoides cr\xF3nicos. En heces se ven larvas rabditiformes.",correcta:"Estrongiloidiasis",distractores:["Ascariasis","Toxocariasis","Anquilostomiasis"],pista:"Larvas, no huevos, en heces.",explicacion:"Riesgo de hiperinfecci\xF3n por los corticoides."},{id:"casos-023",nivel:"m",caso:"Ganadero con dolor en hipocondrio derecho, fiebre intermitente y eosinofilia marcada. Come berros crudos. En heces: huevos grandes, ovalados y operculados.",correcta:"Fasciolosis",distractores:["Hidatidosis","Amebiasis hep\xE1tica","Colecistitis"],pista:"Berros y huevos operculados.",explicacion:"Triclabendazol."},{id:"casos-024",nivel:"m",caso:"Mujer que volvi\xF3 del oriente peruano con una lesi\xF3n que pas\xF3 de m\xE1cula a n\xF3dulo indoloro con costra adherida. En el frotis, par\xE1sitos dentro de macr\xF3fagos.",correcta:"Leishmaniasis cut\xE1nea",distractores:["Esporotricosis","Histoplasmosis","Escabiosis"],pista:"Lo transmite un fleb\xF3tomo.",explicacion:"Se confirma con frotis o cultivo de la lesi\xF3n."},{id:"casos-025",nivel:"f",caso:"Escolar de 6 a\xF1os con 3 semanas de heces f\xE9tidas, voluminosas y grasosas que flotan, dolor c\xF3lico y distensi\xF3n. En heces: trofozo\xEDtos binucleados.",correcta:"Giardiasis",distractores:["Amebiasis","Shigelosis","Estrongiloidiasis"],pista:"Binucleados, 'como una cara'.",explicacion:"Metronidazol."},{id:"casos-026",nivel:"d",caso:"Var\xF3n de 70 a\xF1os con bacteriemia por E. coli. Antibiograma: resistente a ceftriaxona y cefoxitina, sin sinergia con clavul\xE1nico, sensible a cefepime y meropenem.",pregunta:"\xBFQu\xE9 mecanismo de resistencia sugiere?",correcta:"AmpC",distractores:["BLEE","Carbapenemasa","E. coli sensible"],pista:"Cefoxitina resistente y sin sinergia.",explicacion:"La BLEE se inhibe con clavul\xE1nico y es sensible a cefoxitina."},{id:"casos-027",nivel:"d",caso:"Ni\xF1o de un valle interandino con fiebre, palidez intensa e ictericia. En el frotis de sangre hay bacilos dentro de los hemat\xEDes.",correcta:"Bartonelosis aguda (fiebre de la Oroya)",distractores:["Malaria","Leptospirosis","Hepatitis A"],pista:"Enfermedad de Carri\xF3n.",explicacion:"Bartonella bacilliformis, transmitida por la titira (Lutzomyia)."},{id:"casos-028",nivel:"x",caso:"Paciente en UCI con neumon\xEDa asociada a ventilador. Bacilo Gram negativo no fermentador, oxidasa positivo, pigmento verde. Resistente a ceftazidima, cefepime, imipenem y meropenem; sensible solo a colistina.",pregunta:"\xBFQu\xE9 es y qu\xE9 mecanismo sospechas?",correcta:"Pseudomonas aeruginosa resistente a carbapen\xE9micos: p\xE9rdida de porina o carbapenemasa",distractores:["Pseudomonas con BLEE sola","Klebsiella productora de KPC","Acinetobacter sensible","Contaminaci\xF3n por Stenotrophomonas"],explicacion:"La BLEE sola no explica la resistencia a carbapen\xE9micos."},{id:"casos-029",nivel:"x",caso:"Diab\xE9tica de 55 a\xF1os en cetoacidosis recibi\xF3 voriconazol por 'sinusitis f\xFAngica'. Empeora con escara negra en el cornete y proptosis. Biopsia: hifas anchas en cinta.",pregunta:"\xBFQu\xE9 pas\xF3 y cu\xE1l es la conducta?",correcta:"Mucormicosis no cubierta por voriconazol: anfotericina B liposomal, desbridamiento urgente y corregir la cetoacidosis",distractores:["Aspergilosis resistente: subir voriconazol","Fusariosis: natamicina","Celulitis bacteriana: vancomicina","Candidiasis: fluconazol"],explicacion:"Las hifas anchas sin tabiques no son de Aspergillus."},{id:"casos-030",nivel:"x",caso:"Var\xF3n que inici\xF3 HRZE hace 3 semanas. Ahora tiene ictericia y transaminasas 6 veces el valor normal.",pregunta:"\xBFQu\xE9 haces?",correcta:"Suspender isoniazida, rifampicina y pirazinamida y reintroducirlas de forma escalonada al normalizarse",distractores:["Seguir igual: es esperable","Suspender solo el etambutol","Cambiar a BPaLM definitivamente","Agregar corticoides y seguir"],explicacion:"Los tres primeros son hepatot\xF3xicos; el etambutol no."},{id:"casos-031",nivel:"x",caso:"Ni\xF1o con tos, sibilancias y eosinofilia marcada; semanas despu\xE9s, dolor abdominal. En heces hay huevos mamelonados.",pregunta:"Diagn\xF3stico y explicaci\xF3n de la tos:",correcta:"Ascariasis: las larvas pasan por el pulm\xF3n (s\xEDndrome de L\xF6ffler) antes de llegar al intestino",distractores:["Strongyloides: hiperinfecci\xF3n","Toxocariasis: larva migrans visceral","Enterobius: migraci\xF3n perianal","Asma al\xE9rgica sin relaci\xF3n con el par\xE1sito"],explicacion:"El ciclo pulmonar explica la fase respiratoria antes de la intestinal."},{id:"casos-032",nivel:"x",caso:"Mujer con cistitis no complicada. Urocultivo: E. coli resistente a ceftriaxona con sinergia con clavul\xE1nico; sensible a fosfomicina, nitrofuranto\xEDna y meropenem.",pregunta:"\xBFMejor tratamiento?",correcta:"Fosfomicina o nitrofuranto\xEDna oral",distractores:["Meropenem intravenoso","Ceftriaxona intramuscular","Amoxicilina-clavul\xE1nico","Ciprofloxacino sin mirar el antibiograma"],explicacion:"Una cistitis por BLEE no necesita carbapen\xE9mico si hay opciones orales activas."},{id:"casos-033",nivel:"x",caso:"Paciente en UCI con K. pneumoniae. En el antibiograma no hay halo alrededor de ning\xFAn disco, ni siquiera imipenem ni meropenem.",pregunta:"Diagn\xF3stico y manejo:",correcta:"K. pneumoniae productora de carbapenemasa (KPC): ceftazidima-avibactam o colistina, con infectolog\xEDa",distractores:["BLEE: meropenem","AmpC: cefepime","Contaminaci\xF3n: repetir y no tratar","MRSA: vancomicina"],explicacion:"Banco de laboratorio, caso C19."},{id:"casos-034",nivel:"x",caso:"Paciente con tuberculosis pulmonar. GeneXpert: M. tuberculosis detectado, resistente a rifampicina.",pregunta:"Diagn\xF3stico y tratamiento:",correcta:"TB resistente a rifampicina: esquema BPaLM (bedaquilina, pretomanid, linezolid y moxifloxacino)",distractores:["TB sensible: HRZE 2 meses y HR 4 meses","Contaminaci\xF3n: repetir la baciloscop\xEDa","TB latente: isoniazida sola","Micobacteria no tuberculosa: sin tratamiento"],explicacion:"Banco de laboratorio, caso C22."},{id:"casos-035",nivel:"x",caso:"Mujer con disuria. ECO: 20 c\xE9lulas epiteliales escamosas por campo. Urocultivo: tres tipos de colonias con recuento bajo.",pregunta:"\xBFQu\xE9 haces?",correcta:"Repetir la muestra de chorro medio con higiene previa: est\xE1 contaminada",distractores:["Tratar como infecci\xF3n mixta","Iniciar meropenem","Pedir un hemocultivo","Diagnosticar pielonefritis"],explicacion:"Pr\xE1ctica 4: m\xE1s de 15 c\xE9lulas epiteliales por campo y crecimiento polimicrobiano indican contaminaci\xF3n."},{id:"casos-036",nivel:"x",caso:"Paciente con cat\xE9ter venoso central y fiebre. El hemocultivo muestra una levadura con tubo germinal negativo y colonias rosadas.",pregunta:"Diagn\xF3stico y tratamiento:",correcta:"Fungemia por Rhodotorula: retirar el cat\xE9ter y anfotericina B; no sirven fluconazol ni equinocandinas",distractores:["Candidemia por C. albicans: equinocandina","Candidemia: fluconazol sin retirar el cat\xE9ter","Contaminaci\xF3n: no tratar","Aspergilosis: voriconazol"],explicacion:"Si el tubo germinal fuera positivo, ser\xEDa C. albicans y se tratar\xEDa con equinocandina."},{id:"casos-037",nivel:"x",caso:"Ni\xF1o con diarrea con sangre y fiebre. Coprol\xF3gico: leucocitos y hemat\xEDes, sin par\xE1sitos. Coprocultivo: colonias lactosa negativas en MacConkey y rojas sin centro negro en XLD.",pregunta:"Diagn\xF3stico m\xE1s probable:",correcta:"Shigelosis (Shigella; en Per\xFA, sobre todo S. flexneri)",distractores:["Salmonelosis","Amebiasis","Giardiasis","Infecci\xF3n por Campylobacter"],explicacion:"Salmonella tendr\xEDa centro negro en XLD; Campylobacter necesita su propio medio en microaerofilia."}]};var ya=[Di,Oi,Bi,Fi,Ui,ki,wi],Pe=Gi;var Io={id:"microscopio",nombre:"Microscopio",descripcion:"Fotos reales del laboratorio, criterios y pares que se confunden",resumen:"Para reconocer una l\xE1mina, mira tres cosas: si las hifas tienen tabiques, qu\xE9 forma tienen los conidios y d\xF3nde est\xE1n. El mapa de cobertura muestra qu\xE9 tenemos de cada estructura."},Q=[{grupo:"Hongos",nombre:"Candida albicans",criterio:"Pseudohifas con blastoconidias en racimos y clamidoconidias redondas de pared gruesa en la punta.",produce:"Candidiasis: muguet, vulvovaginitis, intertrigo, candidemia por cat\xE9ter.",tratamiento:"Muguet: nistatina. Vulvovaginitis: fluconazol. Candidemia: equinocandina y retirar el cat\xE9ter.",clave:"Clamidoconidias redondas en la punta de las pseudohifas."},{grupo:"Hongos",nombre:"Aspergillus",criterio:"Hifas septadas hialinas; conidi\xF3foro largo que termina en una ves\xEDcula con fi\xE1lides y cadenas de conidios radiadas (cabeza aspergilar).",produce:"Aspergilosis invasiva (signo del halo), aspergiloma, ABPA, otomicosis (A. niger).",tratamiento:"Voriconazol. Aspergiloma: cirug\xEDa. ABPA: corticoides e itraconazol.",clave:"Cabeza redonda (ves\xEDcula) en la punta de un tallo largo."},{grupo:"Hongos",nombre:"Fusarium",criterio:"Hifas septadas con macroconidias en canoa o media luna, multiseptadas.",produce:"Queratitis por trauma vegetal o lentes de contacto; fusariosis diseminada en neutrop\xE9nicos.",tratamiento:"Queratitis: natamicina t\xF3pica. Diseminada: voriconazol con o sin anfotericina B.",clave:"Macroconidias en canoa o media luna."},{grupo:"Hongos",nombre:"Trichophyton mentagrophytes",criterio:"Microconidios redondos en racimos, como uvas, e hifas en espiral.",produce:"Tinea pedis inflamatoria, tinea corporis, tinea barbae, querion.",tratamiento:"Terbinafina t\xF3pica u oral.",clave:"Hifas en espiral y microconidios en racimo de uvas."},{grupo:"Hongos",nombre:"Trichophyton rubrum",criterio:"Hifas septadas delgadas con pocos conidios; cuando aparecen, son microconidios en l\xE1grima pegados a la hifa. Colonia con reverso rojo vinoso.",produce:"Tinea pedis cr\xF3nica, onicomicosis, tinea cruris y corporis.",tratamiento:"Terbinafina oral (onicomicosis: 12 semanas).",clave:"Hifas finas casi sin conidios; l\xE1grimas pegadas a la hifa."},{grupo:"Hongos",nombre:"Epidermophyton floccosum",criterio:"Macroconidios en mazo, de pared lisa y 2 a 4 c\xE9lulas, en grupos. Sin microconidios.",produce:"Tinea pedis, cruris, corporis y onicomicosis. Nunca afecta el pelo.",tratamiento:"Terbinafina o azoles t\xF3picos.",clave:"Macroconidios en mazo, lisos, en grupos."},{grupo:"Hongos",nombre:"Cladosporium",criterio:"Hongo demati\xE1ceo (marr\xF3n): conidios peque\xF1os y ovalados en cadenas ramificadas, con c\xE9lulas escudo.",produce:"Contaminante y al\xE9rgeno (asma, rinitis); rara vez feohifomicosis.",tratamiento:"Itraconazol (referencia).",clave:"Conidios peque\xF1os en cadenas ramificadas."},{grupo:"Hongos",nombre:"Alternaria",criterio:"Hongo demati\xE1ceo: conidios grandes, marrones y muriformes (tabiques transversales y longitudinales), en forma de maza con pico, en cadena.",produce:"Al\xE9rgeno (sinusitis f\xFAngica al\xE9rgica, asma); feohifomicosis y queratitis en inmunodeprimidos.",tratamiento:"Itraconazol o voriconazol, con o sin cirug\xEDa (referencia).",clave:"Conidios grandes con tabiques en dos direcciones."},{grupo:"Hongos",nombre:"Paracoccidioides brasiliensis",criterio:"Levadura madre grande con m\xFAltiples gemaciones alrededor: rueda de tim\xF3n.",produce:"Paracoccidioidomicosis: agricultor con tos cr\xF3nica, BK negativa, \xFAlceras orales moriformes y adenopat\xEDas.",tratamiento:"Itraconazol; en casos graves, anfotericina B.",clave:"Rueda de tim\xF3n."},{grupo:"Hongos",nombre:"Sporothrix schenckii",criterio:"Hifas delgadas septadas con conidios en margarita o roseta en la punta (fase moho, 25 \xB0C). En tejido: levaduras en forma de puro.",produce:"Esporotricosis linfocut\xE1nea: pinchazo con rosal o madera y n\xF3dulos en cadena que suben por los linf\xE1ticos.",tratamiento:"Itraconazol (alternativa: yoduro de potasio).",clave:"Conidios en margarita en la punta."},{grupo:"Hongos",nombre:"Rhizopus",criterio:"Hifas anchas, no septadas, con esporangios redondos y rizoides.",produce:"Mucormicosis rinocerebral (diab\xE9tico en cetoacidosis, escara negra en el paladar) o pulmonar (halo invertido).",tratamiento:"Anfotericina B liposomal, desbridamiento quir\xFArgico y control de la glucosa.",clave:"Hifas anchas sin tabiques y esporangios."},{grupo:"Hongos",nombre:"Histoplasma capsulatum",criterio:"Fase moho: macroconidias tuberculadas, redondas con espinas. En tejido: levaduras peque\xF1as dentro de macr\xF3fagos.",produce:"Histoplasmosis: cuevas y murci\xE9lagos (Tingo Mar\xEDa); diseminada en VIH.",tratamiento:"Itraconazol; en casos graves, anfotericina B.",clave:"Macroconidias redondas con espinas."},{grupo:"Hongos",nombre:"Microsporum canis",criterio:"Macroconidios en huso, de pared gruesa y rugosa, con muchos tabiques.",produce:"Tinea capitis en ni\xF1os con gatos o perros; tinea corporis.",tratamiento:"Griseofulvina oral.",clave:"Huso de pared gruesa y rugosa."},{grupo:"Hongos",nombre:"Penicillium",criterio:"Hifas septadas con conidi\xF3foros ramificados en pincel, sin ves\xEDcula, y cadenas de conidios.",produce:"Sobre todo contaminante ambiental.",tratamiento:"Generalmente no requiere tratamiento.",clave:"Pincel sin ves\xEDcula."},{grupo:"Bacterias",nombre:"Mycobacterium tuberculosis",criterio:"Ziehl-Neelsen: bacilos rojos o fucsia, delgados, rectos o curvos, a veces en cordones, sobre fondo azul.",produce:"Tuberculosis pulmonar.",tratamiento:"HRZE 2 meses y HR 4 meses. Si hay resistencia: BPaLM.",clave:"Bacilos rojos sobre fondo azul."},{grupo:"Sedimento urinario",nombre:"Leucocitos",criterio:"C\xE9lulas granulosas con n\xFAcleo lobulado, m\xE1s grandes que los hemat\xEDes. Normal: 0 a 5 por campo.",produce:"M\xE1s de 5 por campo es piuria: infecci\xF3n urinaria (si es intensa, pielonefritis).",tratamiento:"Seg\xFAn urocultivo y antibiograma.",clave:"N\xFAcleo lobulado y granulaciones."},{grupo:"Sedimento urinario",nombre:"C\xE9lulas epiteliales escamosas",criterio:"C\xE9lulas grandes, planas y poligonales, con un n\xFAcleo peque\xF1o central, como huevo frito.",produce:"M\xE1s de 15 por campo indica muestra contaminada.",tratamiento:"Repetir la muestra (chorro medio con higiene previa).",clave:"Huevo frito."},{grupo:"Sedimento urinario",nombre:"Trichomonas vaginalis",criterio:"Protozoo en forma de pera, con flagelos y movimiento.",produce:"Tricomoniasis (ITS): flujo amarillo-verdoso espumoso.",tratamiento:"Metronidazol a la paciente y a su pareja.",clave:"Pera con flagelos que se mueve."},{grupo:"Sedimento urinario",nombre:"Cilindros urinarios",criterio:"Molde alargado de bordes paralelos, formado en los t\xFAbulos renales.",produce:"Hialino: normal o deshidrataci\xF3n. Leucocitario: pielonefritis. Hem\xE1tico: glomerulonefritis. Granuloso: da\xF1o tubular.",tratamiento:"Seg\xFAn la causa.",clave:"Molde alargado de bordes paralelos."},{grupo:"Sedimento urinario",nombre:"Levaduras en orina",criterio:"C\xE9lulas ovaladas con gemaci\xF3n, a veces con pseudohifas.",produce:"Candiduria: diab\xE9tico, paciente con sonda, uso de antibi\xF3ticos.",tratamiento:"Retirar o cambiar la sonda; fluconazol si hay s\xEDntomas.",clave:"Ovaladas con brotes."},{grupo:"Sedimento urinario",nombre:"Hemat\xEDes",criterio:"Discos peque\xF1os y lisos, sin n\xFAcleo, con el centro m\xE1s claro. Normal: 0 a 2 por campo.",produce:"Hematuria: ITU, litiasis, tumor; con cilindros hem\xE1ticos, glomerulonefritis.",tratamiento:"Seg\xFAn la causa.",clave:"Discos sin n\xFAcleo."}],na=[{a:"Aspergillus",b:"Penicillium",diferencia:"Aspergillus termina en una ves\xEDcula redonda; Penicillium se ramifica en pincel y no tiene ves\xEDcula."},{a:"Trichophyton rubrum",b:"Trichophyton mentagrophytes",diferencia:"T. rubrum tiene microconidios en l\xE1grima
